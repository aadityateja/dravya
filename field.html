<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>DRAVYA</title>

<link rel="icon" type="image/png" href="assets/logo.png">

<style>

/* =========================================================
   DRAVYA FIELD — CINEMATIC ENTRY + STATIC FIELD
   ========================================================= */

@font-face {
    font-family: "Dark";
    src: url("assets/fonts/INTERDIM.TTF") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}


/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    overflow: hidden;

    overscroll-behavior: none;
    touch-action: manipulation;

    background: #02050d;
}


/* =========================================================
   PAGE
   ========================================================= */

body {
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
}


/* =========================================================
   ENTRY SCREEN
   ========================================================= */

#entry {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;

    opacity: 1;

    transition:
        opacity 1.6s ease,
        visibility 1.6s ease;
}


/* =========================================================
   ENTRY VIDEO
   ========================================================= */

#entryVideo {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: center center;

    background: #000;

    display: block;
}


/* =========================================================
   ENTRY DARK OVERLAY
   ========================================================= */

.entry-overlay {
    position: absolute;

    inset: 0;

    z-index: 2;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 0, 0, 0.05) 0%,
            rgba(0, 0, 0, 0.35) 100%
        );
}


/* =========================================================
   ENTER BUTTON
   ========================================================= */

.enter-field {
    pointer-events: auto;

    border: 1px solid rgba(255,255,255,0.55);

    background: rgba(0,0,0,0.18);

    color: white;

    padding: 14px 28px;

    font-family: "Dark", sans-serif;

    font-size: clamp(12px, 1.2vw, 17px);

    letter-spacing: 0.18em;

    text-transform: uppercase;

    cursor: pointer;

    backdrop-filter: blur(4px);

    -webkit-backdrop-filter: blur(4px);

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        transform 0.3s ease,
        opacity 0.5s ease;
}

.enter-field:hover {
    background: rgba(255,255,255,0.12);

    border-color: white;

    transform: scale(1.03);
}

.enter-field:active {
    transform: scale(0.98);
}


/* =========================================================
   ENTRY TEXT
   ========================================================= */

.entry-title {

    margin-bottom: 22px;

    color: white;

    font-family: "Dark", sans-serif;

    font-size: clamp(28px, 5vw, 72px);

    letter-spacing: 0.08em;

    text-transform: uppercase;

    text-align: center;

    line-height: 1.05;

    text-shadow:
        0 0 20px rgba(255,255,255,0.25);

}


/* =========================================================
   VIDEO PLAYING STATE
   ========================================================= */

#entry.playing .enter-field {

    opacity: 0;

    pointer-events: none;

}

#entry.playing .entry-title {

    opacity: 0;

    transition: opacity 0.7s ease;

}


/* =========================================================
   STATIC FIELD
   ========================================================= */

#field {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(18, 48, 92, 0.18),
            transparent 45%
        ),
        #02050d;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 1.6s ease;

}


/* =========================================================
   STATIC PAGE VISIBLE
   ========================================================= */

body.field-visible #field {

    opacity: 1;

    pointer-events: auto;

}


/* =========================================================
   CONTENT
   ========================================================= */

.field-content {

    width: 100%;

    max-width: 1200px;

    padding:
        20px
        clamp(20px, 5vw, 70px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


/* =========================================================
   DRAVYA
   ========================================================= */

.logo {

    margin: 0;

    color: white;

    font-family: "Dark", sans-serif;

    font-size: clamp(52px, 9vw, 130px);

    font-weight: normal;

    letter-spacing: 0.08em;

    line-height: 0.95;

    text-align: center;

    white-space: nowrap;

}


/* =========================================================
   LATEST RELEASE
   ========================================================= */

.latest {

    margin-top: clamp(25px, 4vh, 45px);

    color: rgba(255,255,255,0.72);

    font-family: "Dark", sans-serif;

    font-size: clamp(11px, 1vw, 15px);

    letter-spacing: 0.24em;

    text-transform: uppercase;

}


/* =========================================================
   LINKS
   ========================================================= */

.links {

    margin-top: clamp(18px, 3vh, 30px);

    display: flex;

    align-items: center;

    justify-content: center;

    gap: clamp(20px, 4vw, 60px);

    flex-wrap: nowrap;

}


.links a {

    color: white;

    text-decoration: none;

    font-family: "Dark", sans-serif;

    font-size: clamp(15px, 1.4vw, 22px);

    letter-spacing: 0.12em;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;

}


.links a:hover {

    opacity: 0.6;

    transform: translateY(-2px);

}


/* =========================================================
   VERY LARGE DESKTOP
   ========================================================= */

@media (min-width: 1600px) {

    .entry-title {
        font-size: 78px;
    }

}


/* =========================================================
   TABLET
   ========================================================= */

@media (max-width: 900px) {

    .entry-title {
        font-size: clamp(25px, 7vw, 48px);
    }

    .enter-field {
        padding: 13px 24px;
        font-size: 12px;
    }

    .logo {
        font-size: clamp(50px, 13vw, 90px);
    }

}


/* =========================================================
   PHONE
   ========================================================= */

@media (max-width: 600px) {

    #entryVideo {

        /*
         * Keep the entire video visible.
         * No stretching.
         * No cropping.
         * No overflow.
         */
        object-fit: contain;

    }


    .entry-overlay {

        padding:
            env(safe-area-inset-top)
            20px
            env(safe-area-inset-bottom)
            20px;

    }


    .entry-title {

        width: 100%;

        max-width: 92vw;

        font-size: clamp(25px, 9vw, 42px);

        line-height: 1.08;

        letter-spacing: 0.05em;

        margin-bottom: 20px;

    }


    .enter-field {

        max-width: 90vw;

        padding: 13px 20px;

        font-size: 10px;

        letter-spacing: 0.15em;

    }


    .field-content {

        width: 100%;

        padding:
            20px
            18px
            max(20px, env(safe-area-inset-bottom));

    }


    .logo {

        max-width: 100%;

        font-size: clamp(48px, 15vw, 76px);

        letter-spacing: 0.05em;

    }


    .latest {

        margin-top: 25px;

        font-size: 10px;

        letter-spacing: 0.20em;

    }


    .links {

        margin-top: 18px;

        width: 100%;

        gap: 0;

        justify-content: space-between;

    }


    .links a {

        font-size: clamp(13px, 4vw, 17px);

        letter-spacing: 0.08em;

    }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    .entry-title {

        font-size: 23px;

    }

    .enter-field {

        font-size: 9px;

        padding: 12px 17px;

    }

    .logo {

        font-size: 46px;

    }

    .latest {

        margin-top: 20px;

    }

    .links a {

        font-size: 12px;

    }

}


/* =========================================================
   LANDSCAPE PHONE
   ========================================================= */

@media (max-height: 500px) and (orientation: landscape) {

    .entry-title {

        font-size: clamp(22px, 6vw, 40px);

        margin-bottom: 12px;

    }

    .enter-field {

        padding: 10px 20px;

    }

    .logo {

        font-size: clamp(42px, 11vw, 70px);

    }

    .latest {

        margin-top: 15px;

    }

    .links {

        margin-top: 12px;

    }

}


/* =========================================================
   ACCESSIBILITY / REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    #entry,
    #field,
    .enter-field,
    .entry-title,
    .links a {

        transition: none !important;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     CINEMATIC ENTRY
     ======================================================= -->

<section id="entry">

    <video
        id="entryVideo"
        src="assets/0001-0600.mp4"
        playsinline
        preload="auto"
        muted
    ></video>


    <div class="entry-overlay">

        <div class="entry-title">
            ENTER THE DRAVYA FIELD
        </div>

        <button
            class="enter-field"
            id="enterButton"
            type="button"
        >
            ENTER THE DRAVYA FIELD
        </button>

    </div>

</section>



<!-- =======================================================
     STATIC DRAVYA FIELD
     ======================================================= -->

<main id="field">

    <div class="field-content">

        <h1 class="logo">
            DRAVYA
        </h1>

        <div class="latest">
            LATEST RELEASE
        </div>

        <nav class="links">

            <a href="sounds.html">
                SOUNDS
            </a>

            <a href="art.html">
                ART
            </a>

            <a href="fiction.html">
                FICTION
            </a>

        </nav>

    </div>

</main>



<script>

/* =========================================================
   DRAVYA FIELD ENTRY
   ========================================================= */

const entry = document.getElementById("entry");
const video = document.getElementById("entryVideo");
const button = document.getElementById("enterButton");


let started = false;
let finished = false;


/* =========================================================
   START FIELD
   ========================================================= */

function startField() {

    if (started) return;

    started = true;

    entry.classList.add("playing");

    /*
     * Attempt normal inline playback first.
     */
    const playPromise = video.play();

    if (playPromise !== undefined) {

        playPromise.catch(() => {

            /*
             * Some mobile browsers may require
             * a second direct interaction.
             * The click itself is already a user gesture,
             * so retry immediately.
             */

            video.muted = true;

            video.play().catch(() => {});

        });

    }

}


/* =========================================================
   ENTER BUTTON
   ========================================================= */

button.addEventListener("click", startField);


/* =========================================================
   VIDEO ENDED
   ========================================================= */

video.addEventListener("ended", finishField);


/* =========================================================
   FINISH FIELD
   ========================================================= */

function finishField() {

    if (finished) return;

    finished = true;

    /*
     * First fade out the cinematic layer.
     */
    entry.style.opacity = "0";

    /*
     * Then reveal the static field at the same time,
     * creating a smooth crossfade.
     */
    document.body.classList.add("field-visible");

    /*
     * Completely remove the video layer after
     * the transition has finished.
     */
    setTimeout(() => {

        entry.style.visibility = "hidden";
        entry.style.pointerEvents = "none";

        video.pause();

    }, 1700);

}


/* =========================================================
   SAFETY
   ========================================================= */

/*
 * If the browser reports the video as already finished,
 * still transition correctly.
 */
video.addEventListener("timeupdate", () => {

    if (
        video.duration &&
        video.currentTime >= video.duration - 0.05
    ) {

        finishField();

    }

});


/*
 * Prevent accidental scrolling from wheel/touch
 * while keeping normal link clicks functional.
 */
window.addEventListener(
    "wheel",
    event => event.preventDefault(),
    { passive: false }
);

window.addEventListener(
    "touchmove",
    event => event.preventDefault(),
    { passive: false }
);

</script>


</body>
</html>
