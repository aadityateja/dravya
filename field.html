<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>DRAVYA</title>

<link rel="icon" type="image/png" href="assets/logo.png">

<style>

/* =========================================================
   DRAVYA FIELD
   CINEMATIC VIDEO → STATIC FIELD
   ========================================================= */


/* =========================================================
   FONT
   ========================================================= */

@font-face {
    font-family: "Dark";
    src: url("assets/fonts/INTERDIM.TTF") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}


/* =========================================================
   GLOBAL RESET
   ========================================================= */

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #02050d;

    overscroll-behavior: none;

    -webkit-overflow-scrolling: none;

}


body {

    width: 100vw;
    height: 100dvh;

    overflow: hidden;

    position: fixed;

    inset: 0;

}


/* =========================================================
   CINEMATIC VIDEO LAYER
   ========================================================= */

#entry {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: #000;

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transition:
        opacity 1.8s ease,
        visibility 1.8s ease;

}


/* =========================================================
   VIDEO
   ========================================================= */

#entryVideo {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #000;

    /*
     * Desktop:
     * fill the entire viewport.
     */
    object-fit: cover;

    object-position: center center;

}


/* =========================================================
   STATIC FIELD
   ========================================================= */

#field {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #02050d;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 1.8s ease,
        visibility 1.8s ease;

}

    /* =========================================================
   POST-ENTRY VACUUM FLUCTUATION BACKGROUND
   ========================================================= */

#fieldBackground {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center center;

    z-index: 0;

    pointer-events: none;

}

/* =========================================================
   FIELD VISIBLE
   ========================================================= */

body.field-visible #field {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

}


/* =========================================================
   FIELD CONTENT
   ========================================================= */

.field-content {

    position: relative;

    z-index: 2;

    width: 100%;
    max-width: 1200px;

    padding:
        20px
        clamp(20px, 5vw, 70px);

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

}

/* =========================================================
   DRAVYA
   ========================================================= */

.logo {

    color: #ffffff;

    font-family: "Dark", sans-serif;

    font-size: clamp(55px, 9vw, 135px);

    font-weight: normal;

    line-height: 0.95;

    letter-spacing: 0.08em;

    white-space: nowrap;

    text-align: center;

}


/* =========================================================
   LATEST RELEASE
   ========================================================= */

.latest {

    margin-top: clamp(24px, 4vh, 42px);

    color: rgba(255,255,255,0.72);

    font-family: "Dark", sans-serif;

    font-size: clamp(10px, 1vw, 15px);

    font-weight: normal;

    letter-spacing: 0.24em;

    text-transform: uppercase;

    text-align: center;

}


/* =========================================================
   LINKS
   ========================================================= */

.links {

    margin-top: clamp(18px, 3vh, 30px);

    display: flex;

    align-items: center;
    justify-content: center;

    gap: clamp(24px, 4vw, 65px);

    white-space: nowrap;

}


.links a {

    color: #ffffff;

    font-family: "Dark", sans-serif;

    font-size: clamp(14px, 1.4vw, 22px);

    font-weight: normal;

    letter-spacing: 0.12em;

    text-decoration: none;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;

}


.links a:hover {

    opacity: 0.55;

    transform: translateY(-2px);

}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 901px) {

    /*
     * Desktop video fills the viewport.
     * This creates the cinematic "entering the field"
     * effect.
     */

    #entryVideo {

        width: 100vw;
        height: 100vh;

        object-fit: cover;

    }

}


/* =========================================================
   TABLET
   ========================================================= */

@media (min-width: 601px) and (max-width: 900px) {

    #entryVideo {

        width: 100vw;
        height: 100dvh;

        object-fit: cover;

    }

    .logo {

        font-size: clamp(55px, 12vw, 95px);

    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    /*
     * IMPORTANT:
     *
     * On phones we do NOT use "cover".
     *
     * The full Blender video remains visible and centered.
     * This prevents:
     *
     * - cropping
     * - stretching
     * - horizontal overflow
     * - vertical overflow
     */

    #entryVideo {

        width: 100vw;
        height: 100dvh;

        object-fit: contain;

        object-position: center center;

    }


    .field-content {

        width: 100%;

        padding:
            20px
            18px
            max(20px, env(safe-area-inset-bottom));

    }


    .logo {
    width: 100%;
    max-width: 100%;
    font-size: 38px;
    letter-spacing: 0.035em;
    text-align: center;
    white-space: nowrap;
}


    .latest {

        margin-top: 24px;

        font-size: 10px;

        letter-spacing: 0.20em;

    }


    .links {

        width: 100%;

        margin-top: 18px;

        gap: 0;

        justify-content: space-between;

    }


    .links a {

        font-size: clamp(13px, 4vw, 17px);

        letter-spacing: 0.08em;

    }

}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {
    .logo {
        width: 100%;
        font-size: 38px;
        letter-spacing: 0.03em;
        text-align: center;
    }

    .latest {
        margin-top: 18px;
        font-size: 9px;
    }

    .links a {
        font-size: 11px;
    }
}


    .latest {

        margin-top: 20px;

        font-size: 9px;

    }


    .links a {

        font-size: 12px;

    }

}


/* =========================================================
   LANDSCAPE PHONES
   ========================================================= */

@media (
    max-height: 500px
) and (
    orientation: landscape
) {

    #entryVideo {

        width: 100vw;
        height: 100dvh;

        object-fit: contain;

    }


    .logo {

        font-size: clamp(42px, 11vw, 70px);

    }


    .latest {

        margin-top: 14px;

    }


    .links {

        margin-top: 12px;

    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    #entry,
    #field,
    .links a {

        transition: none;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     CINEMATIC FIELD ENTRY

     THIS STARTS AUTOMATICALLY WHEN FIELD.HTML OPENS.
     THERE IS NO SECOND ENTER BUTTON.
     ======================================================= -->

<section id="entry">

    <video
        id="entryVideo"
        src="assets/0001-0600.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
    ></video>

</section>



<!-- =======================================================
     STATIC DRAVYA FIELD

     THIS APPEARS ONLY AFTER THE VIDEO FINISHES.
     ======================================================= -->

<main id="field">

    <video
        id="fieldBackground"
        src="assets/dravya_vacuum_fluctuation_10s.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    ></video>

    <div class="field-content">

        <h1 class="logo">
            DRAVYA
        </h1>


        <div class="latest">
            LATEST RELEASE
        </div>


        <nav class="links">

            <a href="sounds.html">
                SOUNDS
            </a>

            <a href="art.html">
                ART
            </a>

            <a href="fiction.html">
                FICTION
            </a>

        </nav>
<div
    style="
        margin-top: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
    "
>
    <a
        href="YOUR_INSTAGRAM_LINK"
        target="_blank"
        rel="noopener noreferrer"
        style="
            color: rgba(255,255,255,0.55);
            font-family: 'Dark', sans-serif;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-decoration: none;
            transition: opacity 0.3s ease, color 0.3s ease;
        "
        onmouseover="this.style.color='#ffffff'; this.style.opacity='1'"
        onmouseout="this.style.color='rgba(255,255,255,0.55)'; this.style.opacity='1'"
    >
        INSTAGRAM
    </a>

    <a
        href="YOUR_YOUTUBE_LINK"
        target="_blank"
        rel="noopener noreferrer"
        style="
            color: rgba(255,255,255,0.55);
            font-family: 'Dark', sans-serif;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-decoration: none;
            transition: opacity 0.3s ease, color 0.3s ease;
        "
        onmouseover="this.style.color='#ffffff'; this.style.opacity='1'"
        onmouseout="this.style.color='rgba(255,255,255,0.55)'; this.style.opacity='1'"
    >
        YOUTUBE
    </a>
</div>
    </div>

</main>



<script>

/* =========================================================
   DRAVYA FIELD — VIDEO TRANSITION
   ========================================================= */

const entry = document.getElementById("entry");
const video = document.getElementById("entryVideo");

let finished = false;


/* =========================================================
   START VIDEO
   ========================================================= */

function startVideo() {

    const playPromise = video.play();

    if (playPromise !== undefined) {

        playPromise.catch(() => {

            /*
             * Some browsers may block autoplay temporarily.
             * The video is muted, so retrying is safe.
             */

            video.muted = true;

            video.play().catch(() => {});

        });

    }

}


/* =========================================================
   VIDEO FINISHED
   ========================================================= */

function finishField() {

    if (finished) return;

    finished = true;


    /*
     * Begin static page immediately underneath.
     */
    document.body.classList.add("field-visible");


    /*
     * Fade the cinematic video away.
     */
    entry.style.opacity = "0";

    entry.style.pointerEvents = "none";


    /*
     * After the fade completes,
     * completely hide the cinematic layer.
     */

    setTimeout(() => {

        entry.style.visibility = "hidden";

        video.pause();

    }, 1900);

}


/* =========================================================
   NORMAL END EVENT
   ========================================================= */

video.addEventListener(
    "ended",
    finishField
);


/* =========================================================
   SAFETY END DETECTION
   ========================================================= */

video.addEventListener(
    "timeupdate",
    () => {

        if (
            video.duration &&
            video.currentTime >= video.duration - 0.08
        ) {

            finishField();

        }

    }
);


/* =========================================================
   AUTOPLAY
   ========================================================= */

window.addEventListener(
    "load",
    startVideo
);


/* =========================================================
   ABSOLUTELY NO SCROLLING
   ========================================================= */

window.addEventListener(
    "wheel",
    event => {
        event.preventDefault();
    },
    { passive: false }
);


window.addEventListener(
    "touchmove",
    event => {
        event.preventDefault();
    },
    { passive: false }
);


/* =========================================================
   PREVENT TOUCH GESTURES FROM MOVING THE PAGE
   ========================================================= */

document.addEventListener(
    "gesturestart",
    event => {
        event.preventDefault();
    }
);


document.addEventListener(
    "gesturechange",
    event => {
        event.preventDefault();
    }
);


document.addEventListener(
    "gestureend",
    event => {
        event.preventDefault();
    }
);

</script>


</body>

</html>
