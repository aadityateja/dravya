<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>DRAVYA</title>

<link
    rel="icon"
    type="image/png"
    href="assets/logo.png"
>

<style>

/* =========================================================
   FONT
   ========================================================= */

@font-face {
    font-family: "Dark";
    src: url("assets/fonts/INTERDIM.TTF") format("truetype");
}


/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================================
   NO SCROLL — EVER
   ========================================================= */

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    overscroll-behavior: none;

    background: #02050d;
}


/* =========================================================
   PAGE
   ========================================================= */

body {
    color: #eef4ff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   MAIN STATIC FIELD
   ========================================================= */

#field {
    width: 100vw;
    height: 100vh;

    height: 100dvh;

    overflow: hidden;

    display: flex;
    flex-direction: column;
    align-items: center;

    background:
        radial-gradient(
            ellipse at center top,
            rgba(18,52,130,0.18),
            transparent 55%
        ),
        #02050d;
}


/* =========================================================
   VIDEO AREA
   ========================================================= */

.video-wrap {

    width: 100%;
    height: 58vh;

    height: 58dvh;

    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    flex-shrink: 0;
}


/* =========================================================
   VIDEO
   ========================================================= */

#fieldVideo {

    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    object-position: center center;

    background: #000;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content {

    width: 100%;

    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding:
        1rem
        1.5rem
        1.5rem;

    overflow: hidden;
}


/* =========================================================
   DRAVYA
   ========================================================= */

.logo {

    font-family: "Dark", Arial, sans-serif;

    font-size: clamp(
        46px,
        9vw,
        105px
    );

    font-weight: normal;

    line-height: 0.9;

    letter-spacing: 0.08em;

    text-align: center;

    white-space: nowrap;

    margin-bottom: clamp(
        28px,
        4vh,
        48px
    );

    color: #eef4ff;

    text-shadow:
        0 0 45px rgba(35,90,255,0.20);
}


/* =========================================================
   LATEST RELEASE
   ========================================================= */

.latest {

    font-size: 8px;

    letter-spacing: 0.42em;

    color: #59657d;

    margin-bottom: 18px;

    text-align: center;

    white-space: nowrap;
}


/* =========================================================
   LINKS
   ========================================================= */

.links {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: clamp(
        18px,
        4vw,
        55px
    );

    width: 100%;
}


/* =========================================================
   LINK
   ========================================================= */

.links a {

    position: relative;

    color: #9daac0;

    text-decoration: none;

    font-size: clamp(
        9px,
        1vw,
        11px
    );

    letter-spacing: 0.32em;

    white-space: nowrap;

    transition:
        color 0.3s ease,
        opacity 0.3s ease;
}


/* subtle underline */

.links a::after {

    content: "";

    position: absolute;

    left: 0;
    bottom: -7px;

    width: 0;
    height: 1px;

    background: rgba(120,160,255,0.7);

    transition:
        width 0.3s ease;
}


.links a:hover {

    color: #ffffff;
}


.links a:hover::after {

    width: 100%;
}


/* =========================================================
   TABLET / SMALL LAPTOP
   ========================================================= */

@media (max-width: 900px) {

    .video-wrap {

        height: 56dvh;
    }

    .content {

        padding:
            0.75rem
            1rem
            1.25rem;
    }

}


/* =========================================================
   PHONE
   ========================================================= */

@media (max-width: 600px) {

    #field {

        width: 100vw;
        height: 100dvh;

        overflow: hidden;
    }


    .video-wrap {

        width: 100vw;

        /*
         * Keep the video centered.
         * It is allowed to have empty space rather
         * than being cropped or distorted.
         */

        height: 53dvh;

        display: flex;

        align-items: center;
        justify-content: center;

        overflow: hidden;
    }


    #fieldVideo {

        width: 100%;
        height: 100%;

        object-fit: contain;

        object-position: center center;
    }


    .content {

        width: 100vw;

        flex: 1;

        padding:
            0.5rem
            1.2rem
            1rem;

        justify-content: center;

        overflow: hidden;
    }


    .logo {

        font-size: clamp(
            42px,
            15vw,
            78px
        );

        letter-spacing: 0.07em;

        margin-bottom: 28px;
    }


    .latest {

        font-size: 7px;

        letter-spacing: 0.32em;

        margin-bottom: 18px;
    }


    .links {

        gap: 22px;

        flex-wrap: nowrap;
    }


    .links a {

        font-size: 8px;

        letter-spacing: 0.22em;
    }


    .links a::after {

        bottom: -6px;
    }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 380px) {

    .video-wrap {

        height: 50dvh;
    }


    .logo {

        font-size: 39px;

        margin-bottom: 24px;
    }


    .latest {

        font-size: 6px;

        letter-spacing: 0.25em;
    }


    .links {

        gap: 15px;
    }


    .links a {

        font-size: 7px;

        letter-spacing: 0.16em;
    }

}


/* =========================================================
   LANDSCAPE PHONES
   ========================================================= */

@media
    (max-height: 500px)
    and (orientation: landscape) {

    .video-wrap {

        height: 62dvh;
    }


    .logo {

        font-size: 35px;

        margin-bottom: 14px;
    }


    .latest {

        margin-bottom: 10px;
    }


    .links a {

        font-size: 7px;
    }

}

</style>

</head>


<body>


<main id="field">


    <!-- =====================================================
         STATIC VIDEO
         ===================================================== -->

    <div class="video-wrap">

        <video
            id="fieldVideo"
            autoplay
            muted
            playsinline
            webkit-playsinline
            preload="auto"
        >

            <source
                src="assets/0001-0600.mp4"
                type="video/mp4"
            >

        </video>

    </div>


    <!-- =====================================================
         DRAVYA + LINKS
         ===================================================== -->

    <div class="content">


        <div class="logo">
            DRAVYA
        </div>


        <div class="latest">
            LATEST RELEASE
        </div>


        <div class="links">

            <a href="sounds.html">
                SOUNDS
            </a>

            <a href="art.html">
                ART
            </a>

            <a href="fiction.html">
                FICTION
            </a>

        </div>


    </div>


</main>


<script>

/* =========================================================
   VIDEO AUTOPLAY
   ========================================================= */

const video =
    document.getElementById("fieldVideo");


function startVideo() {

    const promise = video.play();

    if (promise !== undefined) {

        promise.catch(() => {
            /* Browser autoplay restriction */
        });

    }

}


startVideo();


/* =========================================================
   MOBILE FALLBACK
   ========================================================= */

document.addEventListener(
    "touchstart",
    () => {

        if (video.paused) {
            startVideo();
        }

    },
    {
        once: true,
        passive: true
    }
);

</script>


</body>

</html>
