<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DRAVYA FIELD</title>

  <style>
    @font-face {
      font-family: "Germania";
      src: url("assets/fonts/SuperKeys.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Germania", sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
    }

    body {
      overflow-x: hidden;
    }

    /* BACKGROUND VIDEO */

    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    .background video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.48;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.35),
          rgba(0,0,0,0.68)
        );
    }

    /* CONTENT */

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      padding: 35px 7vw 80px;
    }

    /* NAV */

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 100px;
    }

    .logo {
      font-size: 28px;
      letter-spacing: 4px;
    }

    .back {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: 2px;
      opacity: 0.75;
      transition: 0.3s ease;
    }

    .back:hover {
      opacity: 1;
    }

    /* TITLE */

    .field-title {
      text-align: center;
      margin-bottom: 80px;
    }

    .field-title h1 {
      font-size: clamp(55px, 9vw, 125px);
      letter-spacing: 12px;
      font-weight: normal;
      line-height: 0.95;
      text-shadow: 0 0 35px rgba(255,255,255,0.18);
    }

    .field-title p {
      margin-top: 25px;
      font-size: 14px;
      letter-spacing: 5px;
      opacity: 0.65;
    }

    /* MAIN NAVIGATION */

    .field-navigation {
      max-width: 850px;
      margin: 0 auto;
    }

    .nav-section {
      margin-bottom: 50px;
    }

    .nav-section a {
      display: block;
      color: #fff;
      text-decoration: none;
      transition: 0.35s ease;
    }

    /* PRIMARY LINKS */

    .primary-link {
      border: 1px solid rgba(255,255,255,0.28);
      padding: 24px 28px;
      margin-bottom: 16px;
      background: rgba(0,0,0,0.22);
      backdrop-filter: blur(6px);
    }

    .primary-link span {
      font-size: 24px;
      letter-spacing: 2px;
    }

    .primary-link:hover {
      border-color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.07);
      transform: translateX(6px);
    }

    /* DIVIDER */

    .divider {
      height: 1px;
      width: 100%;
      background: rgba(255,255,255,0.25);
      margin: 65px 0;
    }

    /* CATEGORY LINKS */

    .category {
      margin-bottom: 45px;
    }

    .category-title {
      font-size: 35px;
      letter-spacing: 5px;
      margin-bottom: 20px;
      opacity: 0.95;
    }

    .category-title::before {
      content: "— ";
      opacity: 0.45;
    }

    .sub-links {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding-left: 28px;
    }

    .sub-link {
      border: 1px solid rgba(255,255,255,0.18);
      padding: 18px 20px;
      font-size: 17px;
      letter-spacing: 2px;
      background: rgba(0,0,0,0.18);
      transition: 0.3s ease;
    }

    .sub-link:hover {
      border-color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.06);
      transform: translateY(-3px);
    }

    /* FOOTER */

    .footer {
      text-align: center;
      margin-top: 100px;
      font-size: 12px;
      letter-spacing: 4px;
      opacity: 0.45;
    }

    /* MOBILE */

    @media (max-width: 650px) {

      .page {
        padding: 25px 6vw 60px;
      }

      .top-nav {
        margin-bottom: 70px;
      }

      .logo {
        font-size: 22px;
      }

      .field-title {
        margin-bottom: 60px;
      }

      .field-title h1 {
        letter-spacing: 7px;
      }

      .primary-link {
        padding: 20px;
      }

      .primary-link span {
        font-size: 19px;
      }

      .category-title {
        font-size: 28px;
      }

      .sub-links {
        grid-template-columns: 1fr;
        padding-left: 0;
      }

      .footer {
        margin-top: 70px;
      }
    }

  </style>
</head>

<body>

  <!-- BACKGROUND -->

  <div class="background">

    <video autoplay muted loop playsinline>
      <source
        src="assets/dravya_vacuum_fluctuation_10s.mp4"
        type="video/mp4"
      >
    </video>

    <div class="overlay"></div>

  </div>


  <!-- PAGE -->

  <main class="page">

    <!-- TOP NAV -->

    <nav class="top-nav">

      <div class="logo">
        DRAVYA
      </div>

      <a href="index.html" class="back">
        EXIT FIELD
      </a>

    </nav>


    <!-- TITLE -->

    <header class="field-title">

      <h1>DRAVYA FIELD</h1>

      <p>
        OBSERVE · DISTURB · CREATE
      </p>

    </header>


    <!-- NAVIGATION -->

    <section class="field-navigation">


      <!-- WHO / WHAT / WHY -->

      <div class="nav-section">

        <a href="why-dravya.html" class="primary-link">
          <span>
            WHO / WHAT / WHY DRAVYA ?
          </span>
        </a>

        <a href="creator.html" class="primary-link">
          <span>
            ABOUT THE CREATOR
          </span>
        </a>

      </div>


      <!-- DIVIDER -->

      <div class="divider"></div>


      <!-- ART -->

      <div class="category">

        <a href="art.html">

          <div class="category-title">
            ART
          </div>

        </a>

      </div>


      <!-- PHYSICS -->

      <div class="category">

        <a href="physics.html">

          <div class="category-title">
            PHYSICS
          </div>

        </a>

      </div>


      <!-- ENTERTAINMENT -->

      <div class="category">

        <div class="category-title">
          ENTERTAINMENT
        </div>

        <div class="sub-links">

          <a href="sounds.html" class="sub-link">
            SOUNDS
          </a>

          <a href="fiction.html" class="sub-link">
            FICTION
          </a>

        </div>

      </div>


    </section>


    <!-- FOOTER -->

    <footer class="footer">
      DRAVYA · A FIELD OF EXCITATIONS
    </footer>

  </main>

</body>
</html>
