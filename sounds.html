<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DRAVYA — Sounds</title>

<meta
    name="description"
    content="DRAVYA Sounds — music by Addy."
>

<link
    rel="icon"
    type="image/png"
    href="assets/logo.png"
>


<style>

    /* =========================================================
       DRAVYA — SOUNDS
       ========================================================= */

    @font-face {

        font-family: "Germania";

        src:
            url("assets/fonts/SuperKeys.ttf")
            format("truetype");

        font-weight: normal;
        font-style: normal;

        font-display: swap;
    }


    /* =========================================================
       RESET
       ========================================================= */

    * {

        margin: 0;
        padding: 0;

        box-sizing: border-box;
    }


    html,
    body {

        width: 100%;
        min-height: 100%;

        overflow-x: hidden;
    }


    body {

        font-family: "Germania", sans-serif;

        background: #02050b;

        color: #ffffff;
    }


    /* =========================================================
       BACKGROUND
       ========================================================= */

    #background-video {

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100vh;

        object-fit: cover;
        object-position: center center;

        z-index: -3;

        pointer-events: none;

        filter:
            brightness(0.48)
            contrast(1.12)
            saturate(1.05);
    }


    .video-overlay {

        position: fixed;

        inset: 0;

        width: 100%;
        height: 100%;

        background:
            rgba(0, 0, 0, 0.28);

        z-index: -2;

        pointer-events: none;
    }


    .field-layer {

        position: fixed;

        inset: 0;

        background:
            radial-gradient(
                circle at center,
                rgba(30, 110, 210, 0.08),
                transparent 65%
            );

        z-index: -1;

        pointer-events: none;
    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    nav {

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;

        padding: 25px 42px;

        display: flex;

        justify-content: space-between;
        align-items: center;

        z-index: 20;

        background:
            linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.52),
                transparent
            );
    }


    .nav-logo {

        font-size: 20px;

        letter-spacing: 0.22em;
    }


    .nav-links {

        display: flex;

        align-items: center;

        gap: 30px;
    }


    .nav-links a {

        color:
            rgba(255, 255, 255, 0.78);

        text-decoration: none;

        font-size: 14px;

        letter-spacing: 0.10em;

        transition:
            opacity 0.3s ease,
            color 0.3s ease;
    }


    .nav-links a:hover {

        color: #ffffff;

        opacity: 1;

        text-shadow:
            0 0 12px
            rgba(120, 190, 255, 0.8);
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {

        position: relative;

        z-index: 2;

        width: 100%;
        min-height: 100vh;

        display: flex;

        align-items: center;
        justify-content: center;

        padding:
            130px 30px 70px;
    }


    .sounds-content {

        width: 100%;

        max-width: 1000px;

        text-align: center;
    }


    /* =========================================================
       SOUNDS
       ========================================================= */

    .sounds-title {

        color: #ffffff;

        font-size:
            clamp(
                58px,
                11vw,
                135px
            );

        line-height: 0.9;

        font-weight: normal;

        letter-spacing: 0.08em;

        text-shadow:
            0 0 30px
            rgba(80, 160, 255, 0.18);
    }


    .sounds-subtitle {

        margin-top: 28px;

        font-size: 15px;

        letter-spacing: 0.20em;

        opacity: 0.68;
    }


    /* =========================================================
       LISTEN
       ========================================================= */

    .listen-title {

        margin-top: 55px;

        margin-bottom: 28px;

        font-size: 20px;

        letter-spacing: 0.18em;

        opacity: 0.88;
    }


    /* =========================================================
       STREAMING LINKS
       ========================================================= */

    .platform-grid {

        width: 100%;

        max-width: 720px;

        margin: 0 auto;

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }


    .platform {

        min-height: 56px;

        display: flex;

        align-items: center;
        justify-content: center;

        padding: 0 20px;

        border:
            1px solid
            rgba(255, 255, 255, 0.18);

        background:
            rgba(0, 8, 18, 0.25);

        backdrop-filter: blur(8px);

        color: #ffffff;

        text-decoration: none;

        font-size: 14px;

        letter-spacing: 0.08em;

        transition:
            transform 0.25s ease,
            border-color 0.25s ease,
            background 0.25s ease,
            box-shadow 0.25s ease;
    }


    .platform:hover {

        transform:
            translateY(-3px);

        border-color:
            rgba(120, 200, 255, 0.65);

        background:
            rgba(30, 100, 180, 0.16);

        box-shadow:
            0 0 25px
            rgba(40, 130, 230, 0.16);
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .observer {

        margin-top: 70px;

        font-size: 12px;

        letter-spacing: 0.15em;

        opacity: 0.42;
    }


    .observer span {

        opacity: 0.85;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

        nav {

            padding: 20px;
        }


        .nav-logo {

            font-size: 17px;
        }


        .nav-links {

            gap: 14px;
        }


        .nav-links a {

            font-size: 11px;
        }


        main {

            padding:
                115px 18px 50px;
        }


        .sounds-content {

            width: 100%;
        }


        .sounds-title {

            font-size: 58px;

            letter-spacing: 0.06em;

            text-align: center;
        }


        .sounds-subtitle {

            margin-top: 22px;

            font-size: 11px;

            letter-spacing: 0.16em;
        }


        .listen-title {

            margin-top: 42px;

            margin-bottom: 22px;

            font-size: 16px;

            letter-spacing: 0.14em;
        }


        .platform-grid {

            width: 100%;

            grid-template-columns: 1fr;

            gap: 10px;
        }


        .platform {

            min-height: 52px;

            font-size: 13px;
        }


        .observer {

            margin-top: 50px;

            font-size: 10px;
        }
    }


    /* =========================================================
       SMALL PHONES
       ========================================================= */

    @media (max-width: 420px) {

        nav {

            padding:
                18px 15px;
        }


        .nav-logo {

            font-size: 15px;
        }


        .nav-links {

            gap: 10px;
        }


        .nav-links a {

            font-size: 9px;

            letter-spacing: 0.07em;
        }


        main {

            padding:
                105px 15px 40px;
        }


        .sounds-title {

            font-size: 48px;

            letter-spacing: 0.04em;
        }


        .sounds-subtitle {

            font-size: 9px;

            letter-spacing: 0.13em;
        }


        .listen-title {

            margin-top: 36px;

            font-size: 14px;
        }


        .platform {

            min-height: 50px;

            font-size: 12px;
        }
    }

</style>
```
