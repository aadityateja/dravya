<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landscapes — DRAVYA</title>

    <style>
        @font-face {
            font-family: "Germania";
            src: url("assets/GermaniaOne-Regular.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(25, 55, 120, 0.18),
                    transparent 45%
                ),
                #02040b;

            color: #e9efff;
            font-family: "Germania", serif;
            overflow-x: hidden;
        }

        /* ---------------- HEADER ---------------- */

        header {
            width: 100%;
            padding: 35px 50px 10px;
            text-align: center;
        }

        .brand {
            font-size: 1.4rem;
            letter-spacing: 0.3em;
            opacity: 0.75;
        }

        h1 {
            margin-top: 14px;
            font-size: clamp(2.5rem, 6vw, 5rem);
            letter-spacing: 0.12em;
            font-weight: normal;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 1rem;
            letter-spacing: 0.18em;
            opacity: 0.5;
        }

        /* ---------------- GALLERY ---------------- */

        .gallery {
            width: min(1250px, 92vw);
            margin: 55px auto 70px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .model-card {
            position: relative;

            height: 430px;

            border: 1px solid rgba(130, 160, 220, 0.18);
            border-radius: 18px;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(30, 65, 145, 0.12),
                    rgba(2, 4, 11, 0.85)
                );

            overflow: hidden;

            cursor: pointer;

            transition:
                border-color 0.4s ease,
                box-shadow 0.4s ease,
                transform 0.4s ease;
        }

        .model-card:hover {
            border-color: rgba(100, 160, 255, 0.65);

            box-shadow:
                0 0 30px rgba(40, 100, 255, 0.18),
                inset 0 0 30px rgba(40, 100, 255, 0.06);

            transform: translateY(-4px);
        }

        .canvas-container {
            position: absolute;
            inset: 0;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ---------------- TITLES ---------------- */

        .model-info {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 25px;

            text-align: center;

            pointer-events: none;
        }

        .model-title {
            font-size: 1.6rem;
            letter-spacing: 0.16em;
        }

        .model-hint {
            margin-top: 7px;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            opacity: 0.4;
        }

        /* ---------------- FOOTER ---------------- */

        footer {
            text-align: center;
            padding: 10px 20px 40px;

            font-size: 0.8rem;
            letter-spacing: 0.22em;
            opacity: 0.35;
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 850px) {
            header {
                padding: 28px 20px 5px;
            }

            .gallery {
                grid-template-columns: 1fr;
                width: min(500px, 88vw);
                gap: 25px;
                margin-top: 40px;
            }

            .model-card {
                height: 390px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">DRAVYA</div>
        <h1>LANDSCAPES</h1>
        <div class="subtitle">OBSERVE · DISTURB · CREATE</div>
    </header>


    <main class="gallery">

        <!-- LANDSCAPE -->
        <div
            class="model-card"
            data-model="landscapes/ld.glb"
            data-link="landscape.html"
            tabindex="0"
            role="button"
            aria-label="Open Landscape"
        >
            <div class="canvas-container"></div>

            <div class="model-info">
                <div class="model-title">LANDSCAPE</div>
                <div class="model-hint">ENTER</div>
            </div>
        </div>


        <!-- POND -->
        <div
            class="model-card"
            data-model="landscapes/pond.glb"
            data-link="pond.html"
            tabindex="0"
            role="button"
            aria-label="Open Pond"
        >
            <div class="canvas-container"></div>

            <div class="model-info">
                <div class="model-title">POND</div>
                <div class="model-hint">ENTER</div>
            </div>
        </div>


        <!-- CAVE -->
        <div
            class="model-card"
            data-model="landscapes/cave.glb"
            data-link="cave.html"
            tabindex="0"
            role="button"
            aria-label="Open Cave"
        >
            <div class="canvas-container"></div>

            <div class="model-info">
                <div class="model-title">CAVE</div>
                <div class="model-hint">ENTER</div>
            </div>
        </div>

    </main>


    <footer>
        A FIELD OF PLACES
    </footer>


    <script type="module">

        import * as THREE from
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

        import { GLTFLoader } from
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


        const loader = new GLTFLoader();

        const cards = document.querySelectorAll(".model-card");

        const viewers = [];


        /* ------------------------------------------------
           CREATE ONE SMALL 3D VIEWER FOR EACH MODEL
        ------------------------------------------------ */

        cards.forEach((card) => {

            const container =
                card.querySelector(".canvas-container");

            const modelPath =
                card.dataset.model;

            const link =
                card.dataset.link;


            /* SCENE */

            const scene = new THREE.Scene();

            scene.background = null;


            /* CAMERA */

            const camera =
                new THREE.PerspectiveCamera(
                    35,
                    1,
                    0.01,
                    100
                );

            camera.position.set(
                0,
                1.1,
                5.5
            );


            /* RENDERER */

            const renderer =
                new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true
                });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 2)
            );

            renderer.outputColorSpace =
                THREE.SRGBColorSpace;

            renderer.toneMapping =
                THREE.ACESFilmicToneMapping;

            renderer.toneMappingExposure = 1.15;

            container.appendChild(
                renderer.domElement
            );


            /* LIGHTING */

            const ambient =
                new THREE.HemisphereLight(
                    0x9fbaff,
                    0x050712,
                    2.2
                );

            scene.add(ambient);


            const keyLight =
                new THREE.DirectionalLight(
                    0xffffff,
                    3
                );

            keyLight.position.set(
                4,
                6,
                5
            );

            scene.add(keyLight);


            const fillLight =
                new THREE.DirectionalLight(
                    0x416cff,
                    1.5
                );

            fillLight.position.set(
                -4,
                2,
                -3
            );

            scene.add(fillLight);


            /* VIEWER STATE */

            const viewer = {
                card,
                scene,
                camera,
                renderer,
                model: null,
                hovered: false
            };

            viewers.push(viewer);


            /* ------------------------------------------------
               LOAD GLB
            ------------------------------------------------ */

            loader.load(
                modelPath,

                (gltf) => {

                    const model = gltf.scene;

                    viewer.model = model;


                    /* FIND MODEL SIZE */

                    const box =
                        new THREE.Box3()
                            .setFromObject(model);

                    const size =
                        box.getSize(
                            new THREE.Vector3()
                        );

                    const center =
                        box.getCenter(
                            new THREE.Vector3()
                        );


                    /* CENTER MODEL */

                    model.position.sub(center);


                    /* NORMALIZE SIZE */

                    const largestDimension =
                        Math.max(
                            size.x,
                            size.y,
                            size.z
                        );

                    const targetSize = 3.0;

                    const scale =
                        targetSize /
                        largestDimension;

                    model.scale.setScalar(scale);


                    scene.add(model);


                    /* FACE MODEL TOWARD VIEWER */

                    model.rotation.y =
                        Math.PI * 0.15;


                    /*
                       Store original material
                       values for the hover glow.
                    */

                    model.traverse((object) => {

                        if (!object.isMesh)
                            return;

                        const materials =
                            Array.isArray(object.material)
                                ? object.material
                                : [object.material];


                        materials.forEach((material) => {

                            if (!material.userData)
                                material.userData = {};


                            if (
                                material.emissive &&
                                !material.userData.originalEmissive
                            ) {

                                material.userData.originalEmissive =
                                    material.emissive.clone();

                                material.userData.originalIntensity =
                                    material.emissiveIntensity || 0;
                            }

                        });

                    });

                },

                undefined,

                (error) => {

                    console.error(
                        "Could not load:",
                        modelPath,
                        error
                    );

                }
            );


            /* ------------------------------------------------
               RESIZE
            ------------------------------------------------ */

            function resize() {

                const width =
                    container.clientWidth;

                const height =
                    container.clientHeight;


                if (!width || !height)
                    return;


                camera.aspect =
                    width / height;

                camera.updateProjectionMatrix();


                renderer.setSize(
                    width,
                    height,
                    false
                );
            }


            const resizeObserver =
                new ResizeObserver(resize);

            resizeObserver.observe(container);

            resize();


            /* ------------------------------------------------
               HOVER
            ------------------------------------------------ */

            card.addEventListener(
                "pointerenter",
                () => {

                    viewer.hovered = true;

                    setGlow(
                        viewer.model,
                        true
                    );

                }
            );


            card.addEventListener(
                "pointerleave",
                () => {

                    viewer.hovered = false;

                    setGlow(
                        viewer.model,
                        false
                    );

                }
            );


            /* ------------------------------------------------
               CLICK
            ------------------------------------------------ */

            card.addEventListener(
                "click",
                () => {

                    window.location.href =
                        link;

                }
            );


            /* KEYBOARD */

            card.addEventListener(
                "keydown",
                (event) => {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        window.location.href =
                            link;

                    }

                }
            );

        });


        /* ------------------------------------------------
           MODEL GLOW
        ------------------------------------------------ */

        function setGlow(model, enabled) {

            if (!model)
                return;


            model.traverse((object) => {

                if (!object.isMesh)
                    return;


                const materials =
                    Array.isArray(object.material)
                        ? object.material
                        : [object.material];


                materials.forEach((material) => {

                    if (
                        !material.emissive
                    )
                        return;


                    if (!material.userData.originalEmissive)
                        return;


                    if (enabled) {

                        material.emissive.set(
                            0.12,
                            0.25,
                            0.9
                        );

                        material.emissiveIntensity =
                            1.15;

                    } else {

                        material.emissive.copy(
                            material.userData.originalEmissive
                        );

                        material.emissiveIntensity =
                            material.userData.originalIntensity;

                    }

                    material.needsUpdate = true;

                });

            });

        }


        /* ------------------------------------------------
           ANIMATION
        ------------------------------------------------ */

        function animate() {

            requestAnimationFrame(
                animate
            );


            viewers.forEach((viewer) => {

                if (
                    viewer.model &&
                    !viewer.hovered
                ) {

                    /*
                       Slow autonomous rotation.
                    */

                    viewer.model.rotation.y +=
                        0.0025;

                }


                viewer.renderer.render(
                    viewer.scene,
                    viewer.camera
                );

            });

        }


        animate();

    </script>

</body>
</html>
