<!-- =====================================================

<script type="module">

import * as THREE from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";


/* =====================================================
   LOADER
===================================================== */

const loader =
    new GLTFLoader();



/* =====================================================
   UNIVERSAL VISUAL SIZE
===================================================== */

/*
    THIS is the important part.

    Every GLB gets normalized to the SAME
    visual maximum dimension.

    So even if:

        landscape.glb = huge
        pond.glb      = tiny
        cave.glb      = medium

    they will appear approximately the
    same size on screen.
*/

const VISUAL_MODEL_SIZE = 5.5;



/* =====================================================
   CREATE MODEL VIEWER
===================================================== */

document
.querySelectorAll(".landscape-item")
.forEach((item) => {


    const viewer =
        item.querySelector(".viewer");


    const modelPath =
        item.dataset.model;


    const destination =
        item.dataset.link;



    /* =================================================
       SCENE
    ================================================== */

    const scene =
        new THREE.Scene();



    /* =================================================
       CAMERA

       HIGH / ABOVE VIEW
    ================================================== */

    const camera =
        new THREE.PerspectiveCamera(

            38,

            viewer.clientWidth /
            viewer.clientHeight,

            0.01,

            1000

        );



    /* =================================================
       RENDERER
    ================================================== */

    const renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            alpha: true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(

        viewer.clientWidth,

        viewer.clientHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.3;


    viewer.appendChild(
        renderer.domElement
    );



    /* =================================================
       LIGHTING
    ================================================== */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2.4
        );

    scene.add(ambient);



    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            4.5
        );

    sun.position.set(
        5,
        10,
        5
    );

    scene.add(sun);



    const blueFill =
        new THREE.DirectionalLight(
            0x73aaff,
            2.2
        );

    blueFill.position.set(
        -6,
        5,
        -5
    );

    scene.add(blueFill);



    const topLight =
        new THREE.PointLight(
            0x9ed5ff,
            22,
            40
        );

    topLight.position.set(
        0,
        10,
        2
    );

    scene.add(topLight);



    /* =================================================
       MODEL GROUP
    ================================================== */

    const modelGroup =
        new THREE.Group();

    scene.add(modelGroup);



    /* =================================================
       LOAD GLB
    ================================================== */

    loader.load(

        modelPath,


        (gltf) => {


            const model =
                gltf.scene;


            modelGroup.add(
                model
            );



            /* =========================================
               ORIGINAL BOUNDING BOX
            ========================================== */

            const box =
                new THREE.Box3()
                .setFromObject(model);


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const maxDimension =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );



            /* =========================================
               CENTER MODEL
            ========================================== */

            model.position.sub(
                center
            );



            /* =========================================
               SAME SIZE FOR EVERY MODEL
            ========================================== */

            const scale =
                VISUAL_MODEL_SIZE /
                maxDimension;


            model.scale.setScalar(
                scale
            );



            /* =========================================
               UPDATE WORLD MATRICES
            ========================================== */

            model.updateMatrixWorld(
                true
            );



            /* =========================================
               FINAL BOUNDS
            ========================================== */

            const finalBox =
                new THREE.Box3()
                .setFromObject(model);


            const finalSize =
                finalBox.getSize(
                    new THREE.Vector3()
                );


            const finalCenter =
                finalBox.getCenter(
                    new THREE.Vector3()
                );


            const finalLargest =
                Math.max(
                    finalSize.x,
                    finalSize.y,
                    finalSize.z
                );



            /* =========================================
               IMPORTANT:

               CAMERA IS ABOVE THE MODEL
            ========================================== */

            const horizontalDistance =
                finalLargest * 0.95;


            const verticalDistance =
                finalLargest * 1.35;



            camera.position.set(

                horizontalDistance * 0.38,

                verticalDistance,

                horizontalDistance

            );



            /* =========================================
               LOOK DOWN AT MODEL
            ========================================== */

            camera.lookAt(
                finalCenter
            );



            camera.near =
                finalLargest * 0.01;


            camera.far =
                finalLargest * 20;


            camera.updateProjectionMatrix();



            /* =========================================
               VERY SLIGHT INITIAL TILT
            ========================================== */

            model.rotation.x =
                THREE.MathUtils.degToRad(
                    -2
                );



            /* =========================================
               MATERIAL SETUP
            ========================================== */

            model.traverse(
                (child) => {

                    if (
                        child.isMesh &&
                        child.material
                    ) {


                        /*
                           Clone material so
                           hover glow does not
                           affect other objects.
                        */

                        child.material =
                            child.material.clone();



                        if (
                            child.material.emissive
                        ) {

                            child.userData
                                .originalEmissive =
                                child.material
                                    .emissive
                                    .clone();


                            child.userData
                                .originalEmissiveIntensity =
                                child.material
                                    .emissiveIntensity
                                    ?? 0;

                        }

                    }

                }
            );



            /* =========================================
               ANIMATION
            ========================================== */

            function animate() {

                requestAnimationFrame(
                    animate
                );


                /*
                   Rotation NEVER stops.
                */

                model.rotation.y +=
                    0.00065;


                renderer.render(
                    scene,
                    camera
                );

            }


            animate();



            /* =========================================
               HOVER GLOW
            ========================================== */

            item.addEventListener(
                "mouseenter",
                () => {


                    model.traverse(
                        (child) => {

                            if (
                                child.isMesh &&
                                child.material &&
                                child.material.emissive
                            ) {

                                child.material
                                    .emissive
                                    .set(
                                        0x4c9dff
                                    );


                                child.material
                                    .emissiveIntensity =
                                    0.28;

                            }

                        }
                    );

                }
            );



            item.addEventListener(
                "mouseleave",
                () => {


                    model.traverse(
                        (child) => {

                            if (
                                child.isMesh &&
                                child.material &&
                                child.material.emissive
                            ) {

                                if (
                                    child.userData
                                        .originalEmissive
                                ) {

                                    child.material
                                        .emissive
                                        .copy(
                                            child.userData
                                                .originalEmissive
                                        );


                                    child.material
                                        .emissiveIntensity =
                                        child.userData
                                            .originalEmissiveIntensity;

                                }

                            }

                        }
                    );

                }
            );



            /* =========================================
               CLICK
            ========================================== */

            item.addEventListener(
                "click",
                () => {

                    window.location.href =
                        destination;

                }
            );

        },


        undefined,


        /* =============================================
           ERROR
        ============================================== */

        (error) => {

            console.error(
                "GLB loading error:",
                modelPath,
                error
            );

        }

    );



    /* =================================================
       RESIZE
    ================================================== */

    function resize() {

        const width =
            viewer.clientWidth;


        const height =
            viewer.clientHeight;


        camera.aspect =
            width / height;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );

    }


    window.addEventListener(
        "resize",
        resize
    );

});



/* =====================================================
   BACKGROUND VIDEO
===================================================== */

const video =
    document.getElementById(
        "background-video"
    );


video.play()
.catch(() => {

    console.log(
        "Browser waiting for autoplay permission."
    );

});

</script>

</body>
</html>
