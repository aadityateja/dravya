<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Landscapes — DRAVYA</title>

<!-- THREE.JS IMPORT MAP -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<style>

@font-face {
    font-family: "Germania";
    src: url("assets/GermaniaOne-Regular.ttf") format("truetype");
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #020611;
    color: white;
    font-family: "Germania", Arial, sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND VIDEO
========================================================= */

#background-video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: -10;

    filter:
        brightness(0.55)
        contrast(1.15)
        saturate(1.05);
}

.background-overlay {
    position: fixed;
    inset: 0;

    z-index: -5;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(2, 12, 30, 0.10) 0%,
            rgba(0, 4, 15, 0.45) 65%,
            rgba(0, 2, 10, 0.82) 100%
        );
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: relative;

    width: 100%;

    padding:
        35px
        55px
        10px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 20;

    pointer-events: none;
}

.logo {
    font-size: 25px;
    letter-spacing: 5px;
}

.page-title {
    font-size: 22px;
    letter-spacing: 7px;
}

.tagline {
    font-size: 14px;
    letter-spacing: 3px;
    opacity: 0.65;
}


/* =========================================================
   MAIN EXHIBITION SPACE
========================================================= */

.landscape-path {

    position: relative;

    width: min(1500px, 100%);

    min-height: 1750px;

    margin: 0 auto;

    padding: 30px 40px 150px;
}


/* =========================================================
   MODEL ITEMS
========================================================= */

.landscape-item {

    position: absolute;

    width: 620px;

    cursor: pointer;

    z-index: 10;

    transition:
        transform 0.5s ease,
        filter 0.5s ease;
}


/* =========================================================
   ZIG-ZAG POSITIONS
========================================================= */

.landscape-item.landscape {

    left: 0;

    top: 70px;
}

.landscape-item.pond {

    right: 0;

    top: 600px;
}

.landscape-item.cave {

    left: 0;

    top: 1130px;
}


/* =========================================================
   3D VIEWER
========================================================= */

.viewer {

    position: relative;

    width: 620px;
    height: 520px;

    overflow: visible;

    background: transparent;
}


/* Canvas fills viewer */

.viewer canvas {

    position: absolute;

    inset: 0;

    width: 100% !important;
    height: 100% !important;

    display: block;

    pointer-events: none;
}


/* =========================================================
   MODEL LABEL
========================================================= */

.model-title {

    position: relative;

    text-align: center;

    margin-top: -10px;

    font-size: 25px;

    letter-spacing: 7px;

    opacity: 0.9;

    text-shadow:
        0 0 10px rgba(120,190,255,0.4),
        0 0 25px rgba(60,130,255,0.25);

    transition:
        opacity 0.4s ease,
        text-shadow 0.4s ease;
}


/* =========================================================
   HOVER EFFECT
   IMPORTANT:
   ROTATION DOES NOT STOP
========================================================= */

.landscape-item:hover {

    transform: scale(1.035);

    filter:
        drop-shadow(0 0 18px rgba(90,170,255,0.65))
        drop-shadow(0 0 45px rgba(40,100,255,0.30));
}

.landscape-item:hover .model-title {

    opacity: 1;

    text-shadow:
        0 0 12px rgba(160,220,255,0.9),
        0 0 30px rgba(70,150,255,0.65),
        0 0 60px rgba(40,100,255,0.35);
}


/* =========================================================
   SMALL INSTRUCTION
========================================================= */

.instruction {

    position: relative;

    width: 100%;

    text-align: center;

    margin-top: 15px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 4px;

    opacity: 0.35;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    header {

        padding: 25px 25px 10px;

        flex-direction: column;

        gap: 12px;

        text-align: center;
    }

    .logo {
        font-size: 21px;
    }

    .page-title {
        font-size: 18px;
        letter-spacing: 5px;
    }

    .tagline {
        font-size: 11px;
    }


    .landscape-path {

        min-height: auto;

        padding:
            20px
            20px
            100px;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 80px;
    }


    .landscape-item,
    .landscape-item.landscape,
    .landscape-item.pond,
    .landscape-item.cave {

        position: relative;

        left: auto;
        right: auto;
        top: auto;

        width: min(94vw, 620px);
    }


    .viewer {

        width: 100%;

        height: min(80vw, 520px);
    }


    .model-title {

        font-size: 21px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<video
    id="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source
        src="assets/dravya_vacuum_fluctuation_10s.mp4"
        type="video/mp4"
    >
</video>

<div class="background-overlay"></div>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="logo">
        DRAVYA
    </div>

    <div class="page-title">
        LANDSCAPES
    </div>

    <div class="tagline">
        OBSERVE · DISTURB · CREATE
    </div>

</header>


<!-- =======================================================
     EXHIBITION
======================================================= -->

<main>

<div class="landscape-path">


    <!-- ===================================================
         LANDSCAPE
    ==================================================== -->

    <div
        class="landscape-item landscape"
        data-model="landscapes/ld.glb"
        data-link="landscape.html"
    >

        <div class="viewer"></div>

        <div class="model-title">
            LANDSCAPE
        </div>

    </div>


    <!-- ===================================================
         POND
    ==================================================== -->

    <div
        class="landscape-item pond"
        data-model="landscapes/pond.glb"
        data-link="pond.html"
    >

        <div class="viewer"></div>

        <div class="model-title">
            POND
        </div>

    </div>


    <!-- ===================================================
         CAVE
    ==================================================== -->

    <div
        class="landscape-item cave"
        data-model="landscapes/cave.glb"
        data-link="cave.html"
    >

        <div class="viewer"></div>

        <div class="model-title">
            CAVE
        </div>

    </div>


    <div class="instruction">
        HOVER TO OBSERVE · CLICK TO ENTER
    </div>


</div>

</main>


<!-- =======================================================
     THREE.JS
======================================================= -->

<script type="module">

import * as THREE from "three";

import { GLTFLoader }
    from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   GLOBAL LOADER
========================================================= */

const loader = new GLTFLoader();


/* =========================================================
   CREATE EACH MODEL
========================================================= */

document
.querySelectorAll(".landscape-item")
.forEach((item) => {

    const viewer =
        item.querySelector(".viewer");

    const modelPath =
        item.dataset.model;

    const destination =
        item.dataset.link;


    /* =====================================================
       SCENE
    ====================================================== */

    const scene =
        new THREE.Scene();


    /* =====================================================
       CAMERA
    ====================================================== */

    const camera =
        new THREE.PerspectiveCamera(
            32,
            viewer.clientWidth /
            viewer.clientHeight,
            0.01,
            1000
        );


    /* =====================================================
       RENDERER
    ====================================================== */

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
        });


    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        viewer.clientWidth,
        viewer.clientHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
        1.25;


    viewer.appendChild(
        renderer.domElement
    );


    /* =====================================================
       LIGHTING
    ====================================================== */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            2.2
        );

    scene.add(ambient);


    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            4.0
        );

    keyLight.position.set(
        5,
        8,
        6
    );

    scene.add(keyLight);


    const fillLight =
        new THREE.DirectionalLight(
            0x7db7ff,
            2.5
        );

    fillLight.position.set(
        -6,
        3,
        -5
    );

    scene.add(fillLight);


    const topLight =
        new THREE.PointLight(
            0x8cc8ff,
            25,
            30
        );

    topLight.position.set(
        0,
        8,
        4
    );

    scene.add(topLight);


    /* =====================================================
       MODEL GROUP
    ====================================================== */

    const modelGroup =
        new THREE.Group();

    scene.add(modelGroup);


    /* =====================================================
       LOAD GLB
    ====================================================== */

    loader.load(

        modelPath,

        (gltf) => {

            const model =
                gltf.scene;


            /* =============================================
               ADD MODEL
            ============================================== */

            modelGroup.add(model);


            /* =============================================
               FIND ORIGINAL BOUNDS
            ============================================== */

            const box =
                new THREE.Box3()
                .setFromObject(model);


            const center =
                new THREE.Vector3();

            box.getCenter(center);


            const size =
                new THREE.Vector3();

            box.getSize(size);


            const maxDimension =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            /* =============================================
               CENTER MODEL
            ============================================== */

            model.position.x -= center.x;
            model.position.y -= center.y;
            model.position.z -= center.z;


            /* =============================================
               BIG SCALE
               
               This is intentionally MUCH larger
               than the previous version.
            ============================================== */

            const targetSize = 5.8;

            const scale =
                targetSize /
                maxDimension;

            model.scale.setScalar(scale);


            /* =============================================
               RE-CENTER AFTER SCALE
            ============================================== */

            const scaledBox =
                new THREE.Box3()
                .setFromObject(model);

            const scaledCenter =
                new THREE.Vector3();

            scaledBox.getCenter(
                scaledCenter
            );

            model.position.sub(
                scaledCenter
            );


            /* =============================================
               CAMERA FRAMING
            ============================================== */

            const finalBox =
                new THREE.Box3()
                .setFromObject(model);


            const finalSize =
                new THREE.Vector3();

            finalBox.getSize(
                finalSize
            );


            const finalCenter =
                new THREE.Vector3();

            finalBox.getCenter(
                finalCenter
            );


            const largest =
                Math.max(
                    finalSize.x,
                    finalSize.y,
                    finalSize.z
                );


            /*
             * Camera distance calculated from
             * the actual model dimensions.
             *
             * This prevents clipping.
             */

            const fov =
                camera.fov *
                Math.PI /
                180;


            let cameraDistance =
                (largest / 2) /
                Math.tan(fov / 2);


            cameraDistance *= 1.18;


            camera.position.set(
                0,
                largest * 0.08,
                cameraDistance
            );


            camera.lookAt(
                finalCenter
            );


            /* =============================================
               SLIGHT MODEL TILT
            ============================================== */

            model.rotation.x =
                THREE.MathUtils.degToRad(-3);


            /* =============================================
               STORE ORIGINAL MATERIAL DATA
            ============================================== */

            model.traverse(
                (child) => {

                    if (
                        child.isMesh &&
                        child.material
                    ) {

                        child.material =
                            child.material.clone();

                        child.userData.originalEmissive =
                            child.material.emissive
                            ? child.material.emissive.clone()
                            : new THREE.Color(0x000000);

                        child.userData.originalEmissiveIntensity =
                            child.material.emissiveIntensity
                            ?? 0;
                    }

                }
            );


            /* =============================================
               ANIMATION
            ============================================== */

            function animate() {

                requestAnimationFrame(
                    animate
                );


                /*
                 * VERY SLOW ROTATION.
                 *
                 * Importantly:
                 * this ALWAYS runs.
                 *
                 * Hover does NOT stop rotation.
                 */

                model.rotation.y += 0.00065;


                renderer.render(
                    scene,
                    camera
                );

            }


            animate();


            /* =============================================
               HOVER HIGHLIGHT
            ============================================== */

            item.addEventListener(
                "mouseenter",
                () => {

                    model.traverse(
                        (child) => {

                            if (
                                child.isMesh &&
                                child.material &&
                                child.material.emissive
                            ) {

                                child.material.emissive
                                    .set(0x3d8cff);

                                child.material.emissiveIntensity =
                                    0.35;

                            }

                        }
                    );

                }
            );


            item.addEventListener(
                "mouseleave",
                () => {

                    model.traverse(
                        (child) => {

                            if (
                                child.isMesh &&
                                child.material &&
                                child.material.emissive
                            ) {

                                child.material.emissive.copy(
                                    child.userData
                                        .originalEmissive
                                );

                                child.material.emissiveIntensity =
                                    child.userData
                                        .originalEmissiveIntensity;

                            }

                        }
                    );

                }
            );


            /* =============================================
               CLICK
            ============================================== */

            item.addEventListener(
                "click",
                () => {

                    window.location.href =
                        destination;

                }
            );

        },


        /* ===============================================
           LOADING
        ================================================ */

        undefined,


        /* ===============================================
           ERROR
        ================================================ */

        (error) => {

            console.error(
                "Could not load:",
                modelPath,
                error
            );

        }

    );


    /* =====================================================
       RESIZE
    ====================================================== */

    const resize =
        () => {

            const width =
                viewer.clientWidth;

            const height =
                viewer.clientHeight;


            camera.aspect =
                width / height;

            camera.updateProjectionMatrix();


            renderer.setSize(
                width,
                height
            );

        };


    window.addEventListener(
        "resize",
        resize
    );

});


/* =========================================================
   BACKGROUND VIDEO
========================================================= */

const video =
    document.getElementById(
        "background-video"
    );


video.play()
.catch(() => {
    console.log(
        "Autoplay waiting for browser permission."
    );
});

</script>

</body>
</html>
