<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landscapes — DRAVYA</title>

    <style>
        @font-face {
            font-family: Germania;
            src: url("assets/fonts/GermaniaOne-Regular.ttf");
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #02040b;
            color: white;
            font-family: Germania, serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 45px 20px 20px;
        }

        .brand {
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            opacity: 0.6;
        }

        h1 {
            margin-top: 12px;
            font-size: 4rem;
            font-weight: normal;
            letter-spacing: 0.12em;
        }

        .gallery {
            width: 90%;
            max-width: 1200px;
            margin: 45px auto;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px;
        }

        .item {
            text-align: center;
            cursor: pointer;
        }

        .viewer {
            width: 100%;
            height: 350px;

            border: 1px solid rgba(120, 150, 220, 0.2);
            border-radius: 18px;

            background:
                radial-gradient(
                    circle,
                    rgba(30, 70, 150, 0.15),
                    transparent 70%
                );

            overflow: hidden;

            transition: 0.4s ease;
        }

        .item:hover .viewer {
            border-color: rgba(100, 170, 255, 0.8);

            box-shadow:
                0 0 35px rgba(50, 120, 255, 0.35);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        h2 {
            margin-top: 18px;
            font-size: 1.5rem;
            font-weight: normal;
            letter-spacing: 0.15em;
        }

        .hint {
            margin-top: 6px;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            opacity: 0.35;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            h1 {
                font-size: 3rem;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">DRAVYA</div>
    <h1>LANDSCAPES</h1>
</header>


<div class="gallery">

    <div class="item" data-model="landscapes/ld.glb" data-page="landscape.html">
        <div class="viewer"></div>
        <h2>LANDSCAPE</h2>
        <div class="hint">ENTER</div>
    </div>


    <div class="item" data-model="landscapes/pond.glb" data-page="pond.html">
        <div class="viewer"></div>
        <h2>POND</h2>
        <div class="hint">ENTER</div>
    </div>


    <div class="item" data-model="landscapes/cave.glb" data-page="cave.html">
        <div class="viewer"></div>
        <h2>CAVE</h2>
        <div class="hint">ENTER</div>
    </div>

</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"three/addons/loaders/GLTFLoader.js";

const loader = new GLTFLoader();

const items = document.querySelectorAll(".item");


items.forEach(item => {

    const container =
        item.querySelector(".viewer");

    const file =
        item.dataset.model;

    const scene =
        new THREE.Scene();


    /* CAMERA */

    const camera =
        new THREE.PerspectiveCamera(
            35,
            container.clientWidth /
            container.clientHeight,
            0.01,
            1000
        );


    camera.position.set(
        0,
        2,
        7
    );


    /* RENDERER */

    const renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });


    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.2;

    container.appendChild(
        renderer.domElement
    );


    /* LIGHTS */

    scene.add(
        new THREE.HemisphereLight(
            0xffffff,
            0x111122,
            3
        )
    );


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            4
        );

    light.position.set(
        5,
        8,
        5
    );

    scene.add(light);


    const blueLight =
        new THREE.PointLight(
            0x3366ff,
            3,
            20
        );

    blueLight.position.set(
        -4,
        2,
        4
    );

    scene.add(blueLight);


    let model = null;
    let rotating = true;


    /* LOAD GLB */

    loader.load(

        file,

        gltf => {

            model = gltf.scene;

            scene.add(model);


            /*
             * Find the actual size of
             * the loaded GLB.
             */

            const box =
                new THREE.Box3()
                    .setFromObject(model);


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            /*
             * Move model to origin.
             */

            model.position.x -= center.x;
            model.position.y -= center.y;
            model.position.z -= center.z;


            /*
             * Make all three models
             * approximately the same size.
             */

            const largest =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (largest > 0) {

                const scale =
                    3 / largest;

                model.scale.setScalar(scale);

            }


            console.log(
                "Loaded:",
                file
            );

        },


        undefined,


        error => {

            console.error(
                "GLB ERROR:",
                file,
                error
            );

        }

    );


    /* HOVER */

    item.addEventListener(
        "mouseenter",
        () => {

            rotating = false;

            if (model) {

                model.traverse(
                    object => {

                        if (
                            object.isMesh &&
                            object.material &&
                            object.material.emissive
                        ) {

                            object.material.emissive
                                .set(0.1, 0.25, 1);

                            object.material
                                .emissiveIntensity = 1.2;

                        }

                    }
                );

            }

        }
    );


    item.addEventListener(
        "mouseleave",
        () => {

            rotating = true;

            if (model) {

                model.traverse(
                    object => {

                        if (
                            object.isMesh &&
                            object.material &&
                            object.material.emissive
                        ) {

                            object.material.emissive
                                .set(0, 0, 0);

                            object.material
                                .emissiveIntensity = 0;

                        }

                    }
                );

            }

        }
    );


    /* CLICK */

    item.addEventListener(
        "click",
        () => {

            window.location.href =
                item.dataset.page;

        }
    );


    /* ANIMATION */

    function animate() {

        requestAnimationFrame(
            animate
        );


        if (
            model &&
            rotating
        ) {

            model.rotation.y += 0.003;

        }


        renderer.render(
            scene,
            camera
        );

    }


    animate();


    /* RESIZE */

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                container.clientWidth /
                container.clientHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                container.clientWidth,
                container.clientHeight
            );

        }
    );

});

</script>

</body>
</html>
