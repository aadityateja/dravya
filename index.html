    <style>

        * {

           BACKGROUND VIDEO
           ========================= */

        .background-video {
            position: fixed;

            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            z-index: -2;

            pointer-events: none;
        }


        /* =========================
           DARK OVERLAY
           ========================= */

        .background-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.18);

            z-index: -1;

            pointer-events: none;
        }


        /* =========================
           MAIN PAGE
           ========================= */

        .dravyafield {
            width: 100vw;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 40px;
        }


        .content {
            width: 100%;
            max-width: 900px;

            text-align: center;
        }


        /* =========================
           DRAVYA
           ========================= */

        .title {
            font-size: clamp(4rem, 9vw, 8rem);

            font-weight: 500;

            letter-spacing: 0.08em;

            margin-bottom: 18px;
        }


        /* =========================
           TAGLINE
           ========================= */

        .tagline {
            font-size: clamp(1rem, 1.5vw, 1.35rem);

            letter-spacing: 0.18em;

            margin-bottom: 65px;

            opacity: 0.85;
        }


        /* =========================
           DESCRIPTION
           ========================= */

        .description {
            max-width: 720px;

            margin: 0 auto 65px auto;

            font-size: clamp(0.95rem, 1.3vw, 1.15rem);

            line-height: 1.8;

            letter-spacing: 0.02em;

            opacity: 0.8;
        }

           CREATIVE LINKS
           ========================= */

        .creative-links {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 45px;

            margin-bottom: 55px;
        }


        .creative-links a,
        .social-links a {

            color: #f2f4f7;

            text-decoration: none;

            font-size: 1rem;

            letter-spacing: 0.15em;

            transition:
                opacity 0.3s ease,
                letter-spacing 0.3s ease;
        }


        .creative-links a:hover,
        .social-links a:hover {

            opacity: 0.5;

            letter-spacing: 0.2em;
        }


        /* =========================
           SOCIAL LINKS
           ========================= */

        .social-links {

            display: flex;

            justify-content: center;

            font-size: 0.85rem;

            opacity: 0.7;
        }

           MOBILE
           ========================= */

        @media (max-width: 600px) {

                padding: 25px;
            }

                letter-spacing: 0.06em;

                margin-bottom: 15px;
            }

                letter-spacing: 0.12em;

                margin-bottom: 45px;

            .description {

            .creative-links {

                flex-direction: column;

                margin-bottom: 40px;
            }

            .social-links {

                gap: 25px;
            }
        }
