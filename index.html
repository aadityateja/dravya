<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DRAVYA</title>

    <!-- KEEP YOUR EXISTING FONT / FONT IMPORTS HERE -->
    <!-- <link rel="stylesheet" href="your-font.css"> -->

    <style>
        /* =========================
           DRAVYA — ONE PAGE
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #05070c;
            color: #f2f4f7;

            /* KEEP / REPLACE WITH YOUR FONT */
            font-family: sans-serif;

            overflow: hidden;
        }

        /* =========================
           MAIN FIELD
           ========================= */

        .dravyafield {
            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px;
        }

        .content {
            width: 100%;
            max-width: 900px;

            text-align: center;
        }

        /* =========================
           TITLE
           ========================= */

        .title {
            font-size: clamp(4rem, 9vw, 8rem);
            font-weight: 500;
            letter-spacing: 0.08em;

            margin-bottom: 18px;
        }

        /* =========================
           TAGLINE
           ========================= */

        .tagline {
            font-size: clamp(1rem, 1.5vw, 1.35rem);
            letter-spacing: 0.18em;

            margin-bottom: 65px;

            opacity: 0.8;
        }

        /* =========================
           DESCRIPTION
           ========================= */

        .description {
            max-width: 720px;

            margin: 0 auto 65px auto;

            font-size: clamp(0.95rem, 1.3vw, 1.15rem);
            line-height: 1.8;

            letter-spacing: 0.02em;

            opacity: 0.75;
        }

        /* =========================
           CREATIVE LINKS
           ========================= */

        .creative-links {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 45px;

            margin-bottom: 55px;
        }

        .creative-links a,
        .social-links a {
            color: #f2f4f7;
            text-decoration: none;

            font-size: 1rem;
            letter-spacing: 0.15em;

            transition: opacity 0.3s ease,
                        letter-spacing 0.3s ease;
        }

        .creative-links a:hover,
        .social-links a:hover {
            opacity: 0.5;
            letter-spacing: 0.2em;
        }

        /* =========================
           SOCIAL LINKS
           ========================= */

        .social-links {
            display: flex;
            justify-content: center;

            gap: 35px;
        }

        .social-links a {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            body {
                overflow: hidden;
            }

            .dravyafield {
                padding: 25px;
            }

            .title {
                letter-spacing: 0.06em;
                margin-bottom: 15px;
            }

            .tagline {
                letter-spacing: 0.12em;
                margin-bottom: 50px;
            }

            .description {
                line-height: 1.7;
                margin-bottom: 50px;
            }

            .creative-links {
                flex-direction: column;
                gap: 22px;
                margin-bottom: 45px;
            }

            .social-links {
                gap: 25px;
            }
        }
    </style>
</head>


<body>

    <main class="dravyafield">

        <div class="content">

            <!-- =========================
                 DRAVYA
                 ========================= -->

            <h1 class="title">
                DRAVYA
            </h1>


            <!-- =========================
                 TAGLINE
                 ========================= -->

            <div class="tagline">
                Observe. Disturb. Create.
            </div>


            <!-- =========================
                 DESCRIPTION
                 ========================= -->

            <p class="description">
                DRAVYA is an interdisciplinary creative space where
                sound, art, science, stories and human experience
                exist as different expressions of the same field.
            </p>


            <!-- =========================
                 CREATIVE WORLDS
                 EDIT THESE LINKS
                 ========================= -->

            <nav class="creative-links">

                <a href="YOUR-SOUND-LINK">
                    SOUNDS
                </a>

                <a href="YOUR-ART-LINK">
                    ART
                </a>

                <a href="YOUR-SHORT-FICTION-LINK">
                    SHORT FICTION
                </a>

            </nav>


            <!-- =========================
                 SOCIAL
                 EDIT THESE LINKS
                 ========================= -->

            <nav class="social-links">

                <a
                    href="YOUR-INSTAGRAM-LINK"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    INSTAGRAM
                </a>

                <a
                    href="YOUR-YOUTUBE-LINK"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    YOUTUBE
                </a>

            </nav>

        </div>

    </main>

</body>
</html>
