<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DRAVYA Campus</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: Arial, sans-serif;
}

#info {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 12px 16px;
    border-radius: 8px;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    background: #02030a;
    z-index: 20;
}
</style>
</head>

<body>

<div id="loading">Loading DRAVYA Campus...</div>

<div id="info">
    DRAVYA CAMPUS<br>
    <small>Drag mouse to look • Scroll to zoom</small>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07101c);


/* =========================================================
   CAMERA
========================================================= */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
);

camera.position.set(40, 25, 40);


/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x223344,
    2.5
);

scene.add(ambient);


const sun = new THREE.DirectionalLight(
    0xffffff,
    4
);

sun.position.set(
    50,
    80,
    30
);

sun.castShadow = true;

scene.add(sun);


/* =========================================================
   CONTROLS
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.target.set(
    0,
    5,
    0
);

controls.minDistance = 2;

controls.maxDistance = 300;


/* =========================================================
   LOAD GLB
========================================================= */

const loader = new GLTFLoader();

loader.load(

    "./assets/museum.glb",

    function(gltf) {

        console.log("GLB LOADED:", gltf);

        const museum = gltf.scene;

        scene.add(museum);


        /* ---------------------------------------------
           ENABLE SHADOWS
        --------------------------------------------- */

        museum.traverse(function(object) {

            if (object.isMesh) {

                object.castShadow = true;
                object.receiveShadow = true;

                if (object.material) {

                    object.material.needsUpdate = true;

                }

            }

        });


        /* ---------------------------------------------
           FIND MODEL SIZE
        --------------------------------------------- */

        const box = new THREE.Box3().setFromObject(museum);

        const center = box.getCenter(
            new THREE.Vector3()
        );

        const size = box.getSize(
            new THREE.Vector3()
        );

        console.log("MODEL CENTER:", center);
        console.log("MODEL SIZE:", size);
        console.log("MODEL MIN:", box.min);
        console.log("MODEL MAX:", box.max);


        /* ---------------------------------------------
           CENTER MODEL
        --------------------------------------------- */

        museum.position.sub(center);


        /* ---------------------------------------------
           RECALCULATE SIZE
        --------------------------------------------- */

        const centeredBox =
            new THREE.Box3().setFromObject(museum);

        const centeredSize =
            centeredBox.getSize(new THREE.Vector3());

        const maxDimension =
            Math.max(
                centeredSize.x,
                centeredSize.y,
                centeredSize.z
            );


        /* ---------------------------------------------
           CAMERA POSITION
        --------------------------------------------- */

        const distance =
            maxDimension * 1.2;

        camera.position.set(
            distance,
            distance * 0.55,
            distance
        );

        controls.target.set(
            0,
            centeredSize.y * 0.35,
            0
        );

        controls.update();


        /* ---------------------------------------------
           HIDE LOADING
        --------------------------------------------- */

        document.getElementById(
            "loading"
        ).style.display = "none";


        console.log(
            "DRAVYA CAMPUS READY"
        );

    },

    function(xhr) {

        if (xhr.total) {

            const percent =
                (xhr.loaded / xhr.total) * 100;

            document.getElementById(
                "loading"
            ).textContent =
                "Loading DRAVYA Campus " +
                percent.toFixed(0) +
                "%";

        }

    },

    function(error) {

        console.error(
            "GLB LOAD ERROR:",
            error
        );

        document.getElementById(
            "loading"
        ).textContent =
            "ERROR loading museum.glb — check browser console.";

    }

);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
