<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DRAVYA Campus</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    background: #02030a;
    z-index: 100;
}

#info {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 12px 16px;
    border-radius: 8px;
    line-height: 1.5;
    pointer-events: none;
    user-select: none;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    transform: translate(-50%, -50%);
    border: 1px solid white;
    border-radius: 50%;
    z-index: 20;
    pointer-events: none;
    display: none;
}

#hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: white;
    background: rgba(0,0,0,.7);
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 14px;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="loading">
    Loading DRAVYA Campus...
</div>

<div id="info">
    <strong>DRAVYA CAMPUS</strong><br>
    <small>
        WASD / Arrow Keys — Move<br>
        Mouse — Look<br>
        Shift — Run
    </small>
</div>

<div id="crosshair"></div>

<div id="hint">
    Click to explore
</div>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07101c);


/* =====================================================
   CAMERA
===================================================== */

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.05,
    5000
);


/* =====================================================
   RENDERER
===================================================== */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


/* =====================================================
   LIGHT
===================================================== */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x223344,
    2.5
);

scene.add(ambient);


const sun = new THREE.DirectionalLight(
    0xffffff,
    4
);

sun.position.set(50, 80, 30);

sun.castShadow = true;

scene.add(sun);


/* =====================================================
   PLAYER
===================================================== */

const player = {

    height: 2,

    walkSpeed: 8,

    runSpeed: 16,

    acceleration: 40,

    friction: 12

};


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {
    forward: false,
    backward: false,
    left: false,
    right: false,
    run: false
};


window.addEventListener("keydown", function(event) {

    if (
        event.code === "KeyW" ||
        event.code === "ArrowUp"
    ) {
        keys.forward = true;
    }

    if (
        event.code === "KeyS" ||
        event.code === "ArrowDown"
    ) {
        keys.backward = true;
    }

    if (
        event.code === "KeyA" ||
        event.code === "ArrowLeft"
    ) {
        keys.left = true;
    }

    if (
        event.code === "KeyD" ||
        event.code === "ArrowRight"
    ) {
        keys.right = true;
    }

    if (
        event.code === "ShiftLeft" ||
        event.code === "ShiftRight"
    ) {
        keys.run = true;
    }

});


window.addEventListener("keyup", function(event) {

    if (
        event.code === "KeyW" ||
        event.code === "ArrowUp"
    ) {
        keys.forward = false;
    }

    if (
        event.code === "KeyS" ||
        event.code === "ArrowDown"
    ) {
        keys.backward = false;
    }

    if (
        event.code === "KeyA" ||
        event.code === "ArrowLeft"
    ) {
        keys.left = false;
    }

    if (
        event.code === "KeyD" ||
        event.code === "ArrowRight"
    ) {
        keys.right = false;
    }

    if (
        event.code === "ShiftLeft" ||
        event.code === "ShiftRight"
    ) {
        keys.run = false;
    }

});


/* =====================================================
   MOUSE LOOK
===================================================== */

let yaw = 0;

let pitch = 0;

const mouseSensitivity = 0.0022;


renderer.domElement.addEventListener(
    "click",
    function() {

        renderer.domElement.requestPointerLock();

    }
);


document.addEventListener(
    "pointerlockchange",
    function() {

        const locked =
            document.pointerLockElement ===
            renderer.domElement;

        document.getElementById(
            "crosshair"
        ).style.display =
            locked ? "block" : "none";

        document.getElementById(
            "hint"
        ).style.display =
            locked ? "none" : "block";

    }
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {
            return;
        }

        yaw -=
            event.movementX *
            mouseSensitivity;

        pitch -=
            event.movementY *
            mouseSensitivity;

        const limit =
            Math.PI / 2 - 0.05;

        pitch = Math.max(
            -limit,
            Math.min(limit, pitch)
        );

    }
);


/* =====================================================
   LOAD MUSEUM
===================================================== */

const loader = new GLTFLoader();


loader.load(

    "./assets/museum.glb",

    function(gltf) {

        console.log(
            "GLB LOADED:",
            gltf
        );

        const museum = gltf.scene;

        scene.add(museum);


        museum.traverse(
            function(object) {

                if (object.isMesh) {

                    object.castShadow = true;

                    object.receiveShadow = true;

                    if (object.material) {

                        object.material.needsUpdate =
                            true;

                    }

                }

            }
        );


        /* ---------------------------------------------
           FIND SIZE
        --------------------------------------------- */

        const box =
            new THREE.Box3()
                .setFromObject(museum);

        const center =
            box.getCenter(
                new THREE.Vector3()
            );

        const size =
            box.getSize(
                new THREE.Vector3()
            );


        console.log(
            "MODEL CENTER:",
            center
        );

        console.log(
            "MODEL SIZE:",
            size
        );


        /* ---------------------------------------------
           CENTER MODEL
        --------------------------------------------- */

        museum.position.sub(center);


        const centeredBox =
            new THREE.Box3()
                .setFromObject(museum);

        const centeredSize =
            centeredBox.getSize(
                new THREE.Vector3()
            );


        const maxDimension =
            Math.max(
                centeredSize.x,
                centeredSize.y,
                centeredSize.z
            );


        /* ---------------------------------------------
           PLAYER START
        --------------------------------------------- */

        camera.position.set(
            0,
            player.height,
            maxDimension * 0.35
        );


        camera.rotation.order = "YXZ";

        camera.rotation.y = Math.PI;

        camera.rotation.x = 0;


        /* ---------------------------------------------
           FINISHED
        --------------------------------------------- */

        document.getElementById(
            "loading"
        ).style.display = "none";


        console.log(
            "DRAVYA CAMPUS READY"
        );

    },


    function(xhr) {

        if (xhr.total) {

            const percent =
                (xhr.loaded / xhr.total) * 100;

            document.getElementById(
                "loading"
            ).textContent =
                "Loading DRAVYA Campus " +
                percent.toFixed(0) +
                "%";

        }

    },


    function(error) {

        console.error(
            "GLB LOAD ERROR:",
            error
        );

        document.getElementById(
            "loading"
        ).textContent =
            "ERROR loading museum.glb";

    }

);


/* =====================================================
   MOVEMENT
===================================================== */

const velocity =
    new THREE.Vector3();

const forward =
    new THREE.Vector3();

const right =
    new THREE.Vector3();

const desiredVelocity =
    new THREE.Vector3();

const movement =
    new THREE.Vector3();


function updateMovement(delta) {

    movement.set(0, 0, 0);


    if (keys.forward) {
        movement.z -= 1;
    }

    if (keys.backward) {
        movement.z += 1;
    }

    if (keys.left) {
        movement.x -= 1;
    }

    if (keys.right) {
        movement.x += 1;
    }


    if (movement.lengthSq() > 0) {
        movement.normalize();
    }


    /* CAMERA FORWARD */

    forward.set(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );


    /* CAMERA RIGHT */

    right.set(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
    );


    desiredVelocity.set(
        0,
        0,
        0
    );


    desiredVelocity.addScaledVector(
        forward,
        -movement.z
    );


    desiredVelocity.addScaledVector(
        right,
        movement.x
    );


    const speed =
        keys.run
            ? player.runSpeed
            : player.walkSpeed;


    desiredVelocity.multiplyScalar(
        speed
    );


    /* SMOOTH ACCELERATION */

    const acceleration =
        1 -
        Math.exp(
            -player.acceleration * delta
        );


    velocity.lerp(
        desiredVelocity,
        acceleration
    );


    /* FRICTION */

    if (movement.lengthSq() === 0) {

        velocity.multiplyScalar(
            Math.exp(
                -player.friction * delta
            )
        );

    }


    /* MOVE */

    camera.position.addScaledVector(
        velocity,
        delta
    );


    /* KEEP EYE HEIGHT */

    camera.position.y =
        player.height;

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera() {

    camera.rotation.y = yaw;

    camera.rotation.x = pitch;

}


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );

    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updateMovement(delta);

    updateCamera();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
