<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Addy's Pond — DRAVYA</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #050807;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#app {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}


/* LOADING */

#loading {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050807;

    transition:
        opacity 0.8s ease;
}

#loading.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-box {
    width: min(400px, 80vw);

    text-align: center;
}

.loading-title {
    font-size: 10px;

    letter-spacing: 0.35em;

    text-transform: uppercase;

    opacity: 0.6;

    margin-bottom: 20px;
}

.loading-bar {
    width: 100%;
    height: 2px;

    background: rgba(255,255,255,0.12);
}

#loadingProgress {
    width: 0%;
    height: 100%;

    background: white;

    transition:
        width 0.2s ease;
}

#loadingMessage {
    margin-top: 15px;

    font-size: 10px;

    letter-spacing: 0.1em;

    opacity: 0.4;
}


/* ERROR */

#error {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #050807;
}

#error.show {
    display: flex;
}

.error-box {
    max-width: 700px;
}

.error-title {
    font-size: 20px;

    margin-bottom: 20px;
}

#errorMessage {
    white-space: pre-wrap;

    font-family: monospace;

    font-size: 12px;

    line-height: 1.7;

    color: #c7c7c7;
}


/* UI */

#ui {
    position: fixed;

    top: 28px;
    left: 30px;
    right: 30px;

    z-index: 20;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.logo {
    font-size: 13px;

    letter-spacing: 0.3em;

    text-transform: uppercase;
}

.logo-sub {
    margin-top: 7px;

    font-size: 9px;

    letter-spacing: 0.2em;

    opacity: 0.4;
}


/* PLAYER */

#player {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    z-index: 20;

    width: min(600px, calc(100vw - 30px));

    padding: 16px 18px;

    background:
        rgba(5,8,7,0.75);

    border:
        1px solid rgba(255,255,255,0.12);

    backdrop-filter:
        blur(15px);
}

.track {
    display: flex;
    justify-content: space-between;

    margin-bottom: 10px;

    font-size: 9px;

    letter-spacing: 0.2em;

    text-transform: uppercase;
}

#time {
    opacity: 0.4;
}

#progress {
    width: 100%;

    height: 2px;

    appearance: none;

    background:
        rgba(255,255,255,0.15);

    cursor: pointer;
}

#progress::-webkit-slider-thumb {
    appearance: none;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: white;
}

.controls {
    display: flex;

    align-items: center;

    gap: 12px;

    margin-top: 14px;
}

button {
    border: 1px solid
        rgba(255,255,255,0.2);

    background:
        rgba(255,255,255,0.04);

    color: white;

    padding: 8px 15px;

    cursor: pointer;

    font-size: 9px;

    letter-spacing: 0.2em;

    text-transform: uppercase;
}

button:hover {
    background:
        rgba(255,255,255,0.12);
}

</style>
</head>


<body>

<div id="app"></div>


<!-- LOADING -->

<div id="loading">

    <div class="loading-box">

        <div class="loading-title">
            ADDY'S POND
        </div>

        <div class="loading-bar">

            <div id="loadingProgress"></div>

        </div>

        <div id="loadingMessage">
            Preparing the field...
        </div>

    </div>

</div>


<!-- ERROR -->

<div id="error">

    <div class="error-box">

        <div class="error-title">
            Something disturbed the field.
        </div>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- UI -->

<div id="ui">

    <div>

        <div class="logo">
            DRAVYA
        </div>

        <div class="logo-sub">
            ADDY'S POND
        </div>

    </div>

</div>


<!-- PLAYER -->

<div id="player">

    <div class="track">

        <span>
            ARJUNA
        </span>

        <span id="time">
            00:00 / 00:00
        </span>

    </div>


    <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
    >


    <div class="controls">

        <button id="play">
            PLAY
        </button>

        <button id="restart">
            RESTART
        </button>

    </div>

</div>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


/* =====================================================
   PATHS
===================================================== */

const GLB =
    "./assets/addypond.glb";

const JSON_FILE =
    "./assets/arjuna_pond_data.json";

const AUDIO =
    "./assets/arjunaaaaa.mp3";


/* =====================================================
   DOM
===================================================== */

const app =
    document.getElementById("app");

const loading =
    document.getElementById("loading");

const loadingProgress =
    document.getElementById("loadingProgress");

const loadingMessage =
    document.getElementById("loadingMessage");

const errorScreen =
    document.getElementById("error");

const errorMessage =
    document.getElementById("errorMessage");

const playButton =
    document.getElementById("play");

const restartButton =
    document.getElementById("restart");

const progress =
    document.getElementById("progress");

const timeDisplay =
    document.getElementById("time");


/* =====================================================
   ERROR HANDLER
===================================================== */

function showError(error) {

    console.error(error);

    loading.style.display =
        "none";

    errorScreen.classList.add(
        "show"
    );

    errorMessage.textContent =
        String(error);

}


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x050807
    );

scene.fog =
    new THREE.FogExp2(
        0x050807,
        0.015
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        500
    );

camera.position.set(
    15,
    10,
    18
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.1;

app.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.HemisphereLight(
        0xbfd0c5,
        0x161b18,
        2
    )
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    -10,
    20,
    10
);

scene.add(sun);


/* =====================================================
   LOAD GLB
===================================================== */

function loadGLB() {

    return new Promise(
        (resolve, reject) => {

            loadingMessage.textContent =
                "Loading landscape...";


            const loader =
                new GLTFLoader();


            loader.load(

                GLB,

                function(gltf) {

                    console.log(
                        "GLB SUCCESS:",
                        gltf
                    );


                    const model =
                        gltf.scene;


                    scene.add(
                        model
                    );


                    /*
                     * Print every object.
                     * This will help us identify
                     * your water mesh exactly.
                     */

                    model.traverse(
                        function(object) {

                            if (
                                object.isMesh
                            ) {

                                console.log(
                                    "MESH:",
                                    object.name
                                );

                            }

                        }
                    );


                    loadingProgress.style.width =
                        "50%";


                    resolve(
                        model
                    );

                },


                function(xhr) {

                    if (xhr.total > 0) {

                        const percent =
                            xhr.loaded /
                            xhr.total *
                            50;

                        loadingProgress.style.width =
                            percent + "%";

                    }

                },


                function(error) {

                    reject(
                        "GLB FAILED:\n\n"
                        + GLB
                        + "\n\n"
                        + JSON.stringify(
                            error
                        )
                    );

                }

            );

        }
    );

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadJSON() {

    loadingMessage.textContent =
        "Loading pond field data...";


    const response =
        await fetch(
            JSON_FILE
        );


    if (!response.ok) {

        throw new Error(
            "JSON FAILED\n\n"
            + JSON_FILE
            + "\n\nHTTP status: "
            + response.status
        );

    }


    const data =
        await response.json();


    if (
        !data.frames ||
        !Array.isArray(
            data.frames
        )
    ) {

        throw new Error(
            "JSON loaded, but the expected 'frames' array was not found."
        );

    }


    console.log(
        "JSON SUCCESS:",
        data
    );


    console.log(
        "Frames:",
        data.frames.length
    );


    console.log(
        "Metadata:",
        data.metadata
    );


    loadingProgress.style.width =
        "75%";


    return data;

}


/* =====================================================
   AUDIO
===================================================== */

function loadAudio() {

    return new Promise(
        (resolve, reject) => {

            loadingMessage.textContent =
                "Preparing Arjuna...";


            const audio =
                new Audio();


            audio.preload =
                "metadata";


            audio.src =
                AUDIO;


            audio.addEventListener(
                "loadedmetadata",
                function() {

                    console.log(
                        "AUDIO SUCCESS"
                    );

                    console.log(
                        "Duration:",
                        audio.duration
                    );


                    loadingProgress.style.width =
                        "100%";


                    resolve(
                        audio
                    );

                }
            );


            audio.addEventListener(
                "error",
                function() {

                    reject(
                        "MP3 FAILED:\n\n"
                        + AUDIO
                        + "\n\n"
                        + "Check that the filename is exactly:\n"
                        + "arjunaaaaa.mp3"
                    );

                }
            );

        }
    );

}


/* =====================================================
   START
===================================================== */

let audio;
let pondData;


async function start() {

    try {

        /*
         * Load GLB first.
         */

        await loadGLB();


        /*
         * Load JSON.
         */

        pondData =
            await loadJSON();


        /*
         * Load MP3.
         */

        audio =
            await loadAudio();


        /*
         * Everything loaded.
         */

        loadingMessage.textContent =
            "Pond ready.";


        setTimeout(
            function() {

                loading.classList.add(
                    "hidden"
                );

            },
            500
        );


        setupPlayer();


    }
    catch(error) {

        showError(error);

    }

}


/* =====================================================
   PLAYER
===================================================== */

function setupPlayer() {

    playButton.addEventListener(
        "click",
        async function() {

            if (
                audio.paused
            ) {

                await audio.play();

                playButton.textContent =
                    "PAUSE";

            }
            else {

                audio.pause();

                playButton.textContent =
                    "PLAY";

            }

        }
    );


    restartButton.addEventListener(
        "click",
        function() {

            audio.currentTime =
                0;

        }
    );


    progress.addEventListener(
        "input",
        function() {

            if (
                audio.duration
            ) {

                audio.currentTime =
                    Number(
                        progress.value
                    ) /
                    100 *
                    audio.duration;

            }

        }
    );


    audio.addEventListener(
        "timeupdate",
        function() {

            if (!audio.duration)
                return;


            progress.value =
                audio.currentTime /
                audio.duration *
                100;


            timeDisplay.textContent =
                formatTime(
                    audio.currentTime
                )
                + " / "
                +
                formatTime(
                    audio.duration
                );


            /*
             * THIS IS THE IMPORTANT
             * SYNCHRONIZATION POINT.
             */

            const fps =
                pondData.metadata?.fps
                || 30;


            const frameNumber =
                Math.floor(
                    audio.currentTime *
                    fps
                );


            const frame =
                pondData.frames[
                    Math.min(
                        frameNumber,
                        pondData.frames.length - 1
                    )
                ];


            if (frame) {

                /*
                 * For now simply expose
                 * the actual JSON frame.
                 */

                console.log(
                    "POND FRAME:",
                    frame.frame,
                    "energy:",
                    frame.energy,
                    "bass:",
                    frame.bass,
                    "onset:",
                    frame.onset
                );

            }

        }
    );


    audio.addEventListener(
        "ended",
        function() {

            playButton.textContent =
                "PLAY";

        }
    );

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(
    seconds
) {

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return (
        String(minutes)
        .padStart(2, "0")
        + ":"
        +
        String(secs)
        .padStart(2, "0")
    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   LOOP
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   GO
===================================================== */

start();

</script>

</body>
</html>
