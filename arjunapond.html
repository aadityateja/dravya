canvas {

/* =====================================================
   LOADING
===================================================== */

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;

    align-items: center;
    justify-content: center;

    transition: opacity 1s ease;
}

#loading.hidden {
    opacity: 0;
    pointer-events: none;
}

.loading-box {
    width: min(400px, 80vw);
    text-align: center;
}

.loading-title {
    font-size: 10px;
    letter-spacing: .35em;
    text-transform: uppercase;
    opacity: .6;
    margin-bottom: 20px;
}

.loading-bar {
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,.12);
}

#loadingProgress {
    width: 0%;
    height: 100%;
    background: white;
    transition: width .2s ease;
}

#loadingMessage {
    margin-top: 15px;
    font-size: 10px;
    letter-spacing: .1em;
    opacity: .4;
}


/* =====================================================
   ERROR
===================================================== */

#error {
    position: fixed;
    inset: 0;
    z-index: 200;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: #050807;
}

#error.show {
    display: flex;
}

.error-box {
    max-width: 700px;
}

.error-title {
    font-size: 20px;
    margin-bottom: 20px;
}

#errorMessage {
    white-space: pre-wrap;
    font-family: monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #c7c7c7;
}


/* =====================================================
   TOP
===================================================== */

#ui {
    position: fixed;
    top: 28px;
    left: 30px;
    right: 30px;

    z-index: 20;

    display: flex;
    justify-content: space-between;

    pointer-events: none;
}

.logo {
    font-size: 13px;
    letter-spacing: .3em;
    text-transform: uppercase;
}

.logo-sub {
    margin-top: 7px;
    font-size: 9px;
    letter-spacing: .2em;
    opacity: .4;
}


/* =====================================================
   FIELD STATUS
===================================================== */

#status {
    display: flex;
    align-items: center;
    gap: 9px;

    font-size: 9px;
    letter-spacing: .18em;
    text-transform: uppercase;

    opacity: .45;
}

#statusDot {
    width: 6px;
    height: 6px;

    box-shadow:

   PLAYER
===================================================== */

}

===================================================== */

    align-items: center;

    left: 0;

.controls {

}

button {

button:hover {

    }

<script type="importmap">
{
    "imports": {

        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
}
from
"three/addons/loaders/GLTFLoader.js";


/* =====================================================
   FILES
===================================================== */

const GLB_FILE =
    "./assets/addypond.glb";

const JSON_FILE =
    "./assets/arjuna_pond_data.json";

const AUDIO_FILE =
    "./assets/arjunaaaaa.mp3";


/* =====================================================
   DOM
===================================================== */

const app =
    document.getElementById("app");

const loading =
    document.getElementById("loading");

const loadingProgress =
    document.getElementById("loadingProgress");

const loadingMessage =
    document.getElementById("loadingMessage");

const errorScreen =
    document.getElementById("error");

const errorMessage =
    document.getElementById("errorMessage");

const playButton =
    document.getElementById("play");

const restartButton =
    document.getElementById("restart");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const progressDot =
    document.getElementById("progressDot");

const timeDisplay =
    document.getElementById("time");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x050807
    );

scene.fog =
    new THREE.FogExp2(
        0x050807,
        0.012
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

camera.position.set(
    0,
    7,
    16
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference:
            "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.15;

app.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

const hemi =
    new THREE.HemisphereLight(
        0xc9d7ce,
        0x18201b,
        2.5
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3.5
    );

sun.position.set(
    -15,
    25,
    12
);

scene.add(sun);


const fill =
    new THREE.DirectionalLight(
        0x9eb8aa,
        1.2
    );

fill.position.set(
    15,
    8,
    -15
);

scene.add(fill);


/* =====================================================
   MODEL VARIABLES
===================================================== */

let pondModel = null;

let pondWater = null;

let waterOriginalPositions = null;

let waterPositionAttribute = null;

let waterBounds = null;


/* =====================================================
   AUDIO / DATA
===================================================== */

let audio = null;

let pondData = null;

let frames = [];

let FPS = 30;


/* =====================================================
   RIPPLE SOURCES
===================================================== */

let rippleSources = [];


/*
 * Deterministic pseudo-random function.
 *
 * Same JSON always produces the same
 * ripple locations.
 */

function seededRandom(seed) {

    const x =
        Math.sin(seed * 12.9898)
        * 43758.5453;

    return x -
        Math.floor(x);

}


/* =====================================================
   BUILD RIPPLE SOURCES
===================================================== */

function buildRippleSources() {

    rippleSources = [];

    if (!frames.length)
        return;


    /*
     * We detect musical disturbance
     * directly from JSON onset.
     */

    let lastFrame =
        -999;


    for (
        let i = 0;
        i < frames.length;
        i++
    ) {

        const frame =
            frames[i];

        const onset =
            Number(frame.onset || 0);


        /*
         * Only create a new ripple
         * when the JSON says there is
         * an actual disturbance.
         */

        if (
            onset > 0.18 &&
            i - lastFrame > 7
        ) {

            const angle =
                seededRandom(i * 17.31)
                * Math.PI * 2;


            const radius =
                0.25 +
                seededRandom(i * 31.71)
                * 0.32;


            rippleSources.push({

                frame: i,

                x:
                    Math.cos(angle)
                    * radius,

                z:
                    Math.sin(angle)
                    * radius,

                strength:
                    Math.min(
                        1,
                        onset * 1.8
                    )

            });


            lastFrame = i;

        }

    }


    console.log(
        "Ripple sources:",
        rippleSources.length
    );

}


/* =====================================================
   LOAD GLB
===================================================== */

function loadGLB() {

    return new Promise(
        (resolve, reject) => {

            loadingMessage.textContent =
                "Loading landscape...";


            const loader =
                new GLTFLoader();


            loader.load(

                GLB_FILE,

                gltf => {

                    pondModel =
                        gltf.scene;


                    scene.add(
                        pondModel
                    );


                    console.log(
                        "GLB loaded."
                    );


                    /*
                     * ------------------------------------------------
                     * AUTOMATIC CENTERING
                     * ------------------------------------------------
                     *
                     * Calculate the actual visual bounding box
                     * instead of trusting the GLB origin.
                     */

                    const box =
                        new THREE.Box3()
                            .setFromObject(
                                pondModel
                            );


                    const center =
                        box.getCenter(
                            new THREE.Vector3()
                        );


                    const size =
                        box.getSize(
                            new THREE.Vector3()
                        );


                    /*
                     * Move the complete landscape so
                     * its visual center is at world 0,0,0.
                     */

                    pondModel.position.x -=
                        center.x;

                    pondModel.position.z -=
                        center.z;


                    /*
                     * Put the lowest point on y = 0.
                     */

                    pondModel.position.y -=
                        box.min.y;


                    /*
                     * Print model information.
                     */

                    console.log(
                        "GLB SIZE:",
                        size
                    );


                    console.log(
                        "GLB CENTER:",
                        center
                    );


                    /*
                     * Find the actual water mesh.
                     */

                    pondModel.traverse(
                        object => {

                            if (
                                !object.isMesh
                            )
                                return;


                            console.log(
                                "OBJECT:",
                                object.name
                            );


                            const name =
                                object.name
                                    .toLowerCase();


                            if (
                                !pondWater &&
                                (
                                    name.includes(
                                        "water"
                                    )
                                    ||
                                    name.includes(
                                        "pond"
                                    )
                                )
                            ) {

                                pondWater =
                                    object;

                                console.log(
                                    "WATER FOUND:",
                                    object.name
                                );

                            }

                        }
                    );


                    /*
                     * If the GLB water was named correctly,
                     * prepare its vertices.
                     */

                    if (pondWater) {

                        prepareWater(
                            pondWater
                        );

                    }
                    else {

                        console.warn(
                            "No water mesh detected."
                        );

                    }


                    loadingProgress.style.width =
                        "45%";


                    resolve();

                },

                xhr => {

                    if (xhr.total) {

                        const percent =
                            xhr.loaded /
                            xhr.total *
                            45;

                        loadingProgress.style.width =
                            percent + "%";

                    }

                },

                error => {

                    reject(
                        "GLB FAILED:\n\n"
                        + GLB_FILE
                    );

                }

            );

        }
    );

}


/* =====================================================
   PREPARE WATER
===================================================== */

function prepareWater(
    water
) {

    const geometry =
        water.geometry;


    /*
     * Convert to non-indexed geometry.
     *
     * This makes direct vertex deformation
     * predictable.
     */

    if (
        geometry.index
    ) {

        water.geometry =
            geometry.toNonIndexed();

    }


    const position =
        water.geometry
            .attributes
            .position;


    waterPositionAttribute =
        position;


    /*
     * Save the original water
     * vertex coordinates.
     */

    waterOriginalPositions =
        new Float32Array(
            position.array
        );


    waterBounds =
        new THREE.Box3()
            .setFromBufferAttribute(
                position
            );


    /*
     * Water needs enough vertices for
     * visible deformation.
     */

    console.log(
        "Water vertices:",
        position.count
    );


    /*
     * Slightly transparent / reflective
     * water if the GLB material allows it.
     */

    const material =
        water.material;


    if (material) {

        material.transparent = true;

        material.opacity =
            Math.min(
                material.opacity ?? 1,
                0.88
            );

        material.roughness =
            0.16;

    }

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadJSON() {

    loadingMessage.textContent =
        "Reading the field...";


    const response =
        await fetch(
            JSON_FILE
        );


    if (!response.ok) {

        throw new Error(
            "Could not load:\n"
            + JSON_FILE
        );

    }


    pondData =
        await response.json();


    frames =
        pondData.frames || [];


    FPS =
        pondData.metadata?.fps
        || 30;


    console.log(
        "JSON frames:",
        frames.length
    );


    console.log(
        "FPS:",
        FPS
    );


    buildRippleSources();


    loadingProgress.style.width =
        "75%";

}


/* =====================================================
   LOAD AUDIO
===================================================== */

function loadAudio() {

    return new Promise(
        (resolve, reject) => {

            loadingMessage.textContent =
                "Preparing Arjuna...";


            const sound =
                new Audio();


            sound.preload =
                "auto";


            sound.src =
                AUDIO_FILE;


            sound.addEventListener(
                "loadedmetadata",
                () => {

                    console.log(
                        "Audio duration:",
                        sound.duration
                    );


                    resolve(
                        sound
                    );

                }
            );


            sound.addEventListener(
                "error",
                () => {

                    reject(
                        "MP3 FAILED:\n\n"
                        + AUDIO_FILE
                    );

                }
            );

        }
    );

}


/* =====================================================
   FRAME INTERPOLATION
===================================================== */

function getInterpolatedFrame(
    time
) {

    if (!frames.length)
        return null;


    const position =
        time * FPS;


    const i =
        Math.floor(position);


    const next =
        Math.min(
            i + 1,
            frames.length - 1
        );


    const a =
        frames[
            Math.max(
                0,
                Math.min(
                    i,
                    frames.length - 1
                )
            )
        ];


    const b =
        frames[next];


    const t =
        position -
        Math.floor(position);


    return {
        a,
        b,
        t
    };

}


/* =====================================================
   INTERPOLATE
===================================================== */

function lerp(
    a,
    b,
    t
) {

    return a +
        (b - a) * t;

}


/* =====================================================
   WATER DEFORMATION
===================================================== */

function deformWater(
    time
) {

    if (
        !pondWater ||
        !waterPositionAttribute ||
        !waterOriginalPositions
    )
        return;


    const data =
        getInterpolatedFrame(
            time
        );


    if (!data)
        return;


    const {
        a,
        b,
        t
    } = data;


    const energy =
        lerp(
            Number(a.energy || 0),
            Number(b.energy || 0),
            t
        );


    const bass =
        lerp(
            Number(a.bass || 0),
            Number(b.bass || 0),
            t
        );


    const mid =
        lerp(
            Number(a.mid || 0),
            Number(b.mid || 0),
            t
        );


    const high =
        lerp(
            Number(a.high || 0),
            Number(b.high || 0),
            t
        );


    /*
     * ------------------------------------------------
     * NORMALIZED MUSIC INTENSITY
     * ------------------------------------------------
     */

    const energyStrength =
        THREE.MathUtils.clamp(
            energy * 7,
            0,
            1
        );


    const bassStrength =
        THREE.MathUtils.clamp(
            bass * 8,
            0,
            1
        );


    const midStrength =
        THREE.MathUtils.clamp(
            mid * 10,
            0,
            1
        );


    const highStrength =
        THREE.MathUtils.clamp(
            high * 15,
            0,
            1
        );


    /*
     * Current JSON frame.
     */

    const currentFrame =
        time * FPS;


    const positions =
        waterPositionAttribute.array;


    /*
     * ------------------------------------------------
     * EVERY WATER VERTEX
     * ------------------------------------------------
     */

    for (
        let i = 0;
        i < positions.length;
        i += 3
    ) {

        const originalX =
            waterOriginalPositions[i];

        const originalY =
            waterOriginalPositions[i + 1];

        const originalZ =
            waterOriginalPositions[i + 2];


        /*
         * Normalize position relative to
         * the pond.
         */

        const x =
            originalX;

        const z =
            originalZ;


        let displacement = 0;


        /*
         * ------------------------------------------------
         * 1. MUSICAL RIPPLE EVENTS
         * ------------------------------------------------
         */

        for (
            let r = 0;
            r < rippleSources.length;
            r++
        ) {

            const ripple =
                rippleSources[r];


            const age =
                currentFrame -
                ripple.frame;


            /*
             * Ripple only exists after
             * the musical event.
             */

            if (
                age < 0 ||
                age > FPS * 3
            )
                continue;


            /*
             * Expanding radius.
             */

            const radius =
                age * 0.055;


            const dx =
                x - ripple.x;


            const dz =
                z - ripple.z;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dz * dz
                );


            /*
             * Ripple ring.
             */

            const ring =
                distance -
                radius;


            const width =
                0.18 +
                bassStrength * 0.15;


            const ringShape =
                Math.exp(
                    -(
                        ring * ring
                    ) /
                    (
                        width *
                        width
                    )
                );


            /*
             * Natural decay.
             */

            const decay =
                Math.exp(
                    -age /
                    (FPS * 1.8)
                );


            displacement +=
                ringShape *
                decay *
                ripple.strength *
                0.24;

        }


        /*
         * ------------------------------------------------
         * 2. BROAD BASS MOVEMENT
         * ------------------------------------------------
         *
         * This gives the pond an underlying
         * breathing motion.
         */

        displacement +=

            Math.sin(
                x * 1.1 +
                currentFrame * 0.055
            )
            *
            Math.cos(
                z * 0.85 +
                currentFrame * 0.043
            )
            *
            bassStrength
            *
            0.055;


        /*
         * ------------------------------------------------
         * 3. MID FREQUENCY
         * ------------------------------------------------
         */

        displacement +=

            Math.sin(
                x * 2.4 -
                z * 1.7 +
                currentFrame * 0.10
            )
            *
            midStrength
            *
            0.022;


        /*
         * ------------------------------------------------
         * 4. HIGH FREQUENCY
         * ------------------------------------------------
         */

        displacement +=

            Math.sin(
                x * 5.2 +
                z * 4.7 +
                currentFrame * 0.18
            )
            *
            highStrength
            *
            0.009;


        /*
         * ------------------------------------------------
         * 5. OVERALL ENERGY
         * ------------------------------------------------
         */

        displacement *=
            0.55 +
            energyStrength * 0.8;


        /*
         * Don't allow enormous
         * accidental deformation.
         */

        displacement =
            THREE.MathUtils.clamp(
                displacement,
                -0.28,
                0.38
            );


        positions[i + 1] =
            originalY +
            displacement;

    }


    waterPositionAttribute
        .needsUpdate = true;


    /*
     * Update status light.
     */

    const activity =
        THREE.MathUtils.clamp(
            energyStrength +
            bassStrength * .5,
            0,
            1
        );


    statusDot.style.transform =
        `scale(${1 + activity * 1.8})`;


    statusDot.style.boxShadow =
        `0 0 ${
            8 + activity * 18
        }px rgba(120,147,125,${
            .4 + activity * .6
        })`;

}


/* =====================================================
   SMOOTH PLAYER
===================================================== */

function updatePlayer() {

    if (!audio)
        return;


    if (
        Number.isFinite(
            audio.duration
        ) &&
        audio.duration > 0
    ) {

        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        /*
         * This updates every animation
         * frame rather than waiting for
         * audio's timeupdate event.
         */

        progressFill.style.width =
            percentage + "%";


        progressDot.style.left =
            percentage + "%";


        progress.value =
            percentage;


        timeDisplay.textContent =
            formatTime(
                audio.currentTime
            )
            +
            " / "
            +
            formatTime(
                audio.duration
            );

    }


    /*
     * This is the actual music → JSON
     * → water connection.
     */

    deformWater(
        audio.currentTime
    );

}


/* =====================================================
   TIME FORMAT
===================================================== */

function formatTime(
    seconds
) {

    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2, "0")
        +
        ":"
        +
        String(secs)
            .padStart(2, "0")
    );

}


/* =====================================================
   PLAY
===================================================== */

playButton.addEventListener(
    "click",
    async () => {

        if (!audio)
            return;


        if (audio.paused) {

            try {

                await audio.play();

                playButton.textContent =
                    "PAUSE";

                statusText.textContent =
                    "FIELD DISTURBED";

            }
            catch(error) {

                console.error(
                    error
                );

            }

        }
        else {

            audio.pause();

            playButton.textContent =
                "PLAY";

            statusText.textContent =
                "FIELD SUSPENDED";

        }

    }
);


/* =====================================================
   RESTART
===================================================== */

restartButton.addEventListener(
    "click",
    () => {

        if (!audio)
            return;


        audio.currentTime =
            0;


        deformWater(
            0
        );

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.addEventListener(
    "input",
    () => {

        if (
            !audio ||
            !audio.duration
        )
            return;


        audio.currentTime =
            Number(progress.value)
            /
            100
            *
            audio.duration;


        /*
         * Immediately jump pond to
         * the selected JSON frame.
         */

        deformWater(
            audio.currentTime
        );

    }
);


/* =====================================================
   AUDIO END
===================================================== */

function setupAudioEvents() {

    audio.addEventListener(
        "ended",
        () => {

            playButton.textContent =
                "PLAY";

            statusText.textContent =
                "FIELD AT REST";

            deformWater(
                0
            );

        }
    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   INITIALIZE
===================================================== */

async function initialize() {

    try {

        await loadGLB();

        await loadJSON();

        audio =
            await loadAudio();


        setupAudioEvents();


        loadingProgress.style.width =
            "100%";


        loadingMessage.textContent =
            "THE POND IS READY";


        setTimeout(
            () => {

                loading.classList.add(
                    "hidden"
                );

            },
            600
        );


    }
    catch(error) {

        console.error(
            error
        );


        loading.style.display =
            "none";


        errorScreen.classList.add(
            "show"
        );


        errorMessage.textContent =
            String(error);

    }

}


initialize();

</script>
