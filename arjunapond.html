<style>

/* ============================================================
   RESET
============================================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        #07100d;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

   THREE.JS
============================================================ */

#scene {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;
}


canvas {

    display: block;

    width: 100%;
    height: 100%;

============================================================ */

}

============================================================ */

        100%;

    align-items:

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// CONFIG
// ============================================================

const GLB_PATH =
    "./assets/addypond.glb";

const JSON_PATH =
    "./assets/arjuna_pond_data.json";

const FPS =
    30;


// ============================================================
// DOM
// ============================================================

const sceneContainer =
    document.getElementById(
        "scene"
    );

const loading =
    document.getElementById(
        "loading"
    );

const audio =
    document.getElementById(
        "audio"
    );

const playButton =
    document.getElementById(
        "play"
    );

const pauseButton =
    document.getElementById(
        "pause"
    );

const stopButton =
    document.getElementById(
        "stop"
    );

const replayButton =
    document.getElementById(
        "replay"
    );

const volume =
    document.getElementById(
        "volume"
    );

const timeline =
    document.getElementById(
        "timeline"
    );

const timelineFill =
    document.getElementById(
        "timeline-fill"
    );

const timelineDot =
    document.getElementById(
        "timeline-dot"
    );

const timeDisplay =
    document.getElementById(
        "time"
    );

const status =
    document.getElementById(
        "status"
    );


// ============================================================
// THREE SCENE
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x07100d
    );


// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        38,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.05;

sceneContainer.appendChild(
    renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const hemisphere =
    new THREE.HemisphereLight(
        0xcce4d8,
        0x18231c,
        2.0
    );

scene.add(
    hemisphere
);


const sun =
    new THREE.DirectionalLight(
        0xffe3bd,
        3.2
    );

sun.position.set(
    -10,
    15,
    8
);

scene.add(
    sun
);


const fill =
    new THREE.DirectionalLight(
        0x8ebdb2,
        1.0
    );

fill.position.set(
    8,
    8,
    -10
);

scene.add(
    fill
);


// ============================================================
// VARIABLES
// ============================================================

let pondModel =
    null;

let pondWater =
    null;

let waterPosition =
    null;

let originalPositions =
    null;

let waterBounds =
    null;

let frames =
    [];

let rippleSources =
    [];


// ============================================================
// LOAD JSON
// ============================================================

async function loadJSON() {

    const response =
        await fetch(
            JSON_PATH
        );

    if (!response.ok) {

        throw new Error(
            "JSON failed to load"
        );

    }

    const data =
        await response.json();

    frames =
        data.frames || [];

    console.log(
        "JSON frames:",
        frames.length
    );

}


// ============================================================
// FIND WATER
// ============================================================

function findWater(model) {

    let result =
        null;

    model.traverse(
        object => {

            if (!object.isMesh)
                return;

            const name =
                object.name
                .toLowerCase();

            if (
                name.includes(
                    "water"
                )
            ) {

                result =
                    object;

            }

        }
    );

    if (!result) {

        model.traverse(
            object => {

                if (!object.isMesh)
                    return;

                const name =
                    object.name
                    .toLowerCase();

                if (
                    name.includes(
                        "pond"
                    )
                ) {

                    if (!result)
                        result =
                            object;

                }

            }
        );

    }

    return result;

}


// ============================================================
// PREPARE WATER
// ============================================================

function prepareWater(
    water
) {

    if (!water)
        return;


    /*
        Convert indexed mesh so
        individual vertices can move.
    */

    if (
        water.geometry.index
    ) {

        water.geometry =
            water.geometry
            .toNonIndexed();

    }


    const position =
        water.geometry
        .attributes
        .position;


    if (!position) {

        console.warn(
            "Water has no vertices"
        );

        return;

    }


    waterPosition =
        position;


    originalPositions =
        new Float32Array(
            position.array
        );


    waterBounds =
        new THREE.Box3()
        .setFromBufferAttribute(
            position
        );


    console.log(
        "WATER:",
        water.name
    );

    console.log(
        "VERTICES:",
        position.count
    );


    /*
        Make water reflective.
    */

    if (
        water.material &&
        !Array.isArray(
            water.material
        )
    ) {

        water.material
            .transparent =
            true;

        water.material
            .opacity =
            0.9;

        water.material
            .roughness =
            0.16;

    }

}


// ============================================================
// RIPPLE SOURCES
// ============================================================

function createRippleSources() {

    rippleSources = [];

    if (!frames.length)
        return;


    let previous =
        -999;


    for (
        let i = 0;
        i < frames.length;
        i++
    ) {

        const frame =
            frames[i];

        const onset =
            Number(
                frame.onset || 0
            );


        /*
            Stronger onset threshold
            gives clear musical events.
        */

        if (
            onset > 0.12 &&
            i - previous > 6
        ) {

            const s1 =
                Math.sin(
                    i * 91.73
                );

            const s2 =
                Math.sin(
                    i * 47.19
                );


            const randomX =
                (
                    s1 + 1
                ) / 2;


            const randomZ =
                (
                    s2 + 1
                ) / 2;


            const minX =
                waterBounds.min.x;

            const maxX =
                waterBounds.max.x;

            const minZ =
                waterBounds.min.z;

            const maxZ =
                waterBounds.max.z;


            rippleSources.push({

                frame:
                    i,

                x:
                    THREE.MathUtils.lerp(
                        minX,
                        maxX,
                        randomX
                    ),

                z:
                    THREE.MathUtils.lerp(
                        minZ,
                        maxZ,
                        randomZ
                    ),

                strength:
                    THREE.MathUtils.clamp(
                        onset * 4.5,
                        0.45,
                        1.0
                    )

            });


            previous =
                i;

        }

    }


    console.log(
        "RIPPLES:",
        rippleSources.length
    );

}


// ============================================================
// FRAME INTERPOLATION
// ============================================================

function getFrame(
    time
) {

    if (!frames.length)
        return null;


    const position =
        THREE.MathUtils.clamp(
            time * FPS,
            0,
            frames.length - 1
        );


    const index =
        Math.floor(
            position
        );


    const next =
        Math.min(
            index + 1,
            frames.length - 1
        );


    const amount =
        position -
        index;


    return {

        a:
            frames[index],

        b:
            frames[next],

        t:
            amount

    };

}


// ============================================================
// LERP
// ============================================================

function lerp(
    a,
    b,
    t
) {

    return (
        a +
        (
            b - a
        ) * t
    );

}


// ============================================================
// WATER DEFORMATION
// ============================================================

function animateWater(
    time
) {

    if (
        !waterPosition ||
        !originalPositions
    )
        return;


    const data =
        getFrame(
            time
        );

    if (!data)
        return;


    const energy =
        lerp(
            Number(
                data.a.energy || 0
            ),
            Number(
                data.b.energy || 0
            ),
            data.t
        );


    const bass =
        lerp(
            Number(
                data.a.bass || 0
            ),
            Number(
                data.b.bass || 0
            ),
            data.t
        );


    const mid =
        lerp(
            Number(
                data.a.mid || 0
            ),
            Number(
                data.b.mid || 0
            ),
            data.t
        );


    const high =
        lerp(
            Number(
                data.a.high || 0
            ),
            Number(
                data.b.high || 0
            ),
            data.t
        );


    const currentFrame =
        time * FPS;


    const positions =
        waterPosition.array;


    /*
        Exaggerated enough to make
        the JSON patterns clearly visible.
    */

    const bassAmount =
        THREE.MathUtils.clamp(
            bass * 12,
            0,
            1
        );


    const midAmount =
        THREE.MathUtils.clamp(
            mid * 16,
            0,
            1
        );


    const highAmount =
        THREE.MathUtils.clamp(
            high * 22,
            0,
            1
        );


    const energyAmount =
        THREE.MathUtils.clamp(
            energy * 10,
            0,
            1
        );


    // ========================================================
    // VERTICES
    // ========================================================

    for (
        let i = 0;
        i < positions.length;
        i += 3
    ) {

        const x =
            originalPositions[i];

        const y =
            originalPositions[i + 1];

        const z =
            originalPositions[i + 2];


        let wave =
            0;


        // ====================================================
        // EVENT RIPPLE WAVES
        // ====================================================

        for (
            let r = 0;
            r < rippleSources.length;
            r++
        ) {

            const ripple =
                rippleSources[r];


            const age =
                currentFrame -
                ripple.frame;


            if (
                age < 0 ||
                age > FPS * 3.5
            )
                continue;


            /*
                Expanding circular wave.
            */

            const radius =
                age * 0.085;


            const dx =
                x -
                ripple.x;


            const dz =
                z -
                ripple.z;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dz * dz
                );


            const ring =
                distance -
                radius;


            const width =
                0.12 +
                bassAmount * 0.10;


            const ringWave =
                Math.exp(
                    -(
                        ring *
                        ring
                    ) /
                    (
                        width *
                        width
                    )
                );


            const oscillation =
                Math.sin(
                    ring * 10
                );


            const decay =
                Math.exp(
                    -age /
                    (
                        FPS * 1.7
                    )
                );


            wave +=

                ringWave *
                oscillation *
                decay *
                ripple.strength *
                0.55;

        }


        // ====================================================
        // BROAD MUSICAL WATER MOTION
        // ====================================================

        wave +=

            Math.sin(
                x * 0.9 +
                currentFrame * 0.07
            )

            *

            Math.cos(
                z * 0.8 +
                currentFrame * 0.05
            )

            *

            bassAmount *
            0.08;


        // ====================================================
        // MID DETAIL
        // ====================================================

        wave +=

            Math.sin(
                x * 2.7 -
                z * 1.9 +
                currentFrame * 0.13
            )

            *

            midAmount *
            0.035;


        // ====================================================
        // HIGH DETAIL
        // ====================================================

        wave +=

            Math.sin(
                x * 6.0 +
                z * 5.0 +
                currentFrame * 0.2
            )

            *

            highAmount *
            0.015;


        // ====================================================
        // ENERGY
        // ====================================================

        wave *=
            0.7 +
            energyAmount;


        // ====================================================
        // FINAL LIMIT
        // ====================================================

        wave =
            THREE.MathUtils.clamp(
                wave,
                -0.45,
                0.55
            );


        positions[i + 1] =
            y + wave;

    }


    waterPosition.needsUpdate =
        true;

}


// ============================================================
// LOAD GLB
// ============================================================

async function loadGLB() {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const loader =
                new GLTFLoader();


            loader.load(

                GLB_PATH,

                gltf => {

                    pondModel =
                        gltf.scene;


                    scene.add(
                        pondModel
                    );


                    // ==========================================
                    // CENTER MODEL
                    // ==========================================

                    let box =
                        new THREE.Box3()
                        .setFromObject(
                            pondModel
                        );


                    const center =
                        box.getCenter(
                            new THREE.Vector3()
                        );


                    pondModel.position.x =
                        -center.x;

                    pondModel.position.z =
                        -center.z;


                    pondModel.position.y =
                        -box.min.y;


                    // ==========================================
                    // SMALLER WORLD
                    // ==========================================

                    pondModel.scale.setScalar(
                        0.72
                    );


                    // ==========================================
                    // WATER
                    // ==========================================

                    pondWater =
                        findWater(
                            pondModel
                        );


                    prepareWater(
                        pondWater
                    );


                    createRippleSources();


                    // ==========================================
                    // CAMERA FIT
                    // ==========================================

                    box =
                        new THREE.Box3()
                        .setFromObject(
                            pondModel
                        );


                    const finalCenter =
                        box.getCenter(
                            new THREE.Vector3()
                        );


                    const size =
                        box.getSize(
                            new THREE.Vector3()
                        );


                    const largest =
                        Math.max(
                            size.x,
                            size.y,
                            size.z
                        );


                    /*
                        Elevated cinematic
                        observation angle.
                    */

                    camera.position.set(

                        largest * 0.08,

                        largest * 1.55,

                        largest * 0.72

                    );


                    camera.lookAt(

                        finalCenter.x,

                        finalCenter.y,

                        finalCenter.z

                    );


                    console.log(
                        "GLB loaded"
                    );

                    console.log(
                        "Water:",
                        pondWater
                    );

                    console.log(
                        "Camera:",
                        camera.position
                    );


                    resolve();

                },

                undefined,

                error => {

                    reject(
                        error
                    );

                }

            );

        }
    );

}


// ============================================================
// FORMAT TIME
// ============================================================

function formatTime(
    seconds
) {

    if (
        !Number.isFinite(
            seconds
        )
    )
        return "0:00";


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secondsPart =
        Math.floor(
            seconds % 60
        );


    return (

        minutes +
        ":" +
        String(
            secondsPart
        ).padStart(
            2,
            "0"
        )

    );

}


// ============================================================
// PLAYER
// ============================================================

playButton.onclick =
    async () => {

        try {

            await audio.play();

        } catch (
            error
        ) {

            console.error(
                error
            );

        }

    };


pauseButton.onclick =
    () => {

        audio.pause();

    };


stopButton.onclick =
    () => {

        audio.pause();

        audio.currentTime =
            0;

    };


replayButton.onclick =
    async () => {

        audio.currentTime =
            0;

        try {

            await audio.play();

        } catch (
            error
        ) {

            console.error(
                error
            );

        }

    };


// ============================================================
// VOLUME
// ============================================================

audio.volume =
    0.72;


volume.oninput =
    () => {

        audio.volume =
            Number(
                volume.value
            );

    };


// ============================================================
// SEEK
// ============================================================

timeline.addEventListener(
    "pointerdown",
    event => {

        if (
            !audio.duration
        )
            return;


        const rect =
            timeline
            .getBoundingClientRect();


        const ratio =
            THREE.MathUtils.clamp(

                (
                    event.clientX -
                    rect.left
                ) /
                rect.width,

                0,
                1

            );


        audio.currentTime =
            ratio *
            audio.duration;

    }
);


// ============================================================
// AUDIO STATE
// ============================================================

audio.addEventListener(
    "play",
    () => {

        status.textContent =
            "POND ALIVE";

    }
);


audio.addEventListener(
    "pause",
    () => {

        status.textContent =
            "PAUSED";

    }
);


audio.addEventListener(
    "ended",
    () => {

        status.textContent =
            "STILL WATER";

    }
);


// ============================================================
// SMOOTH PLAYER
// ============================================================

function updatePlayer() {

    const duration =
        audio.duration || 0;

    const current =
        audio.currentTime || 0;


    if (
        duration > 0
    ) {

        const progress =
            current /
            duration;


        timelineFill.style.width =
            (
                progress *
                100
            ) +
            "%";


        timelineDot.style.left =
            (
                progress *
                100
            ) +
            "%";

    }


    timeDisplay.textContent =
        formatTime(
            current
        );

}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// ANIMATION
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    /*
        NO GLB ROTATION.

        The world stays completely still.
    */


    /*
        Audio controls JSON time.
    */

    animateWater(
        audio.currentTime || 0
    );


    /*
        Smooth progress dot.
    */

    updatePlayer();


    renderer.render(
        scene,
        camera
    );

}


// ============================================================
// START
// ============================================================

async function start() {

    try {

        await loadJSON();

        await loadGLB();


        loading.classList.add(
            "hidden"
        );


        animate();

    } catch (
        error
    ) {

        console.error(
            error
        );


        loading.textContent =
            "Could not load Addy's Pond";


        loading.style.color =
            "#ffaaaa";

    }

}


start();

</script>
