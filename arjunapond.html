<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Addy's Pond</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07100d;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        position: relative;
    }

    /* =========================================================
       3D WORLD
    ========================================================= */

    #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* =========================================================
       TOP MUSIC PLAYER
    ========================================================= */

    #player {
        position: fixed;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);

        width: min(680px, calc(100vw - 30px));

        padding: 14px 18px 13px;

        background: rgba(5, 12, 10, 0.76);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        box-shadow:
            0 15px 45px rgba(0,0,0,0.35);

        z-index: 20;
    }

    #track-title {
        text-align: center;
        color: rgba(255,255,255,0.92);
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    #progress-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .time {
        width: 42px;
        color: rgba(255,255,255,0.58);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
    }

    #duration {
        text-align: right;
    }

    #progress-container {
        position: relative;
        flex: 1;
        height: 20px;

        display: flex;
        align-items: center;

        cursor: pointer;
    }

    #progress-track {
        position: absolute;
        left: 0;
        right: 0;
        height: 3px;

        border-radius: 10px;
        background: rgba(255,255,255,0.15);
    }

    #progress-fill {
        position: absolute;
        left: 0;
        height: 3px;

        width: 0%;

        border-radius: 10px;
        background: rgba(220,240,222,0.9);
    }

    #progress-dot {
        position: absolute;

        width: 10px;
        height: 10px;

        left: 0%;

        transform: translateX(-50%);

        border-radius: 50%;

        background: #ffffff;

        box-shadow:
            0 0 10px rgba(255,255,255,0.65);

        pointer-events: none;
    }

    /* =========================================================
       CONTROLS
    ========================================================= */

    #controls {
        margin-top: 8px;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 8px;
    }

    .control {
        width: 34px;
        height: 30px;

        border: 0;
        border-radius: 9px;

        background: rgba(255,255,255,0.07);
        color: rgba(255,255,255,0.82);

        cursor: pointer;

        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    .control:hover {
        background: rgba(255,255,255,0.15);
        transform: translateY(-1px);
    }

    #play {
        width: 42px;
        background: rgba(255,255,255,0.13);
    }

    /* =========================================================
       VOLUME
    ========================================================= */

    #volume-area {
        margin-left: 12px;

        display: flex;
        align-items: center;
        gap: 7px;
    }

    #volume-icon {
        color: rgba(255,255,255,0.65);
        font-size: 13px;
    }

    #volume {
        width: 80px;
        accent-color: white;
        cursor: pointer;
    }

    /* =========================================================
       STATUS
    ========================================================= */

    #status {
        position: fixed;

        bottom: 22px;
        left: 50%;

        transform: translateX(-50%);

        display: flex;
        align-items: center;
        gap: 7px;

        color: rgba(255,255,255,0.48);

        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;

        z-index: 10;

        pointer-events: none;
    }

    #status-dot {
        width: 6px;
        height: 6px;

        border-radius: 50%;

        background: rgba(255,255,255,0.25);

        transition:
            transform 0.15s ease,
            background 0.15s ease;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    #loading {
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #07100d;

        color: rgba(255,255,255,0.65);

        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;

        z-index: 100;
    }

    #loading.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

        #player {
            top: 12px;
            padding: 11px 12px;
            border-radius: 15px;
        }

        #track-title {
            font-size: 10px;
            margin-bottom: 7px;
        }

        #controls {
            gap: 5px;
        }

        .control {
            width: 31px;
            height: 28px;
        }

        #volume-area {
            margin-left: 5px;
        }

        #volume {
            width: 60px;
        }
    }
</style>

<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


// ============================================================
// CONFIGURATION
// ============================================================

const GLB_PATH =
    "./assets/addypond.glb";

const JSON_PATH =
    "./assets/arjuna_pond_data.json";

const FPS = 30;


// ============================================================
// DOM
// ============================================================

const sceneContainer =
    document.getElementById("scene");

const loading =
    document.getElementById("loading");

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const pauseButton =
    document.getElementById("pause");

const stopButton =
    document.getElementById("stop");

const replayButton =
    document.getElementById("replay");

const volumeSlider =
    document.getElementById("volume");

const progressContainer =
    document.getElementById("progress-container");

const progressFill =
    document.getElementById("progress-fill");

const progressDot =
    document.getElementById("progress-dot");

const currentTimeElement =
    document.getElementById("current-time");

const durationElement =
    document.getElementById("duration");

const statusDot =
    document.getElementById("status-dot");

const statusText =
    document.getElementById("status-text");


// ============================================================
// THREE.JS
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x07100d);


// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        42,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: false
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.05;

sceneContainer.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const ambient =
    new THREE.HemisphereLight(
        0xcde8dc,
        0x152019,
        2.0
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffe6bb,
        3.0
    );

sun.position.set(
    -8,
    14,
    7
);

scene.add(sun);


const fill =
    new THREE.DirectionalLight(
        0x9cc9c1,
        1.1
    );

fill.position.set(
    8,
    7,
    -8
);

scene.add(fill);


// ============================================================
// WORLD
// ============================================================

let pondModel = null;

let pondWater = null;

let waterPositionAttribute = null;

let waterOriginalPositions = null;

let waterBounds = null;


// ============================================================
// JSON DATA
// ============================================================

let jsonData = null;

let frames = [];

let rippleSources = [];


// ============================================================
// LOAD JSON
// ============================================================

async function loadJSON() {

    const response =
        await fetch(JSON_PATH);

    if (!response.ok) {
        throw new Error(
            "Could not load JSON: " +
            response.status
        );
    }

    jsonData =
        await response.json();

    frames =
        jsonData.frames || [];

    console.log(
        "JSON loaded:",
        frames.length,
        "frames"
    );

}


// ============================================================
// FIND WATER
// ============================================================

function findWater(model) {

    let candidates = [];

    model.traverse(object => {

        if (!object.isMesh)
            return;

        const name =
            object.name.toLowerCase();

        if (
            name.includes("water") ||
            name.includes("pond") ||
            name.includes("lake")
        ) {

            candidates.push(object);

        }

    });

    console.log(
        "Possible water meshes:",
        candidates.map(
            x => x.name
        )
    );

    if (candidates.length === 0) {

        console.warn(
            "No obvious water mesh found."
        );

        return null;
    }

    /*
        Prefer the object explicitly called water.
    */

    const exact =
        candidates.find(
            x =>
                x.name.toLowerCase()
                .includes("water")
        );

    return exact ||
           candidates[0];
}


// ============================================================
// PREPARE WATER
// ============================================================

function prepareWater(water) {

    if (!water)
        return;

    /*
        Convert indexed geometry so every visible
        vertex can be independently displaced.
    */

    if (water.geometry.index) {

        water.geometry =
            water.geometry.toNonIndexed();

    }

    const position =
        water.geometry.attributes.position;

    if (!position) {

        console.warn(
            "Water has no position attribute."
        );

        return;
    }

    waterPositionAttribute =
        position;

    waterOriginalPositions =
        new Float32Array(
            position.array
        );

    waterBounds =
        new THREE.Box3()
        .setFromBufferAttribute(
            position
        );

    console.log(
        "WATER FOUND:",
        water.name
    );

    console.log(
        "Water vertices:",
        position.count
    );

    /*
        Slightly translucent water.
    */

    if (water.material) {

        if (
            Array.isArray(
                water.material
            )
        ) {

            water.material =
                water.material.map(
                    material => {

                        material.transparent =
                            true;

                        material.opacity =
                            Math.min(
                                material.opacity ?? 1,
                                0.9
                            );

                        material.roughness =
                            0.18;

                        return material;

                    }
                );

        } else {

            water.material.transparent =
                true;

            water.material.opacity =
                Math.min(
                    water.material.opacity ?? 1,
                    0.9
                );

            water.material.roughness =
                0.18;
        }
    }

}


// ============================================================
// CREATE DETERMINISTIC RIPPLE SOURCES
// ============================================================

function createRippleSources() {

    rippleSources = [];

    if (!frames.length)
        return;

    let lastFrame =
        -1000;

    for (
        let i = 0;
        i < frames.length;
        i++
    ) {

        const frame =
            frames[i];

        const onset =
            Number(frame.onset || 0);

        if (
            onset > 0.18 &&
            i - lastFrame > 7
        ) {

            /*
                Deterministic pseudo-random
                coordinates.

                IMPORTANT:
                These are coordinates in the
                POND'S LOCAL coordinate system.

                Therefore when the GLB rotates,
                the ripples rotate with it.
            */

            const seed =
                Math.sin(
                    i * 12.9898
                ) * 43758.5453;

            const seed2 =
                Math.sin(
                    i * 78.233
                ) * 43758.5453;

            const randomX =
                seed -
                Math.floor(seed);

            const randomZ =
                seed2 -
                Math.floor(seed2);

            const x =
                THREE.MathUtils.lerp(
                    waterBounds?.min.x ?? -4,
                    waterBounds?.max.x ?? 4,
                    randomX
                );

            const z =
                THREE.MathUtils.lerp(
                    waterBounds?.min.z ?? -3,
                    waterBounds?.max.z ?? 3,
                    randomZ
                );

            rippleSources.push({

                frame: i,

                x,

                z,

                strength:
                    THREE.MathUtils.clamp(
                        onset * 3.0,
                        0.35,
                        1.0
                    )

            });

            lastFrame = i;

        }

    }

    console.log(
        "Ripple sources:",
        rippleSources.length
    );

}


// ============================================================
// FRAME INTERPOLATION
// ============================================================

function getInterpolatedFrame(time) {

    if (!frames.length)
        return null;

    const exactFrame =
        THREE.MathUtils.clamp(
            time * FPS,
            0,
            frames.length - 1
        );

    const index =
        Math.floor(exactFrame);

    const next =
        Math.min(
            index + 1,
            frames.length - 1
        );

    const t =
        exactFrame - index;

    return {

        a: frames[index],

        b: frames[next],

        t

    };

}


// ============================================================
// LERP
// ============================================================

function lerp(a, b, t) {

    return a +
        (b - a) * t;

}


// ============================================================
// WATER ANIMATION
// ============================================================

function deformWater(time) {

    if (
        !pondWater ||
        !waterPositionAttribute ||
        !waterOriginalPositions
    ) {
        return;
    }

    const data =
        getInterpolatedFrame(time);

    if (!data)
        return;

    const a =
        data.a;

    const b =
        data.b;

    const t =
        data.t;

    const energy =
        lerp(
            Number(a.energy || 0),
            Number(b.energy || 0),
            t
        );

    const bass =
        lerp(
            Number(a.bass || 0),
            Number(b.bass || 0),
            t
        );

    const mid =
        lerp(
            Number(a.mid || 0),
            Number(b.mid || 0),
            t
        );

    const high =
        lerp(
            Number(a.high || 0),
            Number(b.high || 0),
            t
        );

    const energyStrength =
        THREE.MathUtils.clamp(
            energy * 7,
            0,
            1
        );

    const bassStrength =
        THREE.MathUtils.clamp(
            bass * 8,
            0,
            1
        );

    const midStrength =
        THREE.MathUtils.clamp(
            mid * 10,
            0,
            1
        );

    const highStrength =
        THREE.MathUtils.clamp(
            high * 15,
            0,
            1
        );

    const currentFrame =
        time * FPS;

    const positions =
        waterPositionAttribute.array;


    // ========================================================
    // DEFORM EVERY WATER VERTEX
    // ========================================================

    for (
        let i = 0;
        i < positions.length;
        i += 3
    ) {

        const originalX =
            waterOriginalPositions[i];

        const originalY =
            waterOriginalPositions[i + 1];

        const originalZ =
            waterOriginalPositions[i + 2];


        const x =
            originalX;

        const z =
            originalZ;


        let displacement = 0;


        // ====================================================
        // JSON ONSET RIPPLE WAVES
        // ====================================================

        for (
            let r = 0;
            r < rippleSources.length;
            r++
        ) {

            const ripple =
                rippleSources[r];

            const age =
                currentFrame -
                ripple.frame;

            if (
                age < 0 ||
                age > FPS * 3
            ) {
                continue;
            }

            const radius =
                age * 0.055;

            const dx =
                x - ripple.x;

            const dz =
                z - ripple.z;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dz * dz
                );

            const ring =
                distance -
                radius;

            const width =
                0.18 +
                bassStrength * 0.15;

            const ringShape =
                Math.exp(
                    -(
                        ring * ring
                    ) /
                    (
                        width *
                        width
                    )
                );

            const decay =
                Math.exp(
                    -age /
                    (
                        FPS * 1.8
                    )
                );

            displacement +=
                ringShape *
                decay *
                ripple.strength *
                0.32;

        }


        // ====================================================
        // LOW FREQUENCY WATER MOTION
        // ====================================================

        displacement +=

            Math.sin(
                x * 1.1 +
                currentFrame * 0.055
            )

            *

            Math.cos(
                z * 0.85 +
                currentFrame * 0.043
            )

            *

            bassStrength *
            0.065;


        // ====================================================
        // MID FREQUENCY DETAIL
        // ====================================================

        displacement +=

            Math.sin(
                x * 2.4 -
                z * 1.7 +
                currentFrame * 0.10
            )

            *

            midStrength *
            0.028;


        // ====================================================
        // HIGH FREQUENCY DETAIL
        // ====================================================

        displacement +=

            Math.sin(
                x * 5.2 +
                z * 4.7 +
                currentFrame * 0.18
            )

            *

            highStrength *
            0.012;


        // ====================================================
        // ENERGY
        // ====================================================

        displacement *=
            0.55 +
            energyStrength * 0.8;


        // ====================================================
        // SAFETY LIMIT
        // ====================================================

        displacement =
            THREE.MathUtils.clamp(
                displacement,
                -0.28,
                0.38
            );


        /*
            IMPORTANT:

            The water itself remains in the GLB's
            local coordinate system.

            Therefore the GLB can rotate freely
            and the pattern remains attached to it.
        */

        positions[i + 1] =
            originalY +
            displacement;

    }

    waterPositionAttribute.needsUpdate =
        true;

}


// ============================================================
// LOAD GLB
// ============================================================

async function loadGLB() {

    return new Promise(
        (resolve, reject) => {

            const loader =
                new GLTFLoader();

            loader.load(

                GLB_PATH,

                gltf => {

                    pondModel =
                        gltf.scene;

                    /*
                        Add the entire GLB as ONE
                        rotating world.
                    */

                    scene.add(
                        pondModel
                    );


                    // ==========================================
                    // CENTER THE WHOLE GLB
                    // ==========================================

                    const box =
                        new THREE.Box3()
                        .setFromObject(
                            pondModel
                        );

                    const center =
                        box.getCenter(
                            new THREE.Vector3()
                        );

                    const size =
                        box.getSize(
                            new THREE.Vector3()
                        );


                    pondModel.position.x =
                        -center.x;

                    pondModel.position.z =
                        -center.z;

                    pondModel.position.y =
                        -box.min.y;


                    /*
                        Slightly smaller than before.
                    */

                    pondModel.scale.setScalar(
                        0.78
                    );


                    /*
                        Find water AFTER
                        centering/scaling.
                    */

                    pondWater =
                        findWater(
                            pondModel
                        );


                    prepareWater(
                        pondWater
                    );


                    /*
                        Ripple source positions
                        use the actual water bounds.
                    */

                    createRippleSources();


                    // ==========================================
                    // CAMERA
                    // ==========================================

                    const finalBox =
                        new THREE.Box3()
                        .setFromObject(
                            pondModel
                        );

                    const finalCenter =
                        finalBox.getCenter(
                            new THREE.Vector3()
                        );

                    const finalSize =
                        finalBox.getSize(
                            new THREE.Vector3()
                        );

                    const maxDimension =
                        Math.max(
                            finalSize.x,
                            finalSize.y,
                            finalSize.z
                        );


                    /*
                        High camera looking downward.
                    */

                    camera.position.set(
                        0,
                        maxDimension * 1.45,
                        maxDimension * 0.48
                    );


                    camera.lookAt(
                        finalCenter.x,
                        finalCenter.y,
                        finalCenter.z
                    );


                    console.log(
                        "GLB size:",
                        finalSize
                    );

                    console.log(
                        "Camera:",
                        camera.position
                    );


                    resolve();

                },

                undefined,

                error => {

                    reject(error);

                }

            );

        }
    );

}


// ============================================================
// FORMAT TIME
// ============================================================

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds)
    ) {
        return "0:00";
    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secondsPart =
        Math.floor(
            seconds % 60
        );

    return (
        minutes +
        ":" +
        String(secondsPart)
        .padStart(2, "0")
    );

}


// ============================================================
// PLAYER
// ============================================================

playButton.addEventListener(
    "click",
    async () => {

        try {

            await audio.play();

        } catch (error) {

            console.error(
                "Playback failed:",
                error
            );

        }

    }
);


pauseButton.addEventListener(
    "click",
    () => {

        audio.pause();

    }
);


stopButton.addEventListener(
    "click",
    () => {

        audio.pause();

        audio.currentTime = 0;

    }
);


replayButton.addEventListener(
    "click",
    async () => {

        audio.currentTime = 0;

        try {

            await audio.play();

        } catch (error) {

            console.error(error);

        }

    }
);


// ============================================================
// VOLUME
// ============================================================

audio.volume =
    Number(
        volumeSlider.value
    );

volumeSlider.addEventListener(
    "input",
    () => {

        audio.volume =
            Number(
                volumeSlider.value
            );

    }
);


// ============================================================
// SEEK
// ============================================================

progressContainer.addEventListener(
    "pointerdown",
    event => {

        if (!audio.duration)
            return;

        const rect =
            progressContainer
            .getBoundingClientRect();

        const ratio =
            THREE.MathUtils.clamp(
                (
                    event.clientX -
                    rect.left
                ) /
                rect.width,
                0,
                1
            );

        audio.currentTime =
            ratio *
            audio.duration;

    }
);


// ============================================================
// AUDIO EVENTS
// ============================================================

audio.addEventListener(
    "loadedmetadata",
    () => {

        durationElement.textContent =
            formatTime(
                audio.duration
            );

    }
);


audio.addEventListener(
    "play",
    () => {

        statusText.textContent =
            "POND ALIVE";

    }
);


audio.addEventListener(
    "pause",
    () => {

        statusText.textContent =
            "PAUSED";

    }
);


audio.addEventListener(
    "ended",
    () => {

        statusText.textContent =
            "STILL WATER";

    }
);


// ============================================================
// SMOOTH ANIMATION CLOCK
// ============================================================

function updatePlayer() {

    const duration =
        audio.duration || 0;

    const current =
        audio.currentTime || 0;

    const progress =
        duration > 0
            ? current / duration
            : 0;


    progressFill.style.width =
        (progress * 100) +
        "%";


    progressDot.style.left =
        (progress * 100) +
        "%";


    currentTimeElement.textContent =
        formatTime(
            current
        );


    /*
        Energy-reactive status indicator.
    */

    const frame =
        getInterpolatedFrame(
            current
        );

    if (frame) {

        const energy =
            lerp(
                Number(
                    frame.a.energy || 0
                ),
                Number(
                    frame.b.energy || 0
                ),
                frame.t
            );

        const intensity =
            THREE.MathUtils.clamp(
                energy * 18,
                0,
                1
            );

        statusDot.style.transform =
            `scale(${1 + intensity * 1.8})`;

        statusDot.style.background =
            `rgba(
                220,
                240,
                222,
                ${0.3 + intensity * 0.7}
            )`;

    }

}


// ============================================================
// WORLD ROTATION
// ============================================================

function updateWorldRotation(time) {

    if (!pondModel)
        return;

    /*
        One complete rotation roughly every
        75 seconds.

        The water is a child of pondModel,
        so its entire deformation field rotates
        together with the landscape.
    */

    const rotationSpeed =
        (
            Math.PI * 2
        ) /
        75;

    pondModel.rotation.y =
        time *
        rotationSpeed;

}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// MAIN ANIMATION LOOP
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    /*
        AUDIO IS THE MASTER CLOCK.
    */

    const audioTime =
        audio.currentTime || 0;


    /*
        JSON drives the water.
    */

    deformWater(
        audioTime
    );


    /*
        GLB rotation is based on the
        same elapsed world clock.
    */

    updateWorldRotation(
        performance.now() /
        1000
    );


    /*
        Smooth player movement.
    */

    updatePlayer();


    renderer.render(
        scene,
        camera
    );

}


// ============================================================
// START
// ============================================================

async function start() {

    try {

        await loadJSON();

        await loadGLB();

        loading.classList.add(
            "hidden"
        );

        animate();

    } catch (error) {

        console.error(
            error
        );

        loading.textContent =
            "Could not load Addy's Pond";

        loading.style.color =
            "#ffaaaa";

    }

}


start();

</script>
