<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DRAVYA — FICTION</title>

    <!-- TAB LOGO -->
    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <!-- DRAVYA STYLE -->
    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* =====================================
           ENABLE SCROLLING
        ===================================== */

        html,
        body {

            height: auto !important;

            min-height: 100% !important;

            overflow-y: auto !important;

            overflow-x: hidden !important;

        }


        /* =====================================
           BACKGROUND VIDEO
        ===================================== */

        .fluctuation-background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;

            pointer-events: none;

        }


        .background-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.18
                );

            z-index: -1;

            pointer-events: none;

        }


        /* =====================================
           FICTION PAGE
        ===================================== */

        .fiction-page {

            position: relative;

            z-index: 1;

            min-height: 100vh;

            padding:
                70px
                6vw
                120px;

        }


        /* =====================================
           HEADER
        ===================================== */

        .fiction-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                80px;

        }


        .fiction-title {

            margin: 0;

            color: #ffffff;

            font-size:
                clamp(
                    3.5rem,
                    8vw,
                    8rem
                );

            font-weight: 500;

            letter-spacing:
                0.08em;

        }


        .back-link {

            color: #ffffff;

            text-decoration: none;

            font-size:
                0.8rem;

            letter-spacing:
                0.15em;

        }


        /* =====================================
           SECTION TITLE
        ===================================== */

        .fiction-subtitle {

            margin-bottom:
                35px;

            color:
                #ffffff;

            font-size:
                0.85rem;

            letter-spacing:
                0.25em;

            font-weight:
                400;

        }


        /* =====================================
           STORY LIST
        ===================================== */

        .story-list {

            width: 100%;

            max-width:
                1100px;

        }


        .story-link {

            display: grid;

            grid-template-columns:
                70px
                1fr
                auto;

            align-items:
                center;

            gap:
                25px;

            padding:
                25px
                0;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            color:
                #ffffff;

            text-decoration:
                none;

            transition:
                opacity 0.25s ease;

        }


        .story-link:last-child {

            border-bottom:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

        }


        .story-link:hover {

            opacity:
                0.65;

        }


        /* NUMBER */

        .story-number {

            font-size:
                0.75rem;

            letter-spacing:
                0.15em;

            opacity:
                0.55;

        }


        /* TITLE */

        .story-name {

            font-size:
                clamp(
                    1.3rem,
                    2.4vw,
                    2.2rem
                );

            letter-spacing:
                0.03em;

        }


        /* READ */

        .story-read {

            font-size:
                1.2rem;

            letter-spacing:
                0.18em;

            opacity:
                0.65;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (
            max-width: 700px
        ) {

            .fiction-page {

                padding:
                    45px
                    20px
                    80px;

            }


            .fiction-header {

                margin-bottom:
                    55px;

            }


            .story-link {

                grid-template-columns:
                    40px
                    1fr;

                gap:
                    15px;

                padding:
                    22px
                    0;

            }


            .story-read {

                display:
                    none;

            }

        }

    </style>

</head>


<body>

            <!-- 04 -->

                <span

                >

                </span>

            </a>


            <!-- 05 -->

            <a

                    05
                </span>

                <span

                >

            <!-- 06 -->

                    class="story-read"
                >

                </span>

            <!-- 07 -->

            <a

        </section>


    </main>


</body>
