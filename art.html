<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DRAVYA — ART</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================
           PAGE
        ===================================== */

        body {
            margin: 0;
            background: #000;
        }


        /* =====================================
           DRAVYA FLUCTUATION BACKGROUND
        ===================================== */

        .fluctuation-background {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;

            pointer-events: none;
        }


        .background-overlay {
            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.15);

            z-index: -1;

            pointer-events: none;
        }


        /* =====================================
           ART PAGE
        ===================================== */

        .art-page {
            position: relative;
            z-index: 1;

            min-height: 100vh;

            padding:
                70px 6vw
                100px;
        }


        /* =====================================
           HEADER
        ===================================== */

        .art-header {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 65px;
        }


        .art-title {
            margin: 0;

            color: #ffffff;

            font-size:
                clamp(3.5rem, 8vw, 8rem);

            font-weight: 500;

            letter-spacing:
                0.08em;
        }


        .back-link {
            color: #ffffff;

            text-decoration: none;

            font-size: 0.8rem;

            letter-spacing:
                0.15em;
        }


        /* =====================================
           GALLERY
        ===================================== */

        .art-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 32px;

            width: 100%;
        }


        /* =====================================
           INDIVIDUAL ARTWORK
        ===================================== */

        .art-item {

            position: relative;

            width: 100%;

            cursor: pointer;

            overflow: hidden;

            background: transparent;
        }


        .art-item img {

            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            object-fit: contain;

            opacity: 1;

            visibility: visible;

            transition:
                transform 0.45s ease,
                opacity 0.3s ease;
        }


        .art-item:hover img {

            transform:
                scale(1.02);
        }


        /* =====================================
           FULLSCREEN
        ===================================== */

        .lightbox {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            padding: 20px;

            box-sizing: border-box;

            background:
                rgba(0, 0, 0, 0.97);

            z-index: 99999;

            cursor: zoom-out;
        }


        .lightbox.active {
            display: flex;
        }


        .lightbox img {

            display: block;

            /*
             * Preserve original aspect ratio.
             * Never crop or stretch.
             */

            width: auto;

            height: auto;

            max-width: 96vw;

            max-height: 94vh;

            object-fit: contain;

            cursor: default;
        }


        .close-lightbox {

            position: absolute;

            top: 20px;

            right: 30px;

            color: #ffffff;

            font-size: 40px;

            font-weight: 300;

            line-height: 1;

            cursor: pointer;

            z-index: 100000;
        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (max-width: 700px) {

            .art-page {
                padding:
                    45px 20px
                    70px;
            }

            .art-grid {

                grid-template-columns:
                    1fr;

                gap: 22px;
            }

            .art-header {
                margin-bottom: 40px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         BACKGROUND VIDEO
    ===================================== -->

    <video
        class="fluctuation-background"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="assets/dravya_vacuum_fluctuation_10s.mp4"
            type="video/mp4"
        >

    </video>


    <div class="background-overlay"></div>


    <!-- =====================================
         ART
    ===================================== -->

    <main class="art-page">


        <header class="art-header">

            <h1 class="art-title">
                ART
            </h1>


            <a
                href="index.html"
                class="back-link"
            >
                ← DRAVYA
            </a>

        </header>


        <!-- =================================
             ACTUAL IMAGE GALLERY
        ================================== -->

        <section
            class="art-grid"
            id="artGrid"
        ></section>


    </main>


    <!-- =====================================
         FULLSCREEN VIEWER
    ===================================== -->

    <div
        class="lightbox"
        id="lightbox"
    >

        <button
            class="close-lightbox"
            id="closeLightbox"
            aria-label="Close"
        >
            ×
        </button>


        <img
            id="lightboxImage"
            src=""
            alt=""
        >

    </div>


    <script>

        const artGrid =
            document.getElementById(
                "artGrid"
            );

        const lightbox =
            document.getElementById(
                "lightbox"
            );

        const lightboxImage =
            document.getElementById(
                "lightboxImage"
            );

        const closeLightbox =
            document.getElementById(
                "closeLightbox"
            );


        /* =====================================
           a.jpg → u.jpg
        ===================================== */

        for (
            let i = 97;
            i <= 117;
            i++
        ) {

            const letter =
                String.fromCharCode(i);


            const image =
                document.createElement(
                    "img"
                );


            /*
             * ACTUAL IMAGE FILE
             */

            image.src =
                `art/${letter}.jpg`;


            image.alt =
                "";


            image.loading =
                "lazy";


            image.decoding =
                "async";


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "art-item";


            item.appendChild(
                image
            );


            artGrid.appendChild(
                item
            );


            /* =================================
               CLICK IMAGE
            ================================= */

            item.addEventListener(
                "click",
                () => {

                    lightboxImage.src =
                        image.src;

                    lightboxImage.alt =
                        "";

                    lightbox.classList.add(
                        "active"
                    );

                    document.body.style.overflow =
                        "hidden";

                }
            );

        }


        /* =====================================
           CLOSE
        ===================================== */

        function closeViewer() {

            lightbox.classList.remove(
                "active"
            );

            lightboxImage.src = "";

            document.body.style.overflow =
                "";

        }


        closeLightbox.addEventListener(
            "click",
            closeViewer
        );


        lightbox.addEventListener(
            "click",
            (event) => {

                if (
                    event.target === lightbox
                ) {

                    closeViewer();

                }

            }
        );


        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Escape"
                ) {

                    closeViewer();

                }

            }
        );

    </script>


</body>

</html>
