<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DRAVYA — ART</title>

    <!-- TAB LOGO -->
    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <!-- DRAVYA STYLE -->
    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* =====================================
           ENABLE PAGE SCROLLING
        ===================================== */

        html,
        body {

            height: auto !important;

            min-height: 100% !important;

            overflow-y: auto !important;

            overflow-x: hidden !important;

        }


        /* =====================================
           VACUUM FLUCTUATION BACKGROUND
        ===================================== */

        .fluctuation-background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;

            pointer-events: none;

        }


        .background-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.15);

            z-index: -1;

            pointer-events: none;

        }


        /* =====================================
           ART PAGE
        ===================================== */

        .art-page {

            position: relative;

            z-index: 1;

            min-height: 100vh;

            height: auto !important;

            overflow: visible !important;

            padding:
                70px
                6vw
                120px;

        }


        /* =====================================
           HEADER
        ===================================== */

        .art-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 70px;

        }


        .art-title {

            margin: 0;

            color: #ffffff;

            font-size:
                clamp(
                    3.5rem,
                    8vw,
                    8rem
                );

            font-weight: 500;

            letter-spacing:
                0.08em;

        }


        .back-link {

            color: #ffffff;

            text-decoration: none;

            font-size: 0.8rem;

            letter-spacing:
                0.15em;

        }


        /* =====================================
           GALLERY
           
           TWO ARTWORKS PER ROW
        ===================================== */

        .art-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap:
                55px 35px;

            width: 100%;

        }


        /* =====================================
           ARTWORK FRAME

           Gives every image a consistent
           visual presentation WITHOUT
           cropping the actual artwork.
        ===================================== */

        .art-item {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            overflow: hidden;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.10
                );

            padding: 18px;

            box-sizing:
                border-box;

            min-height: 320px;

            transition:
                background 0.3s ease;

        }


        .art-item:hover {

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.20
                );

        }


        /* =====================================
           ACTUAL ARTWORK

           NEVER CROP
           NEVER STRETCH
        ===================================== */

        .art-item img {

            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            max-height: 650px;

            object-fit: contain;

            transition:
                transform 0.45s ease;

        }


        .art-item:hover img {

            transform:
                scale(1.015);

        }


        /* =====================================
           FULLSCREEN LIGHTBOX
        ===================================== */

        .lightbox {

            position: fixed;

            inset: 0;

            display: none;

            align-items:
                center;

            justify-content:
                center;

            box-sizing:
                border-box;

            padding:
                60px 100px;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.97
                );

            z-index: 99999;

        }


        .lightbox.active {

            display: flex;

        }


        /* =====================================
           FULLSCREEN IMAGE

           ORIGINAL ASPECT RATIO
        ===================================== */

        .lightbox img {

            display: block;

            width: auto;

            height: auto;

            max-width: 90vw;

            max-height: 90vh;

            object-fit: contain;

            user-select: none;

        }


        /* =====================================
           CLOSE BUTTON
        ===================================== */

        .close-lightbox {

            position: absolute;

            top: 20px;

            right: 30px;

            width: 45px;

            height: 45px;

            border: none;

            background: transparent;

            color: #ffffff;

            font-size: 40px;

            font-weight: 300;

            line-height: 1;

            cursor: pointer;

            z-index: 100002;

        }


        /* =====================================
           LEFT / RIGHT BUTTONS
        ===================================== */

        .gallery-button {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            width: 60px;

            height: 60px;

            border: none;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            color: #ffffff;

            font-size: 32px;

            font-weight: 300;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 100001;

            transition:
                background 0.25s ease,
                transform 0.25s ease;

        }


        .gallery-button:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

        }


        .gallery-button.prev {

            left: 25px;

        }


        .gallery-button.next {

            right: 25px;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (
            max-width: 700px
        ) {

            .art-page {

                padding:
                    45px
                    20px
                    80px;

            }


            .art-header {

                margin-bottom:
                    45px;

            }


            .art-grid {

                grid-template-columns:
                    1fr;

                gap: 25px;

            }


            .art-item {

                min-height:
                    220px;

                padding:
                    12px;

            }


            .lightbox {

                padding:
                    50px 45px;

            }


            .lightbox img {

                max-width:
                    88vw;

                max-height:
                    85vh;

            }


            .gallery-button {

                width: 42px;

                height: 42px;

                font-size: 24px;

                background:
                    rgba(
                        255,
                        255,
                        255,
                        0.08
                    );

            }


            .gallery-button.prev {

                left: 5px;

            }


            .gallery-button.next {

                right: 5px;

            }


            .close-lightbox {

                top: 15px;

                right: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         DRAVYA VACUUM FLUCTUATION BACKGROUND
    ===================================== -->

    <video
        class="fluctuation-background"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="assets/dravya_vacuum_fluctuation_10s.mp4"
            type="video/mp4"
        >

    </video>


    <div
        class="background-overlay"
    ></div>


    <!-- =====================================
         ART PAGE
    ===================================== -->

    <main
        class="art-page"
    >


        <header
            class="art-header"
        >

            <h1
                class="art-title"
            >
                ART
            </h1>


            <a
                href="index.html"
                class="back-link"
            >
                ← DRAVYA
            </a>

        </header>


        <!-- =================================
             ART GALLERY
        ================================== -->

        <section
            class="art-grid"
            id="artGrid"
        ></section>


    </main>


    <!-- =====================================
         FULLSCREEN VIEWER
    ===================================== -->

    <div
        class="lightbox"
        id="lightbox"
    >


        <!-- CLOSE -->

        <button
            class="close-lightbox"
            id="closeLightbox"
            aria-label="Close"
        >
            ×
        </button>


        <!-- PREVIOUS -->

        <button
            class="gallery-button prev"
            id="prevButton"
            aria-label="Previous artwork"
        >
            ‹
        </button>


        <!-- IMAGE -->

        <img
            id="lightboxImage"
            src=""
            alt=""
        >


        <!-- NEXT -->

        <button
            class="gallery-button next"
            id="nextButton"
            aria-label="Next artwork"
        >
            ›
        </button>


    </div>


    <script>

        /* =====================================
           ELEMENTS
        ===================================== */

        const artGrid =
            document.getElementById(
                "artGrid"
            );


        const lightbox =
            document.getElementById(
                "lightbox"
            );


        const lightboxImage =
            document.getElementById(
                "lightboxImage"
            );


        const closeLightbox =
            document.getElementById(
                "closeLightbox"
            );


        const prevButton =
            document.getElementById(
                "prevButton"
            );


        const nextButton =
            document.getElementById(
                "nextButton"
            );


        /* =====================================
           ARTWORK LIST
           
           a.jpg → u.jpg
        ===================================== */

        const artworks = [];


        for (
            let i = 97;
            i <= 117;
            i++
        ) {

            const letter =
                String.fromCharCode(i);


            artworks.push(
                `art/${letter}.jpg`
            );

        }


        /* =====================================
           CREATE GALLERY
        ===================================== */

        artworks.forEach(
            (src, index) => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "art-item";


                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    src;


                image.alt =
                    "";


                image.loading =
                    "lazy";


                image.decoding =
                    "async";


                item.appendChild(
                    image
                );


                artGrid.appendChild(
                    item
                );


                /* CLICK → OPEN */

                item.addEventListener(
                    "click",
                    () => {

                        openViewer(index);

                    }
                );

            }
        );


        /* =====================================
           CURRENT IMAGE
        ===================================== */

        let currentIndex = 0;


        /* =====================================
           OPEN VIEWER
        ===================================== */

        function openViewer(index) {

            currentIndex = index;


            lightboxImage.src =
                artworks[currentIndex];


            lightbox.classList.add(
                "active"
            );


            document.body.style.overflow =
                "hidden";

        }


        /* =====================================
           SHOW IMAGE
        ===================================== */

        function showImage(index) {

            /*
             * Loop around:
             *
             * first ← last
             * last → first
             */

            if (
                index < 0
            ) {

                index =
                    artworks.length - 1;

            }


            if (
                index >= artworks.length
            ) {

                index = 0;

            }


            currentIndex =
                index;


            lightboxImage.src =
                artworks[currentIndex];

        }


        /* =====================================
           PREVIOUS
        ===================================== */

        function previousArtwork() {

            showImage(
                currentIndex - 1
            );

        }


        /* =====================================
           NEXT
        ===================================== */

        function nextArtwork() {

            showImage(
                currentIndex + 1
            );

        }


        /* =====================================
           BUTTONS
        ===================================== */

        prevButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                previousArtwork();

            }
        );


        nextButton.addEventListener(
            "click",
            (event) => {

                event.stopPropagation();

                nextArtwork();

            }
        );


        /* =====================================
           CLOSE
        ===================================== */

        function closeViewer() {

            lightbox.classList.remove(
                "active"
            );


            lightboxImage.src =
                "";


            document.body.style.overflow =
                "";

        }


        closeLightbox.addEventListener(
            "click",
            closeViewer
        );


        /* =====================================
           CLICK OUTSIDE IMAGE
        ===================================== */

        lightbox.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    lightbox
                ) {

                    closeViewer();

                }

            }
        );


        /* =====================================
           KEYBOARD CONTROLS
        ===================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {

                    return;

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    previousArtwork();

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    nextArtwork();

                }


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeViewer();

                }

            }
        );


    </script>


</body>

</html>
