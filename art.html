<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- TAB TITLE -->
    <title>DRAVYA — ART</title>

    <!-- TAB LOGO / FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="assets/logo.png"
    >

    <!-- EXISTING DRAVYA STYLE -->
    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* =====================================
           ENABLE SCROLLING
        ===================================== */

        html,
        body {

            height: auto !important;

            min-height: 100% !important;

            overflow-y: auto !important;

            overflow-x: hidden !important;

        }


        /* =====================================
           VIDEO BACKGROUND
        ===================================== */

        .fluctuation-background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;

            pointer-events: none;

        }


        /* BACKGROUND OVERLAY */

        .background-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.15);

            z-index: -1;

            pointer-events: none;

        }


        /* =====================================
           ART PAGE
        ===================================== */

        .art-page {

            position: relative;

            z-index: 1;

            min-height: 100vh;

            height: auto !important;

            overflow: visible !important;

            padding:
                70px
                6vw
                100px;

        }


        /* =====================================
           HEADER
        ===================================== */

        .art-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom: 65px;

        }


        /* ART TITLE */

        .art-title {

            margin: 0;

            color: #ffffff;

            font-size:
                clamp(
                    3.5rem,
                    8vw,
                    8rem
                );

            font-weight: 500;

            letter-spacing:
                0.08em;

        }


        /* BACK TO DRAVYA */

        .back-link {

            color: #ffffff;

            text-decoration: none;

            font-size: 0.8rem;

            letter-spacing:
                0.15em;

        }


        /* =====================================
           ART GALLERY
           2 IMAGES PER ROW
        ===================================== */

        .art-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(0, 1fr)
                );

            gap: 35px;

            width: 100%;

        }


        /* =====================================
           INDIVIDUAL ARTWORK
        ===================================== */

        .art-item {

            position: relative;

            width: 100%;

            cursor: pointer;

            overflow: hidden;

            background:
                transparent;

        }


        .art-item img {

            display: block;

            width: 100%;

            height: auto;

            max-width: 100%;

            object-fit: contain;

            opacity: 1;

            visibility: visible;

            transition:
                transform 0.45s ease;

        }


        .art-item:hover img {

            transform:
                scale(1.02);

        }


        /* =====================================
           FULLSCREEN VIEWER
        ===================================== */

        .lightbox {

            position: fixed;

            inset: 0;

            display: none;

            align-items:
                center;

            justify-content:
                center;

            padding: 20px;

            box-sizing:
                border-box;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.97
                );

            z-index: 99999;

            cursor: zoom-out;

        }


        .lightbox.active {

            display: flex;

        }


        .lightbox img {

            display: block;

            width: auto;

            height: auto;

            max-width: 96vw;

            max-height: 94vh;

            object-fit: contain;

            cursor: default;

        }


        /* CLOSE BUTTON */

        .close-lightbox {

            position: absolute;

            top: 20px;

            right: 30px;

            color: #ffffff;

            background:
                transparent;

            border: none;

            font-size: 40px;

            font-weight: 300;

            line-height: 1;

            cursor: pointer;

            z-index: 100000;

        }


        /* =====================================
           MOBILE
        ===================================== */

        @media (
            max-width: 700px
        ) {

            .art-page {

                padding:
                    45px
                    20px
                    70px;

            }


            .art-grid {

                grid-template-columns:
                    1fr;

                gap: 22px;

            }


            .art-header {

                margin-bottom: 40px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         DRAVYA VACUUM FLUCTUATION
         BACKGROUND
    ===================================== -->

    <video
        class="fluctuation-background"
        autoplay
        muted
        loop
        playsinline
    >

        <source
            src="assets/dravya_vacuum_fluctuation_10s.mp4"
            type="video/mp4"
        >

    </video>


    <div
        class="background-overlay"
    ></div>


    <!-- =====================================
         ART PAGE
    ===================================== -->

    <main class="art-page">


        <!-- HEADER -->

        <header
            class="art-header"
        >

            <h1
                class="art-title"
            >
                ART
            </h1>


            <a
                href="index.html"
                class="back-link"
            >
                ← DRAVYA
            </a>

        </header>


        <!-- =================================
             GALLERY
             
             a.jpg
             b.jpg
             c.jpg
             ...
             u.jpg
        ================================== -->

        <section
            class="art-grid"
            id="artGrid"
        ></section>


    </main>


    <!-- =====================================
         FULLSCREEN VIEWER
    ===================================== -->

    <div
        class="lightbox"
        id="lightbox"
    >


        <button
            class="close-lightbox"
            id="closeLightbox"
            aria-label="Close"
        >

            ×

        </button>


        <img
            id="lightboxImage"
            src=""
            alt=""
        >

    </div>


    <script>

        /* =====================================
           ELEMENTS
        ===================================== */

        const artGrid =
            document.getElementById(
                "artGrid"
            );


        const lightbox =
            document.getElementById(
                "lightbox"
            );


        const lightboxImage =
            document.getElementById(
                "lightboxImage"
            );


        const closeLightbox =
            document.getElementById(
                "closeLightbox"
            );


        /* =====================================
           CREATE ARTWORKS
           
           a.jpg → u.jpg
        ===================================== */

        for (
            let i = 97;
            i <= 117;
            i++
        ) {


            const letter =
                String.fromCharCode(i);


            /* IMAGE */

            const image =
                document.createElement(
                    "img"
                );


            image.src =
                `art/${letter}.jpg`;


            image.alt =
                "";


            image.loading =
                "lazy";


            image.decoding =
                "async";


            /* CONTAINER */

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "art-item";


            item.appendChild(
                image
            );


            artGrid.appendChild(
                item
            );


            /* =================================
               OPEN FULLSCREEN
            ================================= */

            item.addEventListener(
                "click",
                () => {

                    lightboxImage.src =
                        image.src;

                    lightbox.classList.add(
                        "active"
                    );


                    document.body.style.overflow =
                        "hidden";

                }
            );

        }


        /* =====================================
           CLOSE FUNCTION
        ===================================== */

        function closeViewer() {

            lightbox.classList.remove(
                "active"
            );


            lightboxImage.src =
                "";


            document.body.style.overflow =
                "";

        }


        /* X BUTTON */

        closeLightbox.addEventListener(
            "click",
            closeViewer
        );


        /* CLICK OUTSIDE */

        lightbox.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    lightbox
                ) {

                    closeViewer();

                }

            }
        );


        /* ESC */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeViewer();

                }

            }
        );

    </script>


</body>

</html>
