<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addy — Trajectory</title>

    <link rel="stylesheet" href="cv.css">

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
</head>

<body>

    <main id="cv">

        <!-- =========================================
             BACKGROUND
        ========================================== -->

        <div class="space">
            <div class="grain"></div>
            <div class="stars"></div>
        </div>


        <!-- =========================================
             INTRO
        ========================================== -->

        <section class="intro panel">

            <div class="intro-content">

                <div class="micro">A LIFE IN TRAJECTORY</div>

                <h1>ADDY</h1>

                <div class="intro-line"></div>

                <p>
                    1999 — 2026
                </p>

                <span class="scroll-hint">
                    SCROLL TO TRACE
                </span>

            </div>

        </section>


        <!-- =========================================
             MAIN EXPERIENCE
        ========================================== -->

        <section class="journey">

            <div class="trajectory-stage">

                <svg
                    id="trajectorySvg"
                    viewBox="0 0 1400 900"
                    preserveAspectRatio="xMidYMid meet"
                    aria-hidden="true"
                >

                    <!-- faint complete trajectory -->
                    <path
                        id="ghostPath"
                        class="ghost-path"
                    ></path>

                    <!-- actual life trajectory -->
                    <path
                        id="lifePath"
                        class="life-path"
                    ></path>

                    <!-- moving observer -->
                    <circle
                        id="observer"
                        r="7"
                    ></circle>

                </svg>


                <!-- =====================================
                     EVENT INFORMATION
                ====================================== -->

                <div id="eventInfo" class="event-info">

                    <div class="event-year"></div>
                    <div class="event-title"></div>
                    <div class="event-description"></div>

                </div>


                <!-- =====================================
                     SMALL HUD
                ====================================== -->

                <div class="hud hud-left">
                    <span id="progressText">1999</span>
                </div>

                <div class="hud hud-right">
                    <span>OBSERVE · DISTURB · CREATE</span>
                </div>

            </div>

        </section>


        <!-- =========================================
             FINAL REVEAL
        ========================================== -->

        <section class="reveal">

            <div class="reveal-content">

                <div class="micro">
                    THE WHOLE TRAJECTORY
                </div>

                <h2>1999 → 2026</h2>

                <p>
                    One line.<br>
                    Many states.
                </p>

                <div class="final-mark">
                    OBSERVE · DISTURB · CREATE
                </div>

            </div>

        </section>


        <!-- =========================================
             FOOTER
        ========================================== -->

        <footer>

            <span>ADDY</span>

            <span>PHYSICS · RESEARCH · ART</span>

            <span>DRAVYA</span>

        </footer>

    </main>


    <script src="cv.js"></script>

</body>
</html>
