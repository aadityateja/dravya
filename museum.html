<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>DRAVYA — Museum</title>

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #07132e 0%,
            #020611 55%,
            #000000 100%
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#loading {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background:
        radial-gradient(
            circle,
            #081a3a 0%,
            #02050d 70%
        );

    color: white;

    z-index: 100;

    letter-spacing: 0.25em;

    transition:
        opacity 0.8s ease;
}

#loadingTitle {

    font-size: 26px;

    color: #79dcff;

    margin-bottom: 14px;
}

#loadingText {

    font-size: 11px;

    opacity: 0.55;
}

#hud {

    position: fixed;

    left: 24px;
    bottom: 24px;

    z-index: 10;

    color: white;

    pointer-events: none;

    user-select: none;
}

#hudTitle {

    font-size: 13px;

    letter-spacing: 0.3em;

    color: #65dcff;

    margin-bottom: 8px;
}

#hudControls {

    font-size: 11px;

    line-height: 1.8;

    opacity: 0.48;

    letter-spacing: 0.08em;
}

#interaction {

    position: fixed;

    left: 50%;
    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 20;

    color: white;

    font-size: 11px;

    letter-spacing: 0.15em;

    opacity: 0.4;

    pointer-events: none;
}

#error {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 40px;

    box-sizing: border-box;

    background: #02040a;

    color: #ff6d8c;

    font-family: monospace;

    white-space: pre-wrap;

    z-index: 200;
}

</style>
</head>

<body>

<div id="loading">

    <div id="loadingTitle">
        DRAVYA
    </div>

    <div id="loadingText">
        ENTERING THE FIELD...
    </div>

</div>


<div id="hud">

    <div id="hudTitle">
        DRAVYA FIELD
    </div>

    <div id="hudControls">

        W A S D / ARROWS — MOVE<br>
        MOUSE — LOOK<br>
        SHIFT — ACCELERATE<br>
        SPACE — ASCEND<br>
        CTRL — DESCEND<br>
        ESC — RELEASE MOUSE

    </div>

</div>


<div id="interaction">
    CLICK TO EXPLORE
</div>


<div id="error"></div>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE
    from "three";

import {
    GLTFLoader
} from
    "three/addons/loaders/GLTFLoader.js";


// ============================================================
// BASIC SETUP
// ============================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x020611
    );

scene.fog =
    new THREE.FogExp2(
        0x020611,
        0.0035
    );


// ============================================================
// CAMERA
// ============================================================

const camera =
    new THREE.PerspectiveCamera(
        62,
        window.innerWidth /
        window.innerHeight,
        0.05,
        500
    );


// ============================================================
// RENDERER
// ============================================================

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.8
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.15;

renderer.shadowMap.enabled = false;

document.body.appendChild(
    renderer.domElement
);


// ============================================================
// LIGHTING
// ============================================================

const hemi =
    new THREE.HemisphereLight(
        0x7dbfff,
        0x02030a,
        1.5
    );

scene.add(hemi);


const mainLight =
    new THREE.DirectionalLight(
        0xa9d9ff,
        1.5
    );

mainLight.position.set(
    20,
    35,
    20
);

scene.add(mainLight);


const cyanLight =
    new THREE.PointLight(
        0x00aaff,
        55,
        65
    );

cyanLight.position.set(
    0,
    7,
    0
);

scene.add(cyanLight);


const purpleLight =
    new THREE.PointLight(
        0x7d22ff,
        35,
        45
    );

purpleLight.position.set(
    -18,
    8,
    -15
);

scene.add(purpleLight);


const entranceLight =
    new THREE.PointLight(
        0x008cff,
        30,
        35
    );

entranceLight.position.set(
    0,
    8,
    30
);

scene.add(entranceLight);


// ============================================================
// LOADER
// ============================================================

const loader =
    new GLTFLoader();


// ============================================================
// PLAYER
// ============================================================

let player = null;

const playerRoot =
    new THREE.Group();

scene.add(
    playerRoot
);


// ============================================================
// PLAYER PHYSICS
// ============================================================

const playerState = {

    velocity:
        new THREE.Vector3(),

    position:
        new THREE.Vector3(
            0,
            2.8,
            24
        ),

    yaw: Math.PI,

    pitch: -0.10,

    speed: 0,

    maxSpeed: 8.5,

    boostSpeed: 18.0,

    acceleration: 17.0,

    braking: 11.0,

    verticalSpeed: 0,

    verticalMax: 7.0

};


// ============================================================
// SMALL SHIP SCALE
// ============================================================

const PLAYER_SCALE =
    0.55;


// ============================================================
// CAMERA SETTINGS
// ============================================================

const cameraState = {

    distance: 12.0,

    height: 5.5,

    lookHeight: 1.8,

    sensitivity: 0.0025,

    smoothness: 7.0,

    minDistance: 7,

    maxDistance: 22

};


// ============================================================
// INPUT
// ============================================================

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        keys[
            event.code
        ] = true;

        // Prevent browser scrolling
        if (
            event.code === "Space" ||
            event.code === "ArrowUp" ||
            event.code === "ArrowDown" ||
            event.code === "ArrowLeft" ||
            event.code === "ArrowRight"
        ) {

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.code
        ] = false;

    }
);


// ============================================================
// MOUSE LOOK
// ============================================================

let mouseLocked = false;

let mouseX = 0;
let mouseY = 0;


renderer.domElement.addEventListener(
    "click",
    () => {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            renderer.domElement.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement ===
            renderer.domElement;

        document.getElementById(
            "interaction"
        ).style.opacity =
            mouseLocked ? "0" : "0.4";

    }
);


document.addEventListener(
    "mousemove",
    event => {

        if (!mouseLocked)
            return;

        mouseX -=
            event.movementX *
            cameraState.sensitivity;

        mouseY -=
            event.movementY *
            cameraState.sensitivity;

        mouseY =
            THREE.MathUtils.clamp(
                mouseY,
                -1.15,
                0.75
            );

    }
);


// ============================================================
// MOUSE WHEEL = CAMERA DISTANCE
// ============================================================

renderer.domElement.addEventListener(
    "wheel",
    event => {

        cameraState.distance +=
            event.deltaY *
            0.015;

        cameraState.distance =
            THREE.MathUtils.clamp(
                cameraState.distance,
                cameraState.minDistance,
                cameraState.maxDistance
            );

    },
    {
        passive: true
    }
);


// ============================================================
// LOAD MUSEUM
// ============================================================

loader.load(

    "./models/museum.glb",

    gltf => {

        const museum =
            gltf.scene;

        museum.name =
            "DRAVYA_MUSEUM";

        scene.add(
            museum
        );


        // ----------------------------------------------------
        // Identify collision geometry
        // ----------------------------------------------------

        museum.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    object.frustumCulled =
                        true;

                }

            }
        );


        loadPlayer();

    },

    xhr => {

        if (xhr.total) {

            const percent =
                (
                    xhr.loaded /
                    xhr.total
                ) * 100;

            document.getElementById(
                "loadingText"
            ).textContent =
                `LOADING MUSEUM ${percent.toFixed(0)}%`;

        }

    },

    error => {

        showError(
            "MUSEUM FAILED TO LOAD\n\n" +
            error
        );

    }

);


// ============================================================
// LOAD PLAYER SHIP
// ============================================================

function loadPlayer() {

    loader.load(

        "./models/player_ship.glb",

        gltf => {

            player =
                gltf.scene;

            player.name =
                "PLAYER_SHIP";

            player.scale.setScalar(
                PLAYER_SCALE
            );

            playerRoot.add(
                player
            );

            playerRoot.position.copy(
                playerState.position
            );

            playerRoot.rotation.y =
                playerState.yaw;


            // ------------------------------------------------
            // Ensure ship remains visually bright
            // ------------------------------------------------

            player.traverse(
                object => {

                    if (
                        object.isMesh
                    ) {

                        object.frustumCulled =
                            true;

                    }

                }
            );


            // ------------------------------------------------
            // Finish loading
            // ------------------------------------------------

            setTimeout(
                () => {

                    const loading =
                        document.getElementById(
                            "loading"
                        );

                    loading.style.opacity =
                        "0";

                    setTimeout(
                        () => {

                            loading.style.display =
                                "none";

                        },
                        800
                    );

                },
                400
            );

        },

        undefined,

        error => {

            showError(
                "PLAYER SHIP FAILED TO LOAD\n\n" +
                error
            );

        }

    );

}


// ============================================================
// ERROR SCREEN
// ============================================================

function showError(message) {

    const box =
        document.getElementById(
            "error"
        );

    box.style.display =
        "flex";

    box.textContent =
        message;

}


// ============================================================
// MOVEMENT
// ============================================================

const forward =
    new THREE.Vector3();

const right =
    new THREE.Vector3();

const moveDirection =
    new THREE.Vector3();


function updateMovement(delta) {

    if (!player)
        return;


    // --------------------------------------------------------
    // Keyboard aliases
    // --------------------------------------------------------

    const forwardInput =
        (
            keys["KeyW"] ||
            keys["ArrowUp"]
        ) ? 1 : 0;

    const backwardInput =
        (
            keys["KeyS"] ||
            keys["ArrowDown"]
        ) ? 1 : 0;

    const leftInput =
        (
            keys["KeyA"] ||
            keys["ArrowLeft"]
        ) ? 1 : 0;

    const rightInput =
        (
            keys["KeyD"] ||
            keys["ArrowRight"]
        ) ? 1 : 0;


    const verticalUp =
        keys["Space"] ? 1 : 0;

    const verticalDown =
        (
            keys["ControlLeft"] ||
            keys["ControlRight"]
        ) ? 1 : 0;


    // --------------------------------------------------------
    // Camera-relative forward direction
    // --------------------------------------------------------

    forward.set(
        Math.sin(mouseX),
        0,
        Math.cos(mouseX)
    );

    forward.normalize();


    // Camera-relative right
    right.set(
        forward.z,
        0,
        -forward.x
    );

    right.normalize();


    moveDirection.set(
        0,
        0,
        0
    );


    if (forwardInput)
        moveDirection.add(forward);

    if (backwardInput)
        moveDirection.sub(forward);

    if (rightInput)
        moveDirection.add(right);

    if (leftInput)
        moveDirection.sub(right);


    if (
        moveDirection.lengthSq() > 0
    ) {

        moveDirection.normalize();

    }


    // --------------------------------------------------------
    // Speed
    // --------------------------------------------------------

    const boosting =
        keys["ShiftLeft"] ||
        keys["ShiftRight"];

    const targetSpeed =
        boosting
            ? playerState.boostSpeed
            : playerState.maxSpeed;


    const hasMovement =
        moveDirection.lengthSq() > 0;


    if (hasMovement) {

        playerState.speed =
            THREE.MathUtils.damp(
                playerState.speed,
                targetSpeed,
                playerState.acceleration,
                delta
            );

    }
    else {

        playerState.speed =
            THREE.MathUtils.damp(
                playerState.speed,
                0,
                playerState.braking,
                delta
            );

    }


    // --------------------------------------------------------
    // Horizontal movement
    // --------------------------------------------------------

    if (hasMovement) {

        playerState.velocity.x =
            moveDirection.x *
            playerState.speed;

        playerState.velocity.z =
            moveDirection.z *
            playerState.speed;

    }
    else {

        playerState.velocity.x =
            THREE.MathUtils.damp(
                playerState.velocity.x,
                0,
                playerState.braking,
                delta
            );

        playerState.velocity.z =
            THREE.MathUtils.damp(
                playerState.velocity.z,
                0,
                playerState.braking,
                delta
            );

    }


    // --------------------------------------------------------
    // Vertical movement
    // --------------------------------------------------------

    const verticalInput =
        verticalUp -
        verticalDown;


    if (
        verticalInput !== 0
    ) {

        playerState.verticalSpeed =
            THREE.MathUtils.damp(
                playerState.verticalSpeed,
                verticalInput *
                playerState.verticalMax,
                12,
                delta
            );

    }
    else {

        playerState.verticalSpeed =
            THREE.MathUtils.damp(
                playerState.verticalSpeed,
                0,
                9,
                delta
            );

    }


    playerState.velocity.y =
        playerState.verticalSpeed;


    // --------------------------------------------------------
    // Apply movement
    // --------------------------------------------------------

    const next =
        playerState.position.clone();

    next.x +=
        playerState.velocity.x *
        delta;

    next.y +=
        playerState.velocity.y *
        delta;

    next.z +=
        playerState.velocity.z *
        delta;


    // --------------------------------------------------------
    // Vertical boundaries
    // --------------------------------------------------------

    next.y =
        THREE.MathUtils.clamp(
            next.y,
            1.5,
            15.5
        );


    // --------------------------------------------------------
    // Museum collision
    // --------------------------------------------------------

    const safePosition =
        constrainToMuseum(
            next,
            playerState.position
        );


    playerState.position.copy(
        safePosition
    );


    playerRoot.position.copy(
        playerState.position
    );


    // --------------------------------------------------------
    // Ship rotation
    // --------------------------------------------------------

    if (
        hasMovement
    ) {

        const targetYaw =
            Math.atan2(
                moveDirection.x,
                moveDirection.z
            );

        playerState.yaw =
            THREE.MathUtils.damp(
                playerState.yaw,
                targetYaw,
                8,
                delta
            );

    }


    playerRoot.rotation.y =
        playerState.yaw;

}


// ============================================================
// HEXAGON COLLISION
// ============================================================

const MUSEUM_RADIUS =
    34.0;

const PLAYER_RADIUS =
    1.15;

const WALL_MARGIN =
    1.0;


// Regular hexagon half-plane test.
// Front side contains entrance opening.

function constrainToMuseum(
    desired,
    current
) {

    const result =
        desired.clone();


    const apothem =
        MUSEUM_RADIUS *
        Math.cos(
            Math.PI / 6
        );


    const sides = 6;


    for (
        let i = 0;
        i < sides;
        i++
    ) {

        const angle =
            i *
            Math.PI /
            3;


        // outward normal
        const nx =
            Math.cos(angle);

        const nz =
            Math.sin(angle);


        const distance =
            result.x * nx +
            result.z * nz;


        const limit =
            apothem -
            PLAYER_RADIUS -
            WALL_MARGIN;


        // ----------------------------------------------------
        // Front entrance
        //
        // Front side is approximately +Z.
        // Leave central doorway open.
        // ----------------------------------------------------

        const frontSide =
            nz > 0.8;


        const insideEntrance =
            Math.abs(
                result.x
            ) < ENTRANCE_HALF_WIDTH &&
            result.z > 25;


        if (
            frontSide &&
            insideEntrance
        ) {

            continue;

        }


        if (
            distance > limit
        ) {

            const excess =
                distance -
                limit;

            result.x -=
                nx *
                excess;

            result.z -=
                nz *
                excess;

        }

    }


    return result;

}


const ENTRANCE_HALF_WIDTH =
    6.0;


// ============================================================
// CAMERA
// ============================================================

const desiredCameraPosition =
    new THREE.Vector3();

const cameraLookTarget =
    new THREE.Vector3();


function updateCamera(delta) {

    if (!player)
        return;


    // Camera orbit direction
    const horizontal =
        cameraState.distance *
        Math.cos(
            mouseY
        );


    desiredCameraPosition.set(

        playerState.position.x
        - Math.sin(mouseX) *
          horizontal,

        playerState.position.y
        + cameraState.height
        + Math.sin(mouseY) *
          cameraState.distance,

        playerState.position.z
        - Math.cos(mouseX) *
          horizontal

    );


    // --------------------------------------------------------
    // Smooth camera
    // --------------------------------------------------------

    camera.position.lerp(
        desiredCameraPosition,
        1 -
        Math.exp(
            -cameraState.smoothness *
            delta
        )
    );


    cameraLookTarget.set(

        playerState.position.x,

        playerState.position.y
        + cameraState.lookHeight,

        playerState.position.z

    );


    camera.lookAt(
        cameraLookTarget
    );

}


// ============================================================
// SUBTLE SHIP HOVER
// ============================================================

let hoverTime = 0;


function updateHover(delta) {

    if (!player)
        return;


    hoverTime += delta;


    const hover =
        Math.sin(
            hoverTime * 2.4
        ) *
        0.045;


    player.position.y =
        hover;


}


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// CLOCK
// ============================================================

const clock =
    new THREE.Clock();


// ============================================================
// MAIN LOOP
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updateMovement(
        delta
    );


    updateCamera(
        delta
    );


    updateHover(
        delta
    );


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
