<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DRAVYA Museum</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            #071a42 0%,
            #020817 45%,
            #000 100%
        );

    color: white;
}

#loading h1 {
    margin: 0 0 12px 0;
    font-size: 42px;
    letter-spacing: 8px;
}

#loading p {
    margin: 5px;
    opacity: 0.7;
}

#loadingBar {
    width: 280px;
    height: 3px;
    margin-top: 25px;
    background: rgba(255,255,255,0.15);
    overflow: hidden;
}

#loadingProgress {
    width: 0%;
    height: 100%;
    background: #00d9ff;
    transition: width 0.2s ease;
}

#error {
    display: none;

    position: fixed;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: min(700px, 85vw);

    padding: 25px;

    background: rgba(10,10,20,0.95);
    border: 1px solid rgba(0,220,255,0.5);

    color: white;

    z-index: 20;
}

#error h2 {
    color: #00d9ff;
}

#error pre {
    white-space: pre-wrap;
    color: #ff8f8f;
}

#hud {
    position: fixed;
    left: 25px;
    top: 25px;

    z-index: 5;

    color: white;

    pointer-events: none;

    text-shadow:
        0 0 10px rgba(0,200,255,0.8);
}

#hud .title {
    font-size: 18px;
    letter-spacing: 4px;
}

#hud .subtitle {
    margin-top: 5px;
    font-size: 11px;
    opacity: 0.6;
    letter-spacing: 2px;
}

#controls {
    position: fixed;
    right: 25px;
    bottom: 25px;

    z-index: 5;

    padding: 12px 16px;

    color: rgba(255,255,255,0.65);

    font-size: 11px;

    background: rgba(0,0,0,0.3);

    border:
        1px solid
        rgba(255,255,255,0.12);

    pointer-events: none;
}

#crosshair {
    position: fixed;
    left: 50%;
    top: 50%;

    width: 5px;
    height: 5px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255,255,255,0.8);

    box-shadow:
        0 0 10px #00d9ff;

    z-index: 5;

    pointer-events: none;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="loading">

    <h1>DRAVYA</h1>

    <p id="loadingText">
        Initialising field...
    </p>

    <div id="loadingBar">
        <div id="loadingProgress"></div>
    </div>

</div>

<div id="error">

    <h2>DRAVYA FIELD ERROR</h2>

    <p>
        Something prevented the museum from loading.
    </p>

    <pre id="errorText"></pre>

</div>

<div id="hud">

    <div class="title">
        DRAVYA MUSEUM
    </div>

    <div class="subtitle">
        OBSERVE · DISTURB · CREATE
    </div>

</div>

<div id="crosshair"></div>

<div id="controls">

    W A S D — MOVE<br>
    MOUSE — LOOK<br>
    SHIFT — ACCELERATE<br>
    SPACE — HOVER

</div>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script type="importmap">

{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}

</script>


<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


// ======================================================
// BASIC SETUP
// ======================================================

const canvas =
    document.getElementById("canvas");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const loadingProgress =
    document.getElementById("loadingProgress");

const errorBox =
    document.getElementById("error");

const errorText =
    document.getElementById("errorText");


const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x020612);


// ======================================================
// CAMERA
// ======================================================

const camera =
    new THREE.PerspectiveCamera(
        65,
        window.innerWidth /
        window.innerHeight,
        0.01,
        5000
    );


// ======================================================
// RENDERER
// ======================================================

const renderer =
    new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: false
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.15;


// ======================================================
// LIGHTING
// ======================================================

const ambient =
    new THREE.HemisphereLight(
        0x9bcaff,
        0x03030a,
        1.8
    );

scene.add(ambient);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

keyLight.position.set(
    20,
    40,
    20
);

scene.add(keyLight);


const blueLight =
    new THREE.PointLight(
        0x0088ff,
        900,
        80
    );

blueLight.position.set(
    0,
    8,
    0
);

scene.add(blueLight);


const purpleLight =
    new THREE.PointLight(
        0x8b00ff,
        700,
        70
    );

purpleLight.position.set(
    15,
    5,
    -15
);

scene.add(purpleLight);


// ======================================================
// LOADER
// ======================================================

const loader =
    new GLTFLoader();


// ======================================================
// WORLD / PLAYER
// ======================================================

let museum = null;

let player = null;

let playerRoot = null;

let playerReady = false;

let museumReady = false;


// ======================================================
// PLAYER STATE
// ======================================================

const keys = {};

let yaw = 0;

let pitch = 0;

let mouseActive = false;

let verticalVelocity = 0;

let targetHeight = 0;


// ======================================================
// MOVEMENT SETTINGS
// ======================================================

const movement = {

    speed: 4.5,

    fastSpeed: 10,

    acceleration: 12,

    deceleration: 8

};

const velocity =
    new THREE.Vector3();


// ======================================================
// START POSITION
// ======================================================
//
// IMPORTANT:
//
// We initially put the ship near the origin.
//
// If your museum's actual entrance is elsewhere,
// change these three numbers.
//

const START_POSITION =
    new THREE.Vector3(
        0,
        1.5,
        8
    );


// ======================================================
// LOAD MUSEUM
// ======================================================

function loadMuseum() {

    loadingText.textContent =
        "Loading DRAVYA Museum...";

    loader.load(
    "./museum/models/museum.glb",

        function(gltf) {

            museum =
                gltf.scene;

            museum.name =
                "DRAVYA_MUSEUM";

            scene.add(museum);

            museumReady = true;


            // ------------------------------------------
            // Normalize strange GLB scale if necessary
            // ------------------------------------------

            const box =
                new THREE.Box3()
                    .setFromObject(museum);

            const size =
                new THREE.Vector3();

            box.getSize(size);

            console.log(
                "Museum size:",
                size
            );


            // ------------------------------------------
            // Center ONLY if model is wildly offset
            // ------------------------------------------

            const center =
                new THREE.Vector3();

            box.getCenter(center);

            console.log(
                "Museum center:",
                center
            );


            // ------------------------------------------
            // Enable shadows
            // ------------------------------------------

            museum.traverse(
                function(object) {

                    if (object.isMesh) {

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;

                        if (
                            object.material
                        ) {

                            object.material
                                .side =
                                THREE.DoubleSide;

                        }

                    }

                }
            );


            updateLoading();

        },

        function(progress) {

            if (
                progress.total > 0
            ) {

                const percent =
                    (
                        progress.loaded /
                        progress.total
                    ) * 100;

                loadingProgress.style.width =
                    percent + "%";

                loadingText.textContent =
                    "Loading museum " +
                    Math.round(percent) +
                    "%";

            }

        },

        function(error) {

            showError(
                "MUSEUM FAILED TO LOAD",
                error
            );

        }

    );

}


// ======================================================
// LOAD PLAYER SHIP
// ======================================================

function loadPlayer() {

    loadingText.textContent =
        "Loading DRAVYA vessel...";

    loader.load(
    "./museum/models/player_ship.glb",

        function(gltf) {

            player =
                gltf.scene;

            player.name =
                "PLAYER_SHIP";

            playerRoot =
                player;


            // ------------------------------------------
            // Scale
            // ------------------------------------------

            player.scale.set(
                1,
                1,
                1
            );


            // ------------------------------------------
            // Place ship
            // ------------------------------------------

            player.position.copy(
                START_POSITION
            );


            // ------------------------------------------
            // Rotate ship
            // ------------------------------------------

            player.rotation.y =
                Math.PI;


            // ------------------------------------------
            // Materials
            // ------------------------------------------

            player.traverse(
                function(object) {

                    if (object.isMesh) {

                        object.castShadow =
                            true;

                        object.receiveShadow =
                            true;

                        if (
                            object.material
                        ) {

                            object.material =
                                object.material
                                    .clone();

                            object.material
                                .side =
                                THREE.DoubleSide;

                        }

                    }

                }
            );


            scene.add(player);

            playerReady = true;


            // ------------------------------------------
            // Animation
            // ------------------------------------------

            if (
                gltf.animations &&
                gltf.animations.length > 0
            ) {

                const mixer =
                    new THREE.AnimationMixer(
                        player
                    );

                for (
                    const clip
                    of gltf.animations
                ) {

                    mixer.clipAction(
                        clip
                    ).play();

                }

                player.userData.mixer =
                    mixer;

            }


            updateLoading();

        },

        function(progress) {

            if (
                progress.total > 0
            ) {

                const percent =
                    (
                        progress.loaded /
                        progress.total
                    ) * 100;

                loadingText.textContent =
                    "Loading vessel " +
                    Math.round(percent) +
                    "%";

            }

        },

        function(error) {

            showError(
                "PLAYER SHIP FAILED TO LOAD",
                error
            );

        }

    );

}


// ======================================================
// LOADING STATE
// ======================================================

function updateLoading() {

    if (
        museumReady &&
        playerReady
    ) {

        loadingProgress.style.width =
            "100%";

        loadingText.textContent =
            "Entering the DRAVYA field...";


        setTimeout(
            function() {

                loading.style.display =
                    "none";

            },
            800
        );

    }

}


// ======================================================
// ERROR
// ======================================================

function showError(title, error) {

    console.error(
        title,
        error
    );

    errorBox.style.display =
        "block";

    errorText.textContent =
        title +
        "\n\n" +
        "Check that:\n" +
        "1. index.html is beside the models folder\n" +
        "2. museum.glb exists\n" +
        "3. player_ship.glb exists\n" +
        "4. You are running this through GitHub Pages / a web server\n\n" +
        "Path attempted:\n" +
        "./models/\n\n" +
        String(error);

}


// ======================================================
// KEYBOARD
// ======================================================

window.addEventListener(
    "keydown",
    function(event) {

        keys[event.code] = true;

        if (
            [
                "KeyW",
                "KeyA",
                "KeyS",
                "KeyD",
                "Space",
                "ShiftLeft",
                "ShiftRight"
            ].includes(event.code)
        ) {

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[event.code] = false;

    }
);


// ======================================================
// MOUSE CONTROL
// ======================================================

window.addEventListener(
    "click",
    function() {

        if (
            document.pointerLockElement !==
            document.body
        ) {

            document.body.requestPointerLock();

        }

    }
);


document.addEventListener(
    "pointerlockchange",
    function() {

        mouseActive =
            document.pointerLockElement ===
            document.body;

    }
);


document.addEventListener(
    "mousemove",
    function(event) {

        if (!mouseActive) {
            return;
        }

        const sensitivity =
            0.0025;

        yaw -=
            event.movementX *
            sensitivity;

        pitch -=
            event.movementY *
            sensitivity;


        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -1.0,
                1.0
            );

    }
);


// ======================================================
// MOVEMENT
// ======================================================

function updatePlayer(delta) {

    if (!playerReady) {
        return;
    }


    const forward =
        new THREE.Vector3(
            Math.sin(yaw),
            0,
            Math.cos(yaw)
        );


    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );


    const direction =
        new THREE.Vector3();


    if (keys["KeyW"]) {

        direction.add(
            forward
        );

    }

    if (keys["KeyS"]) {

        direction.sub(
            forward
        );

    }

    if (keys["KeyD"]) {

        direction.add(
            right
        );

    }

    if (keys["KeyA"]) {

        direction.sub(
            right
        );

    }


    if (
        direction.lengthSq() > 0
    ) {

        direction.normalize();

    }


    const maxSpeed =
        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        )
        ?
        movement.fastSpeed
        :
        movement.speed;


    const desired =
        direction.multiplyScalar(
            maxSpeed
        );


    velocity.x =
        THREE.MathUtils.damp(
            velocity.x,
            desired.x,
            direction.lengthSq()
                ? movement.acceleration
                : movement.deceleration,
            delta
        );

    velocity.z =
        THREE.MathUtils.damp(
            velocity.z,
            desired.z,
            direction.lengthSq()
                ? movement.acceleration
                : movement.deceleration,
            delta
        );


    player.position.x +=
        velocity.x * delta;

    player.position.z +=
        velocity.z * delta;


    // -----------------------------------------------
    // Hover
    // -----------------------------------------------

    if (keys["Space"]) {

        targetHeight +=
            4 * delta;

    }


    targetHeight =
        THREE.MathUtils.clamp(
            targetHeight,
            0,
            4
        );


    const desiredY =
        START_POSITION.y +
        targetHeight;


    player.position.y =
        THREE.MathUtils.damp(
            player.position.y,
            desiredY,
            8,
            delta
        );


    // -----------------------------------------------
    // Ship orientation
    // -----------------------------------------------

    const targetRotation =
        Math.atan2(
            velocity.x,
            velocity.z
        );


    if (
        velocity.lengthSq() > 0.01
    ) {

        player.rotation.y =
            THREE.MathUtils.damp(
                player.rotation.y,
                targetRotation,
                7,
                delta
            );

    }

}


// ======================================================
// CAMERA
// ======================================================

function updateCamera(delta) {

    if (!playerReady) {
        return;
    }


    const cameraDistance =
        7;


    const cameraHeight =
        3.4;


    const behind =
        new THREE.Vector3(
            0,
            cameraHeight,
            -cameraDistance
        );


    behind.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        player.rotation.y
    );


    const desiredPosition =
        player.position
            .clone()
            .add(behind);


    camera.position.lerp(
        desiredPosition,
        1 -
        Math.pow(
            0.001,
            delta
        )
    );


    const lookTarget =
        player.position
            .clone();


    lookTarget.y +=
        0.7;


    camera.lookAt(
        lookTarget
    );

}


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ======================================================
// CLOCK
// ======================================================

const clock =
    new THREE.Clock();


// ======================================================
// ANIMATION LOOP
// ======================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updatePlayer(
        delta
    );


    updateCamera(
        delta
    );


    if (
        player &&
        player.userData.mixer
    ) {

        player.userData.mixer.update(
            delta
        );

    }


    renderer.render(
        scene,
        camera
    );

}


animate();


// ======================================================
// START LOADING
// ======================================================

loadMuseum();

loadPlayer();

</script>

</body>
</html>
