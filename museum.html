<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

}

<script type="module">


import * as THREE
from 'three';

import {
    GLTFLoader
}
from 'three/addons/loaders/GLTFLoader.js';


// ========================================================
// CONFIGURATION
// ========================================================

const MUSEUM_URL =
    './museum/models/museum.glb';

const AVATAR_URL =
    './museum/models/avatar.glb';


// ========================================================
// SCENE
// ========================================================

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x02040a);


// ========================================================
// FOG
// ========================================================

scene.fog =
    new THREE.Fog(
        0x02040a,
        35,
        100
    );


// ========================================================
// CAMERA
// ========================================================

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.05,
        500
    );


// Camera is positioned like a human
camera.position.set(
    0,
    1.7,
    -14
);


// ========================================================
// RENDERER
// ========================================================

const renderer =
    new THREE.WebGLRenderer({

        antialias: true,

        powerPreference:
            'high-performance'

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


// ========================================================
// LIGHTING
// ========================================================

const hemi =
    new THREE.HemisphereLight(
        0x6688ff,
        0x02030a,
        1.8
    );

scene.add(hemi);


const mainLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

mainLight.position.set(
    10,
    20,
    10
);

mainLight.castShadow = true;

mainLight.shadow.mapSize.width =
    2048;

mainLight.shadow.mapSize.height =
    2048;

scene.add(mainLight);


// ========================================================
// GLTF LOADER
// ========================================================

const loader =
    new GLTFLoader();


// ========================================================
// MUSEUM
// ========================================================

let museum = null;

let museumLoaded = false;


loader.load(

    MUSEUM_URL,

    function(gltf) {

        museum =
            gltf.scene;

        museum.name =
            'DRAVYA_MUSEUM';

        scene.add(museum);


        // --------------------------------------------
        // Prepare museum meshes
        // --------------------------------------------

        museum.traverse(
            function(object) {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                }

            }
        );


        museumLoaded = true;


        updateLoading(
            100
        );


        setTimeout(
            finishLoading,
            700
        );


        console.log(
            'DRAVYA MUSEUM:',
            museum
        );

    },

    function(xhr) {

        if (xhr.total > 0) {

            const percent =
                xhr.loaded /
                xhr.total *
                100;

            updateLoading(
                Math.min(
                    percent,
                    95
                )
            );

        }

    },

    function(error) {

        console.error(
            'Museum loading error:',
            error
        );

        document.getElementById(
            'loadingText'
        ).textContent =
            'MUSEUM LOAD ERROR';

    }

);


// ========================================================
// AVATAR
// ========================================================

let avatar = null;

let avatarLoaded = false;


loader.load(

    AVATAR_URL,

    function(gltf) {

        avatar =
            gltf.scene;

        avatar.name =
            'DRAVYA_AVATAR';


        avatar.scale.set(
            1,
            1,
            1
        );


        avatar.position.set(
            0,
            0,
            -14
        );


        avatar.traverse(
            function(object) {

                if (
                    object.isMesh
                ) {

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                }

            }
        );


        scene.add(
            avatar
        );


        avatarLoaded = true;


        console.log(
            'AVATAR LOADED:',
            avatar
        );

    },

    undefined,

    function(error) {

        console.warn(
            'avatar.glb not found yet.'
        );

        createTemporaryAvatar();

    }

);


// ========================================================
// TEMPORARY AVATAR
// ========================================================

function createTemporaryAvatar() {

    const geometry =
        new THREE.CapsuleGeometry(
            0.35,
            1.0,
            8,
            16
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x1f66ff,
            roughness: 0.4,
            metalness: 0.2
        });


    avatar =
        new THREE.Mesh(
            geometry,
            material
        );

    avatar.name =
        'TEMPORARY_AVATAR';


    avatar.position.set(
        0,
        1.05,
        -14
    );


    scene.add(
        avatar
    );


    avatarLoaded = true;

}


// ========================================================
// PLAYER STATE
// ========================================================

const player = {

    position:
        new THREE.Vector3(
            0,
            1.7,
            -14
        ),

    velocity:
        new THREE.Vector3(
            0,
            0,
            0
        ),

    height: 1.7,

    radius: 0.35,

    speed: 4.0,

    runSpeed: 7.0,

    jumpForce: 6.0,

    gravity: 18.0,

    grounded: true

};


// ========================================================
// CAMERA LOOK
// ========================================================

let yaw = 0;

let pitch = 0;


const mouseSensitivity =
    0.0022;


document.addEventListener(
    'mousemove',
    function(event) {

        if (
            document.pointerLockElement !==
            renderer.domElement
        ) {

            return;

        }


        yaw -=
            event.movementX *
            mouseSensitivity;


        pitch -=
            event.movementY *
            mouseSensitivity;


        const limit =
            Math.PI / 2 - 0.05;


        pitch =
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );

    }
);


// ========================================================
// POINTER LOCK
// ========================================================

renderer.domElement.addEventListener(
    'click',
    function() {

        renderer.domElement.requestPointerLock();

    }
);


// ========================================================
// KEYBOARD
// ========================================================

const keys = {};


window.addEventListener(
    'keydown',
    function(event) {

        keys[event.code] = true;


        // Jump

        if (
            event.code === 'Space' &&
            player.grounded
        ) {

            player.velocity.y =
                player.jumpForce;

            player.grounded =
                false;

        }


        // Interaction

        if (
            event.code === 'KeyE'
        ) {

            interact();

        }

    }
);


window.addEventListener(
    'keyup',
    function(event) {

        keys[event.code] = false;

    }
);


// ========================================================
// SIMPLE COLLISION SYSTEM
// ========================================================
//
// We use the museum bounding box as the first
// collision boundary.
//
// Later we will replace this with proper
// exhibit / wall collision geometry.
// ========================================================

let museumBox = null;


function updateMuseumBounds() {

    if (!museum) {
        return;
    }

    museumBox =
        new THREE.Box3()
            .setFromObject(museum);

}


// ========================================================
// MOVEMENT
// ========================================================

function updatePlayer(delta) {

    if (!museumLoaded) {
        return;
    }


    const move =
        new THREE.Vector3();


    // Forward / backward

    if (keys['KeyW']) {

        move.z -= 1;

    }

    if (keys['KeyS']) {

        move.z += 1;

    }


    // Left / right

    if (keys['KeyA']) {

        move.x -= 1;

    }

    if (keys['KeyD']) {

        move.x += 1;

    }


    if (
        move.lengthSq() > 0
    ) {

        move.normalize();


        // Rotate movement
        // according to camera yaw

        move.applyAxisAngle(
            new THREE.Vector3(
                0,
                1,
                0
            ),
            yaw
        );


        const speed =
            keys['ShiftLeft'] ||
            keys['ShiftRight']
                ? player.runSpeed
                : player.speed;


        move.multiplyScalar(
            speed * delta
        );


        player.position.add(
            move
        );

    }


    // ----------------------------------------------------
    // Gravity
    // ----------------------------------------------------

    player.velocity.y -=
        player.gravity * delta;


    player.position.y +=
        player.velocity.y * delta;


    // Ground

    if (
        player.position.y <=
        player.height
    ) {

        player.position.y =
            player.height;

        player.velocity.y =
            0;

        player.grounded =
            true;

    }


    // ----------------------------------------------------
    // Keep player inside museum
    // ----------------------------------------------------

    if (museumBox) {

        const padding = 1.0;


        player.position.x =
            THREE.MathUtils.clamp(
                player.position.x,
                museumBox.min.x + padding,
                museumBox.max.x - padding
            );


        player.position.z =
            THREE.MathUtils.clamp(
                player.position.z,
                museumBox.min.z + padding,
                museumBox.max.z - padding
            );

    }


    // ----------------------------------------------------
    // Camera
    // ----------------------------------------------------

    camera.position.copy(
        player.position
    );


    camera.rotation.order =
        'YXZ';


    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;


    // ----------------------------------------------------
    // Avatar
    // ----------------------------------------------------

    if (avatar) {

        avatar.position.set(
            player.position.x,
            0,
            player.position.z
        );


        // Face movement direction

        if (
            move.lengthSq() > 0
        ) {

            const targetAngle =
                Math.atan2(
                    move.x,
                    move.z
                );

            avatar.rotation.y =
                targetAngle;

        }

    }

}


// ========================================================
// INTERACTION SYSTEM
// ========================================================

const interaction =
    document.getElementById(
        'interaction'
    );


let currentInteractable =
    null;


const interactionObjects = [];


function setupInteractions() {

    if (!museum) {
        return;
    }


    museum.traverse(
        function(object) {

            if (
                object.name.includes(
                    'EXHIBIT_DRAVYA_FIELD'
                )
            ) {

                interactionObjects.push({

                    object: object,

                    label:
                        'THE DRAVYA FIELD',

                    action:
                        'matter'

                });

            }


            if (
                object.name.includes(
                    'EXHIBIT_ZDC'
                )
            ) {

                interactionObjects.push({

                    object: object,

                    label:
                        'MY PHYSICS RESEARCH',

                    action:
                        'science'

                });

            }


            if (
                object.name.includes(
                    'EXHIBIT_GRAND_PIANO'
                )
            ) {

                interactionObjects.push({

                    object: object,

                    label:
                        'DRAVYA SOUND',

                    action:
                        'music'

                });

            }


            if (
                object.name.includes(
                    'EXHIBIT_GEOCHRONOLOGY'
                )
            ) {

                interactionObjects.push({

                    object: object,

                    label:
                        'GEOCHRONOLOGY',

                    action:
                        'geochronology'

                });

            }


            if (
                object.name.includes(
                    'EXHIBIT_FICTION'
                )
            ) {

                interactionObjects.push({

                    object: object,

                    label:
                        'FICTION ARCHIVE',

                    action:
                        'fiction'

                });

            }


            if (
                object.name.includes(
                    'PORTAL_BACKROOMS'
                )
            ) {

                interactionObjects.push({

                    object: object,

                    label:
                        'ENTER DRAVYA BACKROOMS',

                    action:
                        'backrooms'

                });

            }

        }
    );

}


// ========================================================
// FIND NEAREST INTERACTION
// ========================================================

function updateInteraction() {

    currentInteractable =
        null;


    let closest =
        Infinity;


    for (
        const item
        of interactionObjects
    ) {

        const position =
            new THREE.Vector3();


        item.object
            .getWorldPosition(
                position
            );


        const distance =
            player.position.distanceTo(
                position
            );


        if (
            distance < 4 &&
            distance < closest
        ) {

            closest =
                distance;

            currentInteractable =
                item;

        }

    }


    if (
        currentInteractable
    ) {

        interaction.style.display =
            'block';


        interaction.innerHTML =
            `[ E ] &nbsp; ${
                currentInteractable.label
            }`;

    }

    else {

        interaction.style.display =
            'none';

    }

}


// ========================================================
// INTERACTION ACTIONS
// ========================================================

function interact() {

    if (
        !currentInteractable
    ) {

        return;

    }


    const action =
        currentInteractable.action;


    console.log(
        'INTERACTION:',
        action
    );


    // -----------------------------------------------
    // These pages don't need to exist yet.
    // We'll connect them later.
    // -----------------------------------------------

    if (
        action === 'matter'
    ) {

        window.location.href =
            './matter.html';

    }


    if (
        action === 'science'
    ) {

        window.location.href =
            './science.html';

    }


    if (
        action === 'music'
    ) {

        window.location.href =
            './sounds.html';

    }


    if (
        action === 'geochronology'
    ) {

        window.location.href =
            './geochronology.html';

    }


    if (
        action === 'fiction'
    ) {

        window.location.href =
            './fiction.html';

    }


    if (
        action === 'backrooms'
    ) {

        loadBackrooms();

    }

}


// ========================================================
// BACKROOMS
// ========================================================

function loadBackrooms() {

    console.log(
        'DRAVYA BACKROOMS REQUESTED'
    );


    /*
        FUTURE:

        museum.glb
             ↓
        fade screen
             ↓
        remove museum
             ↓
        load backrooms.glb
             ↓
        spawn player downstairs

        We will implement this after
        creating the Backrooms world.
    */


    alert(
        'DRAVYA BACKROOMS — COMING SOON'
    );

}


// ========================================================
// LOADING UI
// ========================================================

function updateLoading(percent) {

    document.getElementById(
        'loadingProgress'
    ).style.width =
        percent + '%';

}


function finishLoading() {

    updateMuseumBounds();

    setupInteractions();


    const loading =
        document.getElementById(
            'loading'
        );


    loading.style.opacity =
        '0';


    setTimeout(
        function() {

            loading.style.display =
                'none';

        },
        1000
    );

}


// ========================================================
// ANIMATION
// ========================================================

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.05
        );


    updatePlayer(
        delta
    );


    updateInteraction();


    renderer.render(
        scene,
        camera
    );

}


animate();


// ========================================================
// RESIZE
// ========================================================

window.addEventListener(
    'resize',
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


</script>

</body>
