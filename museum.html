<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DRAVYA — Museum</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #02030a;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            letter-spacing: 3px;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="loading">ENTERING DRAVYA MUSEUM...</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from 'three';

import { GLTFLoader } from
    'three/addons/loaders/GLTFLoader.js';

import { OrbitControls } from
    'three/addons/controls/OrbitControls.js';


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x02030a);


// ============================================================
// CAMERA
// ============================================================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 15);


// ============================================================
// RENDERER
// ============================================================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const ambient = new THREE.HemisphereLight(
    0x6688ff,
    0x050505,
    2
);

scene.add(ambient);


const mainLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

mainLight.position.set(
    10,
    20,
    10
);

scene.add(mainLight);


// ============================================================
// CONTROLS
// ============================================================

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.target.set(
    0,
    2,
    0
);


// ============================================================
// LOAD DRAVYA MUSEUM
// ============================================================

const loader = new GLTFLoader();

loader.load(

    'museum/models/museum.glb',

    function(gltf) {

        const museum = gltf.scene;

        museum.name = 'DRAVYA_MUSEUM';

        scene.add(museum);

        console.log(
            'DRAVYA MUSEUM LOADED',
            museum
        );

        document.getElementById(
            'loading'
        ).style.display = 'none';

    },

    function(xhr) {

        if (xhr.total > 0) {

            const percent =
                (xhr.loaded / xhr.total) * 100;

            document.getElementById(
                'loading'
            ).textContent =
                'LOADING DRAVYA ' +
                Math.round(percent) +
                '%';

        }

    },

    function(error) {

        console.error(
            'Could not load museum.glb:',
            error
        );

        document.getElementById(
            'loading'
        ).textContent =
            'ERROR LOADING DRAVYA MUSEUM';

    }

);


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(
    'resize',
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// ============================================================
// ANIMATION
// ============================================================

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>
</html>
