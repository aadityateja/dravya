<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lotus Land — DRAVYA</title>

    <!-- Existing DRAVYA stylesheet -->
    <link rel="stylesheet" href="style.css">


    <!-- THREE.JS IMPORT MAP -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>


    <style>

        /* =========================================
           LOTUS LAND
           Page-specific styling only
           ========================================= */

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        #lotus-land {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #87a8c4;
        }


        #lotus-land canvas {

            display: block;

            width: 100%;
            height: 100%;
        }


        /* =========================================
           LOADING SCREEN
           ========================================= */

        #loading {

            position: absolute;

            inset: 0;

            z-index: 20;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #050914;

            color: white;

            font-family: Arial, sans-serif;

            font-size: 13px;

            letter-spacing: 0.2em;

            text-transform: uppercase;

            transition:
                opacity 1s ease;
        }


        #loading.hidden {

            opacity: 0;

            pointer-events: none;
        }


        /* =========================================
           ERROR SCREEN
           ========================================= */

        #error {

            position: absolute;

            inset: 0;

            z-index: 30;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 30px;

            box-sizing: border-box;

            background: #050914;

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;

            line-height: 1.6;
        }


        /* =========================================
           WORLD TITLE
           ========================================= */

        #world-title {

            position: absolute;

            left: 30px;
            bottom: 25px;

            z-index: 10;

            color: white;

            font-family: inherit;

            font-size: 12px;

            letter-spacing: 0.25em;

            text-transform: uppercase;

            opacity: 0.75;

            pointer-events: none;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            #world-title {

                left: 18px;

                bottom: 18px;

                font-size: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOTUS LAND CONTAINER
         ========================================= -->

    <main id="lotus-land">


        <!-- Loading -->

        <div id="loading">

            Loading Lotus Land...

        </div>


        <!-- Error -->

        <div id="error">

            <div>

                <strong>
                    Lotus Land could not be loaded.
                </strong>

                <br><br>

                Check the browser console with F12.

            </div>

        </div>


        <!-- Small label -->

        <div id="world-title">

            DRAVYA — LOTUS LAND

        </div>


    </main>



    <!-- =========================================
         THREE.JS
         ========================================= -->

    <script type="module">


        /* =========================================
           IMPORTS
           ========================================= */

        import * as THREE from 'three';

        import {
            GLTFLoader
        } from 'three/addons/loaders/GLTFLoader.js';

        import {
            OrbitControls
        } from 'three/addons/controls/OrbitControls.js';



        /* =========================================
           ELEMENTS
           ========================================= */

        const container =
            document.getElementById('lotus-land');

        const loading =
            document.getElementById('loading');

        const errorBox =
            document.getElementById('error');



        /* =========================================
           SCENE
           ========================================= */

        const scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(0x87a8c4);



        /* =========================================
           CAMERA
           ========================================= */

        const camera =
            new THREE.PerspectiveCamera(

                55,

                window.innerWidth /
                window.innerHeight,

                0.1,

                5000
            );


        camera.position.set(

            20,

            15,

            20
        );



        /* =========================================
           RENDERER
           ========================================= */

        const renderer =
            new THREE.WebGLRenderer({

                antialias: true,

                powerPreference: "high-performance"

            });


        renderer.setPixelRatio(

            Math.min(

                window.devicePixelRatio,

                2
            )
        );


        renderer.setSize(

            window.innerWidth,

            window.innerHeight
        );


        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        renderer.shadowMap.enabled = true;


        renderer.shadowMap.type =
            THREE.PCFSoftShadowMap;


        container.appendChild(

            renderer.domElement
        );



        /* =========================================
           LIGHTING
           ========================================= */

        const hemisphereLight =
            new THREE.HemisphereLight(

                0xddeeff,

                0x31402b,

                2.2
            );


        scene.add(

            hemisphereLight
        );



        /* =========================================
           SUN
           ========================================= */

        const sun =
            new THREE.DirectionalLight(

                0xffffff,

                3.5
            );


        sun.position.set(

            50,

            80,

            30
        );


        sun.castShadow = true;


        sun.shadow.mapSize.width = 2048;

        sun.shadow.mapSize.height = 2048;


        scene.add(

            sun
        );



        /* =========================================
           ORBIT CONTROLS
           ========================================= */

        const controls =
            new OrbitControls(

                camera,

                renderer.domElement
            );


        controls.enableDamping = true;


        controls.dampingFactor =
            0.05;


        controls.maxPolarAngle =
            Math.PI * 0.49;


        controls.minDistance = 1;


        controls.maxDistance = 1000;



        /* =========================================
           GLB LOADER
           ========================================= */

        const loader =
            new GLTFLoader();


        loader.load(

            /*
             * YOUR EXACT FILE
             */

            'assets/lotus%20land.glb',


            /* =====================================
               SUCCESS
               ===================================== */

            function (gltf) {


                console.log(
                    "LOTUS LAND GLB LOADED"
                );


                const world =
                    gltf.scene;


                scene.add(
                    world
                );



                /* =================================
                   ENABLE SHADOWS
                   ================================= */

                world.traverse(

                    function (object) {


                        if (
                            object.isMesh
                        ) {

                            object.castShadow =
                                true;


                            object.receiveShadow =
                                true;

                        }

                    }
                );



                /* =================================
                   CALCULATE WORLD SIZE
                   ================================= */

                const box =
                    new THREE.Box3()
                        .setFromObject(
                            world
                        );


                const center =
                    box.getCenter(

                        new THREE.Vector3()
                    );


                const size =
                    box.getSize(

                        new THREE.Vector3()
                    );


                const maxDimension =
                    Math.max(

                        size.x,

                        size.y,

                        size.z
                    );


                console.log(
                    "World size:",
                    size
                );



                /* =================================
                   AUTOMATIC CAMERA POSITION
                   ================================= */

                const distance =
                    Math.max(

                        maxDimension * 0.9,

                        5
                    );


                camera.position.set(

                    center.x + distance,

                    center.y +
                    distance * 0.55,

                    center.z + distance
                );



                /* =================================
                   CAMERA CLIPPING
                   ================================= */

                camera.near =
                    Math.max(

                        maxDimension / 10000,

                        0.01
                    );


                camera.far =
                    Math.max(

                        maxDimension * 20,

                        1000
                    );


                camera.updateProjectionMatrix();



                /* =================================
                   CONTROLS TARGET
                   ================================= */

                controls.target.copy(

                    center
                );


                controls.maxDistance =
                    Math.max(

                        maxDimension * 5,

                        100
                    );


                controls.update();



                /* =================================
                   REMOVE LOADING SCREEN
                   ================================= */

                loading.classList.add(

                    'hidden'
                );


                /*
                 * Remove loading element
                 * after the fade.
                 */

                setTimeout(

                    function () {

                        loading.remove();

                    },

                    1200
                );

            },


            /* =====================================
               LOADING PROGRESS
               ===================================== */

            function (progress) {


                if (
                    progress.total > 0
                ) {


                    const percent =
                        Math.round(

                            (
                                progress.loaded /
                                progress.total
                            ) * 100
                        );


                    loading.textContent =
                        `Loading Lotus Land... ${percent}%`;

                }

            },


            /* =====================================
               ERROR
               ===================================== */

            function (error) {


                console.error(

                    "LOTUS LAND ERROR:",

                    error
                );


                loading.style.display =
                    'none';


                errorBox.style.display =
                    'flex';

            }

        );



        /* =========================================
           RESIZE
           ========================================= */

        window.addEventListener(

            'resize',

            function () {


                camera.aspect =

                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(

                    window.innerWidth,

                    window.innerHeight
                );

            }

        );



        /* =========================================
           ANIMATION LOOP
           ========================================= */

        const clock =
            new THREE.Clock();


        function animate() {


            requestAnimationFrame(

                animate
            );


            const time =
                clock.getElapsedTime();


            /*
             * We'll use `time` later for:
             *
             * clouds
             * wind
             * water
             * particles
             * day/night
             * etc.
             */


            controls.update();


            renderer.render(

                scene,

                camera
            );

        }


        animate();


    </script>


</body>

</html>
