<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lotus Land — DRAVYA</title>

    <!-- Keep your existing DRAVYA stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           LOTUS LAND — PAGE SPECIFIC STYLES
           ========================================= */

        body {
            margin: 0;
            overflow: hidden;
        }

        #lotus-land {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #050914;
        }

        #lotus-land canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Loading screen */

        #loading {
            position: absolute;
            inset: 0;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050914;

            font-family: inherit;
            font-size: 14px;
            letter-spacing: 0.2em;
            text-transform: uppercase;

            transition: opacity 0.8s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Small DRAVYA label */

        #world-label {
            position: absolute;
            left: 30px;
            bottom: 25px;

            z-index: 5;

            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.25em;
            text-transform: uppercase;

            opacity: 0.7;
            pointer-events: none;
        }

        /* Mobile */

        @media (max-width: 600px) {

            #world-label {
                left: 18px;
                bottom: 18px;
                font-size: 10px;
            }

        }
    </style>
</head>

<body>

    <!-- =========================================
         LOTUS LAND
         ========================================= -->

    <main id="lotus-land">

        <div id="loading">
            Loading Lotus Land...
        </div>

        <div id="world-label">
            DRAVYA — LOTUS LAND
        </div>

    </main>


    <!-- =========================================
         THREE.JS
         ========================================= -->

    <script type="module">

        import * as THREE from
            'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

        import { GLTFLoader } from
            'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

        import { OrbitControls } from
            'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';


        /* =========================================
           BASIC SETUP
           ========================================= */

        const container = document.getElementById("lotus-land");
        const loading = document.getElementById("loading");

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x87a8c4);


        /* =========================================
           CAMERA
           ========================================= */

        const camera = new THREE.PerspectiveCamera(
            55,
            window.innerWidth / window.innerHeight,
            0.1,
            5000
        );

        camera.position.set(20, 15, 20);


        /* =========================================
           RENDERER
           ========================================= */

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.outputColorSpace = THREE.SRGBColorSpace;

        renderer.shadowMap.enabled = true;

        container.appendChild(renderer.domElement);


        /* =========================================
           LIGHTING
           ========================================= */

        const ambientLight = new THREE.HemisphereLight(
            0xb9d7ff,
            0x31402b,
            2.0
        );

        scene.add(ambientLight);


        const sun = new THREE.DirectionalLight(
            0xffffff,
            3.0
        );

        sun.position.set(
            50,
            80,
            30
        );

        sun.castShadow = true;

        scene.add(sun);


        /* =========================================
           CONTROLS
           ========================================= */

        const controls = new OrbitControls(
            camera,
            renderer.domElement
        );

        controls.enableDamping = true;

        controls.dampingFactor = 0.05;

        controls.maxPolarAngle = Math.PI * 0.49;

        controls.minDistance = 2;

        controls.maxDistance = 500;


        /* =========================================
           LOAD BLENDER WORLD
           ========================================= */

        const loader = new GLTFLoader();

        loader.load(

            'assets/lotus%20land.glb',

            function (gltf) {

                const world = gltf.scene;

                scene.add(world);


                /* -------------------------------------
                   ENABLE SHADOWS
                   ------------------------------------- */

                world.traverse(function (object) {

                    if (object.isMesh) {

                        object.castShadow = true;
                        object.receiveShadow = true;

                    }

                });


                /* -------------------------------------
                   FIND WORLD SIZE
                   ------------------------------------- */

                const box = new THREE.Box3()
                    .setFromObject(world);

                const center = box.getCenter(
                    new THREE.Vector3()
                );

                const size = box.getSize(
                    new THREE.Vector3()
                );

                const maxDimension = Math.max(
                    size.x,
                    size.y,
                    size.z
                );


                /* -------------------------------------
                   CENTER CAMERA ON WORLD
                   ------------------------------------- */

                const distance = maxDimension * 0.9;

                camera.position.set(
                    center.x + distance,
                    center.y + distance * 0.55,
                    center.z + distance
                );

                controls.target.copy(center);

                controls.update();


                /* -------------------------------------
                   FINISHED LOADING
                   ------------------------------------- */

                loading.classList.add("hidden");

                console.log("LOTUS LAND LOADED");
                console.log("World size:", size);

            },

            function (progress) {

                if (progress.total > 0) {

                    const percent =
                        (progress.loaded / progress.total) * 100;

                    console.log(
                        "Loading:",
                        percent.toFixed(0) + "%"
                    );

                }

            },

            function (error) {

                console.error(
                    "Failed to load Lotus Land:",
                    error
                );

                loading.textContent =
                    "Unable to load Lotus Land";

            }

        );


        /* =========================================
           RESIZE
           ========================================= */

        window.addEventListener(
            "resize",
            function () {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );


        /* =========================================
           ANIMATION LOOP
           ========================================= */

        const clock = new THREE.Clock();

        function animate() {

            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            controls.update();

            renderer.render(
                scene,
                camera
            );

        }

        animate();

    </script>

</body>

</html>
